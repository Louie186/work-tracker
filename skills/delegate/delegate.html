<!doctype html>
<!--
  SKILL: Delegation — give tasks to your team / outsource
  ─────────────────────────────────────────────────────────────────────
  Views:   List (by group) · Board (by status) · Calendar (by due date) · Overview (people, groups, files, history)
  Checklist generator: one task + many items (typed, numbered, or from a MIDP Checker list)
  Excel:   ⬇ makes a planner file (planner-excel.js) your team fills in
           ⬆ reads their file back and shows what changed before applying
  Data:    localStorage "lt_delegate_v1" — belongs to the open project
           (listed as projectKeys in the SKILL LIST, so it moves with it)
  Team:    names are shared with QA/QC and Register ("lews_team_v1")
-->

table.chg th { color: var(--muted); font-size: 11px; text-transform: uppercase; }
.warn { padding: 8px 12px; border-radius: 10px; background: color-mix(in srgb, var(--amber) 14%, transparent); border: 1px solid color-mix(in srgb, var(--amber) 40%, transparent); margin-bottom: 10px; font-size: 13px; }
.toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%) translateY(20px); background: var(--bg2); border: 1px solid var(--line); color: var(--ink); padding: 9px 16px; border-radius: 99px; opacity: 0; transition: .25s; pointer-events: none; z-index: 60; box-shadow: var(--shadow); }
.toast.show { opacity: 1; transform: translateX(-50%); }
/* 8-bit skins: square chips too */

<!-- Lew's Tracker: one theme for every tab -->
<link rel="stylesheet" href="../../core/theme.css">
<script src="../../core/theme.js"></script>
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo">⇶</span><div><h1>Delegation</h1><div class="small" id="projName"></div></div></div>
  <div class="kpis" id="kpis"></div>
  <div class="actions">
    <button class="btn primary" data-act="new">+ Task</button>
    <button class="btn" data-act="gen" title="One task with many checklist items — like ADD TASK in your Excel. Tip: copy rows in Excel and press Ctrl+V here">✚ Checklist</button>
    <button class="btn" data-act="excel" title="Make a Task Pack or Excel for someone who doesn't use this website">⬇ Share tasks</button>
    <label class="btn" title="Read a reply file or Excel your team sent back">⬆ Import update<input type="file" id="impFile" accept=".xlsx,.xlsm,.txt,.json" multiple hidden></label>
    <button class="btn" data-act="paste" title="Paste a reply someone copied into an email or Teams">📋 Paste reply</button>
    <button class="btn" data-act="groups">Groups</button>
    <button class="btn" type="button" data-offline="delegate" style="display:none" title="One file that works with no website and no internet — your tasks come along">⬇ Offline copy</button>
  </div>
</header>
<div class="toolbar">
  <div class="seg" id="viewSeg"><button data-view="list">☰ List</button><button data-view="board">▥ Board</button><button data-view="cal">▦ Calendar</button><button data-view="team">👥 Team</button><button data-view="stats">📊 Overview</button></div>
  <input type="search" id="q" placeholder="Search tasks, notes, IDs…">
  <select id="fGroup" title="Group"></select>
  <select id="fPerson" title="Person"></select>
  <select id="fStatus" title="Status"><option value="">All statuses</option><option>Not started</option><option>In progress</option><option>Completed</option><option value="late">Overdue</option></select>
  <label class="small" style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="fDone"> Show completed</label>
</div>
<main id="main"></main>
<div class="modal" id="modal"><div class="modal-card" id="modalCard"></div></div>
<div class="toast" id="toast"></div>

<script src="../../core/todo-link.js"></script>
<script src="planner-excel.js"></script>
<script src="taskpack.js"></script>
<script src="xlsm-template.js"></script>
<script>
(function () {
  'use strict';
  /* ===== 1. Data ===== */
  var KEY = 'lt_delegate_v1', UI_KEY = 'lt_delegate_ui_v1', TEAM_KEY = 'lews_team_v1';
  var ST = ['Not started', 'In progress', 'Completed'];
  var $ = function (id) { return document.getElementById(id); };
  function readJSON(k, d) { try { var v = JSON.parse(localStorage.getItem(k) || 'null'); return v == null ? d : v; } catch (e) { return d; } }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function uid(p) { return (p || 'x') + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function iso() { return new Date().toISOString(); }
  // the day something was finished (Team view: "done this week")
  function stampDone(x) { if (x.status === 'Completed') { if (!x.doneAt) x.doneAt = TODAY; } else if (x.doneAt) delete x.doneAt; }
  function dkey(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  var TODAY = dkey(new Date());
  function fmtDate(s) { if (!s) return ''; var d = new Date(s + 'T00:00:00'); return isNaN(d) ? s : d.toLocaleDateString(undefined, { day: '2-digit', month: 'short' }); }

  function load() {
    var d = readJSON(KEY, null) || {};
    d.version = 1; d.seq = d.seq || 0; d.groups = d.groups || []; d.tasks = d.tasks || []; d.issued = d.issued || []; d.imports = d.imports || [];
    d.tasks.forEach(function (t) {
      t.subs = t.subs || []; t.history = t.history || [];
      if (ST.indexOf(t.status) < 0) t.status = 'Not started';
      t.subs.forEach(function (s) { if (ST.indexOf(s.status) < 0) s.status = 'Not started'; });
      var n = parseInt(String(t.code || '').replace(/\D/g, ''), 10); if (n > d.seq) d.seq = n;
    });
    return d;
  }
  var D = load();
  var UI = Object.assign({ view: 'list', group: '', person: '', status: '', q: '', showDone: true, month: TODAY.slice(0, 7), collapsed: {}, open: {} }, readJSON(UI_KEY, {}));
  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify(D));
      localStorage.setItem('lt_delegate_updated', iso());
    } catch (e) { toast('⚠ Could not save — browser storage is full'); return; }
    try { if (window.parent !== window && window.parent.__trackerEmbedSaved) window.parent.__trackerEmbedSaved('delegate'); } catch (e) {}
  }
  function saveUI() { try { localStorage.setItem(UI_KEY, JSON.stringify(UI)); } catch (e) {} }
  function team() { return readJSON(TEAM_KEY, []).filter(function (x) { return typeof x === 'string' && x.trim(); }); }
  function teamAdd(names) {
    var t = team(), changed = false;
    names.forEach(function (n) { n = n.trim(); if (n && t.indexOf(n) < 0) { t.push(n); changed = true; } });
    if (changed) { localStorage.setItem(TEAM_KEY, JSON.stringify(t)); localStorage.setItem('lews_team_updated', iso()); }
  }
  function split(s) { return String(s || '').split(/[,;/]+/).map(function (x) { return x.trim(); }).filter(Boolean); }
  function project() {
    var pj = readJSON('lt_projects_v1', null);
    var cur = pj && pj.list && pj.list.filter(function (p) { return p.id === pj.active; })[0];
    return cur || { id: 'default', name: 'Project', code: '' };
  }

  /* ===== 2. Rules ===== */
  function val(s) { return s === 'Completed' ? 1 : s === 'In progress' ? 0.5 : 0; }
  function progress(t) { return t.subs.length ? t.subs.reduce(function (a, s) { return a + val(s.status); }, 0) / t.subs.length : val(t.status); }
  function statusOf(t) { if (!t.subs.length) return t.status; var p = progress(t); return p === 1 ? 'Completed' : p > 0 ? 'In progress' : 'Not started'; }
  function isLate(due, status) { return !!due && due < TODAY && status !== 'Completed'; }
  function cls(s) { return s === 'Completed' ? 'ok' : s === 'In progress' ? 'ip' : 'ns'; }
  function groupName(id) { var g = D.groups.filter(function (x) { return x.id === id; })[0]; return g ? g.name : ''; }
  function findTask(id) { return D.tasks.filter(function (t) { return t.id === id; })[0]; }
  function people() {
    var set = {};
    team().forEach(function (n) { set[n] = 1; });
    D.groups.forEach(function (g) { (g.members || []).forEach(function (n) { set[n] = 1; }); });
    D.tasks.forEach(function (t) { split(t.assignees).forEach(function (n) { set[n] = 1; }); t.subs.forEach(function (s) { split(s.assignees).forEach(function (n) { set[n] = 1; }); }); });
    return Object.keys(set).sort(function (a, b) { return a.localeCompare(b); });
  }
  function hasPerson(t, p) {
    var lp = p.toLowerCase(), hit = function (s) { return split(s).some(function (n) { return n.toLowerCase() === lp; }); };
    // strictly "assigned to": the task itself or one of its subtasks
    return hit(t.assignees) || t.subs.some(function (s) { return hit(s.assignees); });
  }
  function visible() {
    var q = UI.q.toLowerCase();
    return D.tasks.filter(function (t) {
      var st = statusOf(t);
      if (!UI.showDone && st === 'Completed') return false;
      if (UI.group && (UI.group === '_none' ? t.group : t.group !== UI.group)) return false;
      if (UI.person && !hasPerson(t, UI.person)) return false;
      if (UI.status === 'late') { if (!isLate(t.due, st) && !t.subs.some(function (s) { return isLate(s.due || t.due, s.status); })) return false; }
      else if (UI.status && st !== UI.status) return false;
      if (q) {
        var hay = [t.code, t.title, t.notes, t.assignees, groupName(t.group)].concat(t.subs.map(function (s) { return s.code + ' ' + s.title + ' ' + s.notes + ' ' + s.assignees; })).join(' ').toLowerCase();
        if (hay.indexOf(q) < 0) return false;
      }
      return true;
    });
  }

  /* ===== 3. Screens ===== */
  function render() {
    var p = project();
    $('projName').textContent = (p.code ? p.code + ' — ' : '') + p.name;
    var all = D.tasks, open = all.filter(function (t) { return statusOf(t) !== 'Completed'; });
    var late = 0; all.forEach(function (t) { if (t.subs.length) t.subs.forEach(function (s) { if (isLate(s.due || t.due, s.status)) late++; }); else if (isLate(t.due, t.status)) late++; });
    var pct = all.length ? Math.round(all.reduce(function (a, t) { return a + progress(t); }, 0) / all.length * 100) : 0;
    $('kpis').innerHTML = '<div class="kpi"><b>' + all.length + '</b><span>Tasks</span></div><div class="kpi"><b>' + open.length + '</b><span>Open</span></div>' +
      '<div class="kpi' + (late ? ' bad' : '') + '"><b>' + late + '</b><span>Overdue</span></div><div class="kpi"><b>' + pct + '%</b><span>Done</span></div>';
    // toolbar
    document.querySelectorAll('#viewSeg button').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-view') === UI.view); });
    $('fGroup').innerHTML = '<option value="">All groups</option>' + D.groups.map(function (g) { return '<option value="' + esc(g.id) + '">' + esc(g.name) + '</option>'; }).join('') + '<option value="_none">No group</option>';
    $('fGroup').value = UI.group;
    $('fPerson').innerHTML = '<option value="">Everyone</option>' + people().map(function (n) { return '<option>' + esc(n) + '</option>'; }).join('');
    $('fPerson').value = UI.person;
    MX = null;                                   // MIDP tags: read again (the MIDP Checker may have changed)
    $('fStatus').value = UI.status; $('q').value = UI.q; $('fDone').checked = UI.showDone;
    var list = visible();
    if (!D.tasks.length) { $('main').innerHTML = '<div class="card empty"><b>No team tasks yet</b>Click <b>+ Task</b> to give out the first one, or send a list from a tool in ⚡ Skills (e.g. Models by level).</div>'; return; }
    if (UI.view === 'team') renderTeam(list); else if (UI.view === 'stats') renderStats(); else if (UI.view === 'board') renderBoard(list); else if (UI.view === 'cal') renderCal(list); else renderList(list);
  }

  function whoHtml(s) { return '<div class="who">' + split(s).map(function (n) { return '<span>' + esc(n) + '</span>'; }).join('') + '</div>'; }
  function statusCell(item, isParentWithSubs, tid, sid) {
    var s = isParentWithSubs ? statusOf(item) : item.status;
    if (isParentWithSubs) return '<div class="stc"><span class="st ' + cls(s) + '" title="Comes from its subtasks">' + esc(s) + '</span></div>';
    return '<div class="stc"><select class="stsel ' + cls(s) + '" data-st="' + tid + '" data-sid="' + (sid || '') + '">' + ST.map(function (x) { return '<option' + (x === s ? ' selected' : '') + '>' + x + '</option>'; }).join('') + '</select></div>';
  }
  function progHtml(p) { var v = Math.round(p * 100); return '<div class="prog"><div class="bar"><i style="width:' + v + '%"></i></div>' + v + '%</div>'; }
  function rowHtml(t) {
    var hasSubs = t.subs.length > 0, st = statusOf(t), open = UI.open[t.id] !== false;
    var h = '<div class="trow' + (st === 'Completed' ? ' done' : '') + '">' +
      '<button class="chev" data-open="' + t.id + '">' + (hasSubs ? (open ? '▾' : '▸') : '') + '</button>' +
      '<span class="code">' + esc(t.code) + '</span>' +
      '<div class="ttl" data-edit="' + t.id + '"><b>' + esc(t.title) + '</b>' + (hasSubs ? ' <span class="small">' + t.subs.filter(function (s) { return s.status === 'Completed'; }).length + '/' + t.subs.length + '</span>' : '') + (t.notes ? '<small>' + esc(t.notes) + '</small>' : '') + '</div>' +
      whoHtml(t.assignees) +
      '<span class="due' + (isLate(t.due, st) ? ' late' : '') + '">' + esc(fmtDate(t.due)) + (window.LTTodoLink ? LTTodoLink.badge({ f: 'deleg', t: 't', k: t.id }) : '') + '</span>' +
      statusCell(t, hasSubs, t.id) + progHtml(progress(t)) + '</div>';
    if (hasSubs && open) t.subs.forEach(function (s) {
      var due = s.due || t.due;
      h += '<div class="trow sub' + (s.status === 'Completed' ? ' done' : '') + '"><span></span><span class="code">' + esc(s.code) + '</span>' +
        '<div class="ttl" data-edit="' + t.id + '"><span>↳ ' + esc(s.title) + '</span>' + chipsHtml(s) + (s.notes ? '<small>' + esc(s.notes) + '</small>' : '') + '</div>' +
        whoHtml(s.assignees) + '<span class="due' + (isLate(due, s.status) ? ' late' : '') + '">' + esc(fmtDate(due)) + '</span>' +
        statusCell(s, false, t.id, s.id) + progHtml(val(s.status)) + '</div>';
    });
    return h;
  }
  function renderList(list) {
    var groups = D.groups.map(function (g) { return { id: g.id, name: g.name }; }).concat([{ id: '', name: 'No group' }]);
    var html = '';
    groups.forEach(function (g) {
      var ts = list.filter(function (t) { return (t.group || '') === g.id || (!g.id && t.group && !groupName(t.group)); });
      if (!ts.length) return;
      var p = ts.reduce(function (a, t) { return a + progress(t); }, 0) / ts.length, col = UI.collapsed[g.id || '_none'];
      html += '<section class="card grp"><div class="grp-h" data-coll="' + (g.id || '_none') + '"><span class="muted">' + (col ? '▸' : '▾') + '</span><h3>' + esc(g.name) + '</h3>' +
        '<span class="small">' + ts.length + ' task' + (ts.length === 1 ? '' : 's') + '</span><div class="bar"><i style="width:' + Math.round(p * 100) + '%"></i></div><span class="small">' + Math.round(p * 100) + '%</span>' +
        '<button class="btn sm" data-new-in="' + esc(g.id) + '">+ Task</button></div>';
      if (!col) html += '<div class="trow thead"><span></span><span>ID</span><span>Task</span><span>Assigned to</span><span>Due</span><span>Status</span><span>Progress</span></div>' + ts.map(rowHtml).join('');
      html += '</section>';
    });
    $('main').innerHTML = html || '<div class="card empty"><b>Nothing matches</b>Try clearing the filters above.</div>';
  }
  function renderBoard(list) {
    var html = '<div class="board">' + ST.map(function (s) {
      var ts = list.filter(function (t) { return statusOf(t) === s; });
      return '<section class="card col" data-drop="' + s + '"><h3><span class="st ' + cls(s) + '">' + s + '</span><span class="small">' + ts.length + '</span></h3>' +
        ts.map(function (t) {
          var st = statusOf(t), late = isLate(t.due, st);
          return '<div class="bcard" draggable="true" data-drag="' + t.id + '" data-edit="' + t.id + '"><div class="m"><span class="code">' + esc(t.code) + '</span><span>' + esc(groupName(t.group)) + '</span></div>' +
            '<div class="t">' + esc(t.title) + '</div>' + whoHtml(t.assignees) +
            '<div class="m" style="margin-top:6px"><span class="' + (late ? 'late' : '') + '">' + (t.due ? '📅 ' + esc(fmtDate(t.due)) : '') + '</span>' +
            (t.subs.length ? '<span>☑ ' + t.subs.filter(function (x) { return x.status === 'Completed'; }).length + '/' + t.subs.length + '</span>' : '') + '</div>' +
            (t.subs.length ? '<div class="bar" style="margin-top:6px"><i style="width:' + Math.round(progress(t) * 100) + '%"></i></div>' : '') + '</div>';
        }).join('') + '</section>';
    }).join('') + '</div><p class="small">Drag a card to change its status. Tasks with subtasks move by themselves when their subtasks change.</p>';
    $('main').innerHTML = html;
  }
  function renderCal(list) {
    var y = +UI.month.slice(0, 4), m = +UI.month.slice(5, 7) - 1;
    var first = new Date(y, m, 1), start = new Date(y, m, 1 - ((first.getDay() + 6) % 7));
    // one line per task per day: the task itself and/or its checklist items due that day (not one line per item)
    var days = {};
    var slot = function (date, t) { var d = days[date] = days[date] || {}; return d[t.id] = d[t.id] || { t: t, main: false, items: [] }; };
    var mine = function (t, s) { return !UI.person || split(s.assignees).some(function (n) { return n.toLowerCase() === UI.person.toLowerCase(); }) || split(t.assignees).some(function (n) { return n.toLowerCase() === UI.person.toLowerCase(); }); };
    list.forEach(function (t) {
      if (t.due) slot(t.due, t).main = true;
      t.subs.forEach(function (s) { var due = s.due || t.due; if (!due || !mine(t, s)) return; slot(due, t).items.push(s); });
    });
    var chip = function (date, g) {
      var t = g.t, st = statusOf(t), its = g.items, done = its.filter(function (s) { return s.status === 'Completed'; }).length;
      var late = its.filter(function (s) { return isLate(date, s.status); }).length + (g.main && !t.subs.length && isLate(t.due, st) ? 1 : 0);
      var all = g.main ? t.subs.length : its.length, allDone = g.main ? t.subs.filter(function (s) { return s.status === 'Completed'; }).length : done;
      var c = late ? 'lt' : (g.main ? st === 'Completed' : done === its.length && its.length) ? 'ok' : (g.main ? st !== 'Not started' : its.some(function (s) { return s.status !== 'Not started'; })) ? 'ip' : '';
      var count = all ? ' <span class="evn">' + allDone + '/' + all + '</span>' : '';
      var tip = t.code + ' ' + t.title + (g.main ? ' — due' : ' — ' + its.length + ' item(s) due') + (all ? ' · ' + allDone + ' of ' + all + ' done' : '') + (late ? ' · ' + late + ' late' : '') + (t.assignees ? ' · ' + t.assignees : '');
      return '<button class="ev ' + (g.main ? 'parent ' : '') + c + '" data-edit="' + t.id + '" title="' + esc(tip) + '"><span class="evt">' + (g.main ? '' : '↳ ') + esc(t.title) + '</span>' + count + (late ? ' <span class="evl">' + late + ' late</span>' : '') + '</button>';
    };
    var MAX = 3;
    var items = {};
    Object.keys(days).forEach(function (date) {
      var gs = Object.keys(days[date]).map(function (id) { return days[date][id]; });
      gs.sort(function (a, b) { return (b.main - a.main) || String(a.t.code).localeCompare(String(b.t.code), undefined, { numeric: true }); });
      var open = UI.calOpen === date, shown = open ? gs : gs.slice(0, MAX);
      items[date] = shown.map(function (g) { return chip(date, g); });
      if (gs.length > MAX) items[date].push('<button class="evmore" data-calday="' + date + '">' + (open ? 'Show less' : '+' + (gs.length - MAX) + ' more') + '</button>');
    });
    var html = '<section class="card"><div class="calh"><button class="btn sm" data-mon="-1">‹</button><h3>' + first.toLocaleDateString(undefined, { month: 'long', year: 'numeric' }) + '</h3><button class="btn sm" data-mon="1">›</button>' +
      '<button class="btn sm" data-mon="0">Today</button><span class="small">Bold = task due · ↳ = its items due that day · 3/10 = items done · red = late</span></div><div class="cal">' +
      ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map(function (d) { return '<div class="dn">' + d + '</div>'; }).join('');
    for (var i = 0; i < 42; i++) {
      var d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i), k = dkey(d);
      html += '<div class="day' + (d.getMonth() !== m ? ' other' : '') + (k === TODAY ? ' today' : '') + (UI.calOpen === k ? ' open' : '') + '"><div class="n">' + d.getDate() + '</div>' + (items[k] || []).join('') + '</div>';
    }
    $('main').innerHTML = html + '</div></section>';
  }

  /* ===== 4. Task editor ===== */
  function nextCode() { D.seq = (D.seq || 0) + 1; return 'T' + String(D.seq).padStart(2, '0'); }
  function openModal(html) { var mc = $('modalCard'); mc.oninput = mc.onchange = null; mc.innerHTML = html; $('modal').classList.add('show'); }
  function closeModal() { $('modal').classList.remove('show'); }
  function editor(id, preset) {
    var t = id ? findTask(id) : Object.assign({ id: '', code: '(new)', title: '', group: UI.group && UI.group !== '_none' ? UI.group : '', assignees: '', due: '', status: 'Not started', notes: '', subs: [], history: [] }, preset || {});
    var dl = '<datalist id="ppl">' + people().map(function (n) { return '<option value="' + esc(n) + '">'; }).join('') + '</datalist>';

    if (t.subs.length) { toast(t.code + ' has subtasks — its status comes from them'); return; }
    setStatus(t.id, '', c.getAttribute('data-drop'));
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeModal(); });
  // another tab / a skill changed the data → show it
  window.addEventListener('storage', function (e) {
    if (e.key === KEY || e.key === 'lt_projects_v1') { D = load(); MX = null; render(); }
    else if (e.key === 'tidp-checker:index') { MX = null; if (!$('modal').classList.contains('show')) render(); }
  });
  // theme button
  // theme: set in the tracker's Settings → Theme (this page follows it)
  window.__delegate = { data: function () { return D; }, render: render, setStatus: setStatus };   // for tests
  render();
})();
</script>
<script>/* ⬇ Offline copy button — only inside Lew's Tracker (it makes the file: core/offline.js) */
(function () { var P; try { P = window.parent; if (P === window || !P.LTOffline) return; } catch (e) { return; }
  document.querySelectorAll('[data-offline]').forEach(function (b) { b.style.display = ''; b.addEventListener('click', function (e) { e.preventDefault(); P.LTOffline.make(b.getAttribute('data-offline')); }); }); })();
</script>
</body>
</html>
