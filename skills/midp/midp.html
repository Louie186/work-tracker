<!doctype html>
<!--
  MIDP CHECKER (was TIDP Checker) — skill page of Lew's Tracker
  Runs in the browser. Nothing is uploaded anywhere.
  midp-plus.js adds the 🔍 Lookup and 📋 Lists views and the grouped tabs
  (it plugs in through window.MIDP_PLUS — see "Start-up" at the end).

  How this file is laid out:
    <style>            look and feel (colours, layout)          -> search "STYLE"
    <body>             page skeleton (header, tabs, dialogs)
    <script> core      reading, comparing and checking the TIDP -> search "TIDP CORE"
    <script> app       screens, buttons, saving, Excel export   -> search "TIDP APP"
  Each part starts with a numbered list of its sections.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MIDP Checker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="../../core/theme.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Jersey+10&family=JetBrains+Mono:wght@400;600&family=DM+Sans:wght@400;500;700&display=swap">
<style>
/* =====================================================================
   STYLE — 8-bit inspired, modern
   Sections:
     1. Colour tokens (Game Boy / Arcade, light / dark)
     2. Base
     3. Header and tabs
     4. Shared pieces (boxes, buttons, inputs, tags, blocks)
     5. Tables (compact)
     6. Overview
     7. Files tab
     8. Dialogs, pop-ups, toast
     9. Categories, pre-check, detail panel
    10. Small screens
   ===================================================================== */

/* ---------- 1. Colour tokens ---------- */
/* Game Boy (calm greens) — light */
:root, [data-skin="gb"] {
  --bg:#e4ead2; --grid:rgba(48,72,40,.07); --panel:#f3f6e6; --raise:#d6dfbf;
  --ink:#1e2a1a; --muted:#4e5e44; --edge:#1e2a1a;
  --accent:#3f7a3a; --accent-ink:#f3f6e6;
  --hd-bg:#1e2a1a; --hd-fg:#f3f6e6;
  --ok:#2f8a4a; --bad:#c2452f; --warn:#b97a0f; --info:#2f6fa8; --odd:#7b4fa8;
  --edit-bg:#fffbe0; --zebra:#ecf0dc; --hl:#d8ecb0;
  color-scheme: light;
}
/* Game Boy — dark */
[data-skin="gb"][data-mode="dark"] {
  --bg:#141a12; --grid:rgba(150,200,120,.06); --panel:#1d2619; --raise:#26321f;
  --ink:#d9ecc4; --muted:#93a985; --edge:#0a0d08;
  --accent:#8fd16a; --accent-ink:#141a12;
  --hd-bg:#33432a; --hd-fg:#d9ecc4;
  --ok:#6fd38b; --bad:#ff7a63; --warn:#f2c14e; --info:#6fb5ff; --odd:#c49bff;
  --edit-bg:#2b3422; --zebra:#212b1c; --hl:#34502a;
  color-scheme: dark;
}
/* Arcade (bright neon) — light */
[data-skin="arc"] {
  --bg:#f1eefa; --grid:rgba(80,50,160,.07); --panel:#ffffff; --raise:#e6e0f7;
  --ink:#1a1530; --muted:#5a5375; --edge:#1a1530;
  --accent:#e8226a; --accent-ink:#ffffff;
  --hd-bg:#1a1530; --hd-fg:#ffffff;
  --ok:#0f9a60; --bad:#e8364f; --warn:#c77700; --info:#2f6bff; --odd:#9b3dff;
  --edit-bg:#fff6fb; --zebra:#f7f5fd; --hl:#ffd9e8;
  color-scheme: light;
}
/* Arcade — dark */
[data-skin="arc"][data-mode="dark"] {
  --bg:#0e0b1c; --grid:rgba(255,61,127,.06); --panel:#18132e; --raise:#221b40;
  --ink:#f1ecff; --muted:#a59fc4; --edge:#000;
  --accent:#ff3d7f; --accent-ink:#0e0b1c;
  --hd-bg:#2e2556; --hd-fg:#f1ecff;
  --ok:#2cf59b; --bad:#ff4f6b; --warn:#ffc23d; --info:#4fd2ff; --odd:#c07bff;
  --edit-bg:#251d45; --zebra:#1c1636; --hl:#4a1f45;
  color-scheme: dark;
}

/* ---------- 2. Base ---------- */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; color: var(--ink); background: var(--bg);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 16px 16px;
  font: 14px/1.45 "DM Sans", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
}
.wrap { max-width: 1440px; margin: 0 auto; padding: 18px 16px 48px; }
.px { font-family: "Silkscreen", ui-monospace, monospace; letter-spacing: .04em; }
.mono { font-family: "JetBrains Mono", ui-monospace, Consolas, monospace; font-size: 12.5px; }
.muted { color: var(--muted); }
.hint { color: var(--muted); font-size: 12.5px; }
.nowrap { white-space: nowrap; }
.num { text-align: right; font-variant-numeric: tabular-nums; }
.grow { flex: 1; }
[hidden] { display: none !important; }
a { color: var(--info); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* ---------- 3. Header and tabs ---------- */
.top { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.logo { display: flex; gap: 10px; align-items: center; min-width: 0; }
.logo svg { width: 34px; height: 34px; flex: none; }
.logo h1 { margin: 0; font-family: "Silkscreen", monospace; font-size: 22px; line-height: 1; }
.logo h1 span { color: var(--accent); }
.proj { font-size: 12px; color: var(--muted); }
.top-r { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.save { font-size: 12px; color: var(--muted); text-align: right; line-height: 1.3; }
.save b { color: var(--ink); font-weight: 500; }
.save.due b { color: var(--bad); }

.seg { display: inline-flex; border: 3px solid var(--edge); box-shadow: 3px 3px 0 var(--edge); }
.seg button { font: 11px "Silkscreen", monospace; padding: 6px 9px; border: 0; background: var(--panel); color: var(--ink); cursor: pointer; }
.seg button + button { border-left: 3px solid var(--edge); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

.tabs { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 18px; }
.tab {
  font: 12px "Silkscreen", monospace; padding: 8px 12px; border: 3px solid var(--edge);
  background: var(--panel); color: var(--ink); box-shadow: 3px 3px 0 var(--edge); cursor: pointer;
}
.tab:active { transform: translate(3px, 3px); box-shadow: none; }
.tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
.tab .n { margin-left: 6px; padding: 0 5px; background: var(--hd-bg); color: var(--hd-fg); }
.tab .dot { display: inline-block; width: 8px; height: 8px; margin-left: 6px; background: var(--bad); vertical-align: 1px; }

/* ---------- 4. Shared pieces ---------- */
.box { background: var(--panel); border: 3px solid var(--edge); box-shadow: 5px 5px 0 var(--edge); padding: 16px; min-width: 0; }
h2 { font: 14px "Silkscreen", monospace; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
h2::before { content: ""; width: 8px; height: 8px; background: var(--accent); flex: none; }
.sec-h { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.sec-h h2 { margin: 0; }

.btn {
  font: 12px "Silkscreen", monospace; padding: 8px 12px; border: 3px solid var(--edge);
  background: var(--panel); color: var(--ink); box-shadow: 4px 4px 0 var(--edge); cursor: pointer; white-space: nowrap;
  display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
}
.btn:active { transform: translate(4px, 4px); box-shadow: none; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.danger { background: var(--bad); color: #fff; }
.btn.small { font-size: 10px; padding: 3px 7px; box-shadow: 2px 2px 0 var(--edge); border-width: 2px; }
.btn.small:active { transform: translate(2px, 2px); }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; box-shadow: 4px 4px 0 var(--edge); }

input[type="search"], input[type="text"], input[type="date"], input[type="number"], select {
  font: inherit; font-size: 13px; color: var(--ink); background: var(--panel);
  border: 3px solid var(--edge); padding: 6px 8px; min-height: 36px; border-radius: 0; max-width: 100%;
}
input[type="search"] { min-width: 220px; }
input[type="checkbox"] { accent-color: var(--accent); width: 16px; height: 16px; }
label.field { display: inline-flex; flex-direction: column; gap: 3px; font-size: 11px; color: var(--muted); }
label.field > span { font-family: "Silkscreen", monospace; }

.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  font: 11px "Silkscreen", monospace; padding: 5px 8px; border: 2px solid var(--edge); background: var(--panel);
  color: var(--ink); cursor: pointer; box-shadow: 2px 2px 0 var(--edge);
}
.chip[aria-pressed="true"] { background: var(--c, var(--accent)); color: var(--panel); border-color: var(--edge); }
.chip .c { opacity: .8; margin-left: 4px; }

/* Status tags: square, flat */
.tag {
  display: inline-block; font: 10px/1.4 "Silkscreen", monospace; padding: 1px 6px; border: 2px solid var(--c, var(--muted));
  color: var(--c, var(--muted)); white-space: nowrap; background: transparent;
}
.tag.fill { background: var(--c); color: var(--panel); }
.c-ok { --c: var(--ok); } .c-bad { --c: var(--bad); } .c-warn { --c: var(--warn); }
.c-info { --c: var(--info); } .c-odd { --c: var(--odd); } .c-mute { --c: var(--muted); } .c-ink { --c: var(--ink); }
.rev { font: 13px "Jersey 10", monospace; padding: 0 5px; background: var(--raise); border: 2px solid var(--edge); white-space: nowrap; }

/* Block progress bar ▮▮▮▯▯ */
.blocks { display: flex; gap: 3px; }
.blocks i { flex: 1; height: 10px; min-width: 6px; background: var(--raise); border: 2px solid var(--edge); }
.blocks i.on { background: var(--c, var(--accent)); }

.banner { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; padding: 10px 12px; border: 3px solid var(--c, var(--warn)); background: var(--panel); margin-bottom: 14px; }
.banner.err { --c: var(--bad); }
.banner.info { --c: var(--info); }
.banner b { color: var(--c); }

.empty { padding: 28px 16px; text-align: center; color: var(--muted); }
.empty b { display: block; font: 14px "Silkscreen", monospace; color: var(--ink); margin-bottom: 6px; }
.steps { text-align: left; max-width: 520px; margin: 14px auto 0; padding: 0; list-style: none; counter-reset: s; }
.steps li { counter-increment: s; display: flex; gap: 10px; align-items: baseline; margin: 8px 0; color: var(--ink); }
.steps li::before { content: counter(s); font: 12px "Silkscreen", monospace; background: var(--accent); color: var(--accent-ink); padding: 1px 6px; }

/* ---------- 5. Tables (compact) ---------- */
/* Data tables: fixed column widths, one line per row, full text on hover */
.tw { overflow: auto; max-height: 72vh; border: 3px solid var(--edge); box-shadow: 5px 5px 0 var(--edge); background: var(--panel); }
.tw.free { max-height: none; }
table { border-collapse: separate; border-spacing: 0; width: 100%; }
table.grid { table-layout: fixed; }
th {
  font: 700 12px/1.35 "Silkscreen", monospace; text-align: left; padding: 6px 8px; background: var(--hd-bg); color: var(--hd-fg);
  position: sticky; top: 0; z-index: 3; vertical-align: top;
}
th.sort { cursor: pointer; user-select: none; }
th.sort:hover .tl { text-decoration: underline; }
th .arr { margin-left: 4px; }
td {
  padding: 3px 8px; border-top: 1px solid var(--raise); vertical-align: top; background: var(--panel);
  font-size: 12.5px; line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
tbody tr:nth-child(even) td { background: var(--zebra); }
tbody tr:hover td { background: var(--raise); }
tbody tr.hl td { background: var(--hl); box-shadow: inset 0 2px 0 var(--accent), inset 0 -2px 0 var(--accent); }
tr.removed td { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--bad); }
td.empty { text-align: center; padding: 20px; white-space: normal; }
/* sticky left columns (tick + drawing number) */
th.stk { position: sticky; z-index: 4; }
td.stk { position: sticky; z-index: 1; box-shadow: 1px 0 0 var(--raise); }
/* column resize handle */
/* headings wrap onto more lines when a column is made narrow */
.th { display: flex; align-items: flex-start; gap: 4px; min-width: 0; }
.tl { min-width: 0; flex: 1; white-space: normal; overflow-wrap: anywhere; }
.rz { position: absolute; top: 0; right: -3px; width: 7px; height: 100%; cursor: col-resize; z-index: 5; }
.rz:hover, body.resizing .rz { background: var(--accent); opacity: .6; }
body.resizing { cursor: col-resize; user-select: none; }
/* every heading and cell reads from the top-left, numbers included */
th, td, th.num, td.num { text-align: left; }
td.pick input, th input[type="checkbox"] { width: 14px; height: 14px; margin: 0; vertical-align: middle; }
.gridbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 6px; }
/* small tables (overview, heat map, panels) wrap text normally */
table.plain td { white-space: normal; overflow: visible; font-size: 13px; padding: 4px 8px; }
table.mini td { padding: 3px 6px; font-size: 12.5px; }
tr.link { cursor: pointer; }
tr.link:hover td { background: var(--hl); }

/* ▾ column filter button in each heading, and its pop-up */
.fbtn {
  font: 10px/1 "Silkscreen", monospace; width: 19px; height: 19px; padding: 0; flex: none; cursor: pointer;
  border: 2px solid var(--hd-fg); background: transparent; color: var(--hd-fg);
}
.fbtn:hover { background: var(--hd-fg); color: var(--hd-bg); }
.fbtn.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.cfpop { position: fixed; z-index: 45; display: flex; flex-direction: column; gap: 8px; max-height: 75vh; padding: 12px; }
.cfpop input[type="search"] { width: 100%; min-width: 0; }
.cf-list { overflow: auto; min-height: 60px; max-height: 40vh; border: 2px solid var(--raise); padding: 2px 6px; }
.cf-i { display: flex; gap: 8px; align-items: flex-start; justify-content: flex-start; padding: 4px 0; font-size: 13px; line-height: 1.35; cursor: pointer; text-align: left; }
.cf-i input[type="checkbox"] { flex: none; margin: 2px 0 0; }
.cf-t { flex: 1; min-width: 0; text-align: left; word-break: break-word; }
.cf-n { flex: none; color: var(--muted); font-size: 11px; line-height: 1.6; }
select, select option { text-align: left; text-align-last: left; }

/* cells you can type in, and drop-downs inside cells */
td.edit { background: var(--edit-bg) !important; cursor: text; outline: none; }
td.edit:focus { box-shadow: inset 0 0 0 2px var(--accent); white-space: normal; overflow: visible; text-overflow: clip; }
select.cellsel { min-height: 0; height: 22px; padding: 0 4px; border-width: 2px; font-size: 12px; width: 100%; background: var(--panel); }
td .tag { font-size: 9px; padding: 0 4px; border-width: 1.5px; vertical-align: 1px; }
td .rev { font-size: 12px; padding: 0 4px; border-width: 1.5px; }
td b { font-weight: 600; }
.num-link { color: inherit; text-decoration: underline dotted var(--muted); text-underline-offset: 2px; }
.num-link:hover { color: var(--accent); text-decoration-color: var(--accent); }
tr.g td { font-weight: 700; background: var(--raise) !important; }
.chg .f { font: 9px "Silkscreen", monospace; color: var(--muted); }
.chg s { color: var(--bad); }
.more { padding: 8px; text-align: center; }
.d-up { color: var(--ok); } .d-dn { color: var(--bad); }
.bar { height: 10px; background: var(--raise); border: 2px solid var(--edge); }
.bar i { display: block; height: 100%; background: var(--accent); }

/* ---------- 6. Overview ---------- */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 16px; margin-bottom: 20px; }
.kpi { position: relative; text-align: left; font: inherit; color: inherit; cursor: pointer; }
.kpi:active { transform: translate(5px, 5px); box-shadow: none; }
.kpi .l { font: 11px "Silkscreen", monospace; color: var(--muted); display: block; }
.kpi .v { font: 46px/1 "Jersey 10", monospace; margin: 4px 0 2px; color: var(--c); display: block; }
.kpi .s { font-size: 12px; color: var(--muted); display: block; }
.kpi .blocks { margin-top: 8px; }
.kpi::before { content: ""; position: absolute; left: 0; top: 0; width: 10px; height: 10px; background: var(--c); }

.cols { display: grid; grid-template-columns: 1.5fr 1fr; gap: 20px; margin-bottom: 20px; }
.stage { display: grid; grid-template-columns: minmax(130px, 220px) 1fr 64px; gap: 12px; align-items: center; padding: 5px 0; border-bottom: 2px dashed var(--raise); }
.stage:last-child { border-bottom: 0; }
.stage .nm { font-weight: 700; font-size: 13px; }
.stage .dt { font-size: 11.5px; color: var(--muted); }
.stage .pct { font: 22px "Jersey 10", monospace; text-align: right; }
.list { margin: 0; padding: 0; list-style: none; }
.list li { display: flex; justify-content: space-between; gap: 10px; padding: 5px 0; border-bottom: 2px dashed var(--raise); }
.list li:last-child { border-bottom: 0; }
.list li > .tag { align-self: flex-start; }
.list small { color: var(--muted); }
.list .d { font: 17px "Jersey 10", monospace; white-space: nowrap; color: var(--c, var(--bad)); }

/* ---------- 7. Files tab ---------- */
.drops { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin-bottom: 18px; }
.drop {
  position: relative; display: flex; gap: 12px; padding: 14px; border: 3px dashed var(--edge); background: var(--panel); cursor: pointer; min-height: 112px;
}
.drop:hover, .drop.over { background: var(--raise); }
.drop.done { border-style: solid; box-shadow: 5px 5px 0 var(--edge); }
.drop input[type="file"] { position: absolute; width: 1px; height: 1px; opacity: 0; }
.drop .ico { width: 30px; height: 30px; flex: none; color: var(--accent); }
.drop .t { font: 12px "Silkscreen", monospace; display: block; margin-bottom: 4px; }
.drop .d { font-size: 12.5px; color: var(--muted); display: block; }
.drop .f { display: block; font-weight: 700; font-size: 12.5px; word-break: break-all; margin-top: 4px; }
.drop .m { display: block; font-size: 12px; color: var(--ok); }
.drop .x { position: absolute; top: 6px; right: 6px; }
.drop:focus-within { outline: 3px solid var(--accent); outline-offset: 2px; }
.req { color: var(--bad); }
.files-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; word-break: break-word; }

/* ---------- 8. Dialogs, pop-ups, toast ---------- */
.dlg { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(0,0,0,.45); }
.dlg-box { width: min(620px, 100%); max-height: 90vh; overflow: auto; }
.dlg-box .row { display: flex; flex-wrap: wrap; gap: 12px; margin: 12px 0; }
.dlg-box .acts { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }
.sheets { display: grid; gap: 6px; margin: 8px 0; }
.sheets label { display: flex; gap: 8px; align-items: center; font-size: 13px; }

.pop { position: absolute; z-index: 40; width: 280px; max-height: 60vh; overflow: auto; }
.pop label { display: flex; gap: 8px; align-items: center; padding: 4px 0; font-size: 13px; }

.toast {
  position: fixed; left: 50%; bottom: 20px; transform: translate(-50%, 120px); z-index: 60;
  background: var(--hd-bg); color: var(--hd-fg); border: 3px solid var(--edge); box-shadow: 4px 4px 0 var(--edge);
  padding: 10px 14px; font-size: 13px; transition: transform .2s; max-width: calc(100% - 32px);
}
.toast.on { transform: translate(-50%, 0); }
.busy { position: fixed; inset: 0; z-index: 70; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.35); }
.busy .box { font: 13px "Silkscreen", monospace; }
.busy .box::after { content: "▮▮▮"; display: inline-block; margin-left: 8px; animation: blink 1s steps(3) infinite; color: var(--accent); }
@keyframes blink { 0% { clip-path: inset(0 66% 0 0); } 100% { clip-path: inset(0 0 0 0); } }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } .busy .box::after { animation: none; } }

.foot { margin-top: 28px; font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 18px; }

/* ---------- 9. Categories, pre-check, detail panel ---------- */
.cats { display: grid; grid-template-columns: minmax(280px, 380px) 1fr; gap: 20px; align-items: start; }
.tree { max-height: 68vh; overflow: auto; }
.tree-row {
  display: flex; width: 100%; gap: 8px; justify-content: space-between; align-items: baseline; text-align: left;
  font: inherit; font-size: 12.5px; color: var(--ink); background: none; border: 0; border-bottom: 1px dashed var(--raise); padding: 4px 6px 4px 16px; cursor: pointer;
}
.tree-row.grp { font-weight: 700; padding-left: 6px; background: var(--raise); margin-top: 6px; }
.tree-row:hover { background: var(--hl); }
.tree-row.on { background: var(--accent); color: var(--accent-ink); }
.tree-row.on .muted { color: inherit; }
.tree-row .tn { flex: 1; min-width: 0; }
.tree-row .tc { white-space: nowrap; font-size: 11.5px; }
table.heat td.hc { cursor: pointer; font-weight: 600; text-align: center; }
table.heat td.h-ok { background: var(--ok); color: var(--panel); }
table.heat td.h-part { background: var(--warn); color: var(--panel); }
table.heat td.h-none { background: var(--bad); color: var(--panel); }
table.heat td.hc:hover { outline: 3px solid var(--edge); outline-offset: -3px; }

.pre-in { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.pre-alt { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.pre-alt textarea { width: 100%; font: 12.5px "JetBrains Mono", monospace; color: var(--ink); background: var(--panel); border: 3px solid var(--edge); padding: 6px 8px; resize: vertical; }
.pre-in.compact .drop { min-height: 0; }
details.box > summary { cursor: pointer; font-size: 13px; }
details.box[open] > summary { margin-bottom: 12px; }
.banner.picked { position: sticky; top: 0; z-index: 6; }

.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 55; width: min(440px, 100%); overflow: auto;
  border-right: 0; border-top: 0; border-bottom: 0; box-shadow: -6px 0 0 var(--edge);
}
.drawer .kv { font-size: 12.5px; }
.dform { display: grid; gap: 8px; }
.dform input, .dform select, .dform textarea { width: 100%; }
.dform textarea { font: inherit; font-size: 13px; color: var(--ink); background: var(--panel); border: 3px solid var(--edge); padding: 6px 8px; resize: vertical; }
#find { min-width: 200px; }

/* ---------- 10. Small screens ---------- */
@media (max-width: 900px) {
  .cols, .files-grid, .cats, .pre-in { grid-template-columns: 1fr; }
}
@media (max-width: 560px) {
  .logo h1 { font-size: 18px; }
  .kpi .v { font-size: 36px; }
  input[type="search"] { min-width: 0; width: 100%; }
  .stage { grid-template-columns: 1fr 52px; }
  .stage .blocks { grid-column: 1 / -1; grid-row: 2; }
  .save { text-align: left; }
  /* Files: short boxes, one line of help, two per row */
  .drops { grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .drop { min-height: 0; padding: 8px; gap: 6px; flex-direction: column; }
  .drop .ico { width: 20px; height: 20px; }
  .drop .t { font-size: 10.5px; margin: 0; }
  .drop .d { font-size: 11px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .drop .f, .drop .m { font-size: 11px; }
}

<script>
/* =====================================================================
   TIDP CORE
   Pure functions only: no page, no storage. Everything that reads,
   compares and checks the TIDP lives here, so it can be tested alone.
   Sections:
     1. Settings
     2. Text helpers
     3. Document numbers
     4. Dates
     5. Reading a sheet into a grid
     6. Reading the TIDP tab
     7. Comparing two TIDPs
     8. Checks (naming, revisions, dates, duplicates, sequences)
     9. Due dates and the chase list
    10. Drawing tracker (your own entries)
    11. Model list and model suggestions
    12. Submission lists
    13. Pre-check of file names (before you submit)
   ===================================================================== */
(function (root) {
  'use strict';

  /* ---------- 1. Settings ---------- */

  // Top-level headings in the TIDP that start a new group
  const GROUPS = ['MODELS', 'DRAWINGS', 'REPORTS', 'OTHER', 'SCHEDULES', 'SPECIFICATIONS'];

  // Column A header text that marks the start of the TIDP table
  const HEADER_NAMES = ['DELIVERABLE (TITLE)', 'DOCUMENT NUMBER', 'DRAWING NUMBER', 'DOCUMENT NO', 'DOCUMENT NO.', 'DOC NO'];

  // A revision looks like T0, T1, D1, P01, C02
  const REV_RE = /^[A-Z]{1,2}\d{1,3}$/;

  // TIDP columns that repeat each part of the document number
  const PART_COLUMNS = [
    { key: 'PROJECT CODE', label: 'Project code' },
    { key: 'ORIGINATOR', label: 'Originator' },
    { key: 'FUNCTIONAL BREAKDOWN', label: 'Functional breakdown' },
    { key: 'SPATIAL BREAKDOWN', label: 'Level' },
    { key: 'DOCUMENT TYPE', label: 'Document type' },
    { key: 'DISCIPLINE', label: 'Discipline' },
    { key: 'SEQUENCE NUMBER', label: 'Sequence' }
  ];

  // Header text of a "date required" column (one per design stage)
  const DATE_HEADER_RE = /DATE REQUIRED|REQUIRED DATE|DUE DATE|ISSUE DATE|PLANNED DATE/;

  // Dates outside this range are treated as typing mistakes
  const MIN_YEAR = 2015, MAX_YEAR = 2045;

  // Parts of the number that should be the same for every drawing (project code, originator, discipline)
  // are flagged when they differ from what at least this share of drawings use
  const FIXED_PARTS = [0, 1, 5];
  const MAJORITY = 0.9;

  /* ---------- 2. Text helpers ---------- */

  function txt(v) {
    if (v === null || v === undefined) return '';
    return String(v).replace(/ /g, ' ').replace(/[\r\n\t]+/g, ' ').replace(/ {2,}/g, ' ').trim();
  }
  function norm(v) { return txt(v).toUpperCase(); }
  function compact(v) { return norm(v).replace(/[^A-Z0-9]/g, ''); }

  /* ---------- 3. Document numbers ---------- */

  function isDocNumber(s) {
    s = txt(s);
    if (!s || /\s/.test(s) || !/^[A-Z0-9]/i.test(s)) return false;
    return (s.match(/-/g) || []).length >= 4;
  }

  /* Splits a number like 5013-KEO-T1-ZZ-PLN-INT-10101-T1 into its pieces.
     Model numbers end with a dash and no revision: 5013-KEO-PD-ZZ-BIM-INT-10001- */
  function splitNumber(num) {
    const s = norm(num);
    const parts = s.split('-');
    const last = parts[parts.length - 1];
    let rev = '', base = s, trailingDash = false;
    if (last === '' && parts.length > 1) {
      trailingDash = true;
      parts.pop();
      base = parts.join('-');
    } else if (parts.length >= 5 && (REV_RE.test(last) || (/^\d{2,3}$/.test(last) && /^\d{3,}$/.test(parts[parts.length - 2])))) {
      // T0 / P01 … and also 00 / 01 (IFC) right after the sequence number
      rev = last;
      base = parts.slice(0, -1).join('-');
    }
    let seq = '';
    for (let i = parts.length - 1; i >= 0; i--) if (/^\d+$/.test(parts[i])) { seq = parts[i]; break; }
    return { parts: parts, rev: rev, base: base, seq: seq, type: parts.length > 4 ? parts[4] : '', trailingDash: trailingDash };
  }

  function keyOf(num, title) { return norm(num) || ('#' + norm(title)); }
  function baseOf(num) { return splitNumber(num).base; }
  function revOf(num) { return splitNumber(num).rev; }

  /* Compares two revisions of the same letter: -1 older, 0 same, 1 newer, null if not comparable */
  function compareRev(a, b) {
    const ma = /^([A-Z]+)(\d+)$/.exec(norm(a)), mb = /^([A-Z]+)(\d+)$/.exec(norm(b));
    if (!ma || !mb || ma[1] !== mb[1]) return a === b ? 0 : null;
    return Math.sign(Number(ma[2]) - Number(mb[2]));
  }

  function pathOf(it) { return [it.grp, it.cat, it.sub].filter(Boolean).join(' › '); }

  /* Adds the derived fields every item needs */
  function enrich(it) {
    it.num = txt(it.num);
    it.title = txt(it.title);
    const p = splitNumber(it.num);
    it.parts = it.num ? p.parts : [];
    it.rev = p.rev;
    it.base = it.num ? p.base : '';
    it.seq = it.num ? p.seq : '';
    it.type = it.num ? p.type : '';
    it.trailingDash = p.trailingDash;
    it.key = keyOf(it.num, it.title);
    return it;
  }

  /* ---------- 4. Dates ---------- */
  /* All dates are kept as 'YYYY-MM-DD' text, so there are no time-zone surprises. */

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function isoOf(y, m, d) { return y + '-' + pad(m) + '-' + pad(d); }
  function validYMD(y, m, d) {
    const t = new Date(Date.UTC(y, m - 1, d));
    return t.getUTCFullYear() === y && t.getUTCMonth() === m - 1 && t.getUTCDate() === d;
  }
  function serialToIso(n) {
    const t = new Date(Date.UTC(1899, 11, 30) + Math.round(n) * 86400000);
    return isoOf(t.getUTCFullYear(), t.getUTCMonth() + 1, t.getUTCDate());
  }
  function dayNum(iso) {
    const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || '');
    return m ? Math.round(Date.UTC(+m[1], +m[2] - 1, +m[3]) / 86400000) : NaN;
  }
  function daysBetween(fromIso, toIso) { return dayNum(toIso) - dayNum(fromIso); }
  function todayIso(now) {
    const d = now || new Date();
    return isoOf(d.getFullYear(), d.getMonth() + 1, d.getDate());
  }
  function addDays(iso, n) {
    const t = new Date((dayNum(iso) + n) * 86400000);
    return isoOf(t.getUTCFullYear(), t.getUTCMonth() + 1, t.getUTCDate());
  }

  /* Reads one "date required" cell.
     Returns null when the cell is empty or a dash,
     otherwise { raw, iso } for a good date or { raw, bad: 'reason' } for a problem. */
  function readDate(v) {
    if (v === null || v === undefined) return null;
    if (v instanceof Date) {
      if (isNaN(v)) return { raw: String(v), bad: 'Not a date' };
      v = isoOf(v.getFullYear(), v.getMonth() + 1, v.getDate());
    }
    let iso = '', raw = txt(v);
    if (typeof v === 'number') {
      if (v === 0) return null;
      if (v < 20000 || v > 80000) return { raw: raw, bad: 'Not a date' };
      iso = serialToIso(v);
    } else {
      if (!raw || /^[-–—.]+$/.test(raw) || /^(N\/?A|NA|TBC|TBA|NONE)$/i.test(raw)) return null;
      let m = /^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})$/.exec(raw);       // 30/10/2025 (day first)
      if (m) {
        if (m[3].length !== 4) return { raw: raw, bad: 'Year is not 4 digits' };
        const d = +m[1], mo = +m[2], y = +m[3];
        if (!validYMD(y, mo, d)) return { raw: raw, bad: 'Day or month does not exist' };
        iso = isoOf(y, mo, d);
      } else if ((m = /^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(raw))) {         // 2025-10-30
        if (!validYMD(+m[1], +m[2], +m[3])) return { raw: raw, bad: 'Day or month does not exist' };
        iso = isoOf(+m[1], +m[2], +m[3]);
      } else {
        return { raw: raw, bad: 'Not a date' };
      }
    }
    const y = +iso.slice(0, 4);
    if (y < MIN_YEAR || y > MAX_YEAR) return { raw: raw, iso: iso, bad: 'Year ' + y + ' looks wrong' };
    return { raw: raw, iso: iso };
  }

  /* ---------- 5. Reading a sheet into a grid ---------- */

  /* Rebuilds simple CONCAT / & formulas when a file was saved without formula results */
  function splitTop(s, sep) {
    const out = []; let cur = '', quoted = false, level = 0;
    for (const ch of s) {
      if (ch === '"') { quoted = !quoted; cur += ch; continue; }
      if (!quoted) {
        if (ch === '(') level++;
        if (ch === ')') level--;
        if (ch === sep && level === 0) { out.push(cur); cur = ''; continue; }
      }
      cur += ch;
    }
    out.push(cur);
    return out;
  }
  function evalConcat(ws, f, depth) {
    try {
      const m = f.replace(/^=/, '').replace(/_xlfn\./gi, '').trim();
      const call = /^(CONCAT|CONCATENATE)\((.*)\)$/i.exec(m);
      let parts;
      if (call) parts = splitTop(call[2], ',');
      else if (m.indexOf('&') >= 0) parts = splitTop(m, '&');
      else return null;
      return parts.map(function (p) {
        p = p.trim();
        if (/^".*"$/.test(p)) return p.slice(1, -1).replace(/""/g, '"');
        if (/^\$?[A-Z]{1,3}\$?\d+$/i.test(p)) return String(cellValue(ws, p.replace(/\$/g, '').toUpperCase(), depth));
        throw new Error('not a simple formula');
      }).join('');
    } catch (e) { return null; }
  }
  function cellValue(ws, addr, depth) {
    const c = ws[addr];
    if (!c) return '';
    if (c.t !== 'z' && c.v !== null && c.v !== undefined && c.v !== '') return c.v;
    if (c.t !== 'z' && c.w) return c.w;
    if (c.f && (depth || 0) < 3) { const v = evalConcat(ws, c.f, (depth || 0) + 1); if (v !== null) return v; }
    return '';
  }

  /* Turns a SheetJS sheet into rows of raw values (numbers stay numbers, so dates can be read).
     Also returns hyperlinks per row (used for ACC links in the model list). */
  function sheetToGrid(XLSX, ws, maxCols) {
    const out = { rows: [], links: {}, firstRow: 1, rebuilt: 0 };
    if (!ws || !ws['!ref']) return out;
    const R = XLSX.utils.decode_range(ws['!ref']);
    const lastCol = Math.min(R.e.c, R.s.c + (maxCols || 60) - 1);
    out.firstRow = R.s.r + 1;
    for (let r = R.s.r; r <= R.e.r; r++) {
      const row = [];
      for (let c = R.s.c; c <= lastCol; c++) {
        const addr = XLSX.utils.encode_cell({ r: r, c: c }), cell = ws[addr];
        let v = cellValue(ws, addr, 0);
        if (cell && (cell.v === undefined || cell.v === '') && v !== '') out.rebuilt++;
        row.push(v);
        if (cell && cell.l && cell.l.Target && /^https?:/i.test(cell.l.Target) && out.links[r - R.s.r] === undefined) {
          out.links[r - R.s.r] = cell.l.Target;
        }
      }
      out.rows.push(row);
    }
    return out;
  }

  /* ---------- 6. Reading the TIDP tab ---------- */

  function findHeader(rows) {
    for (let i = 0; i < Math.min(rows.length, 400); i++) {
      if (HEADER_NAMES.indexOf(norm(rows[i][0])) >= 0) return i;
    }
    return -1;
  }

  function mapColumns(head) {
    const cols = { title: 1, status: -1, rev: -1, format: -1, parts: [] };
    head.forEach(function (h, c) {
      const u = norm(h);
      if (c === 0 || !u) return;
      if (u === 'DESCRIPTION' || u === 'TITLE' || u === 'DOCUMENT TITLE') cols.title = c;
      else if (u === 'STATUS' && cols.status < 0) cols.status = c;
      else if ((u === 'REVISION' || u === 'REV') && cols.rev < 0) cols.rev = c;
      else if (/EXCHANGE FORMAT/.test(u)) cols.format = c;
      else PART_COLUMNS.forEach(function (p, k) { if (u.indexOf(p.key) === 0 && cols.parts[k] === undefined) cols.parts[k] = c; });
    });
    return cols;
  }

  /* Finds the stage columns: the header says "DATE REQUIRED TO ISSUE",
     the stage name ("DETAIL DESIGN") sits one or two rows above it. */
  function findStages(rows, hdr) {
    const head = rows[hdr], stages = [];
    head.forEach(function (h, c) {
      if (!DATE_HEADER_RE.test(norm(h))) return;
      let name = '';
      for (let up = 1; up <= 3 && !name; up++) {
        const row = rows[hdr - up] || [];
        [c, c - 1].some(function (cc) {
          const t = txt(row[cc]);
          if (t && !/:$/.test(t) && !/^(STAGE|PROGRAMME REF|DATA EXCHANGE)/i.test(t)) { name = t; return true; }
          return false;
        });
      }
      stages.push({ col: c, name: name || ('Stage ' + (stages.length + 1)) });
    });
    return stages;
  }

  /* Reads the top block ("Project Number", "Project Title") */
  function readProject(rows) {
    const out = {};
    for (let i = 0; i < Math.min(rows.length, 15); i++) {
      const k = norm(rows[i][0]), v = txt(rows[i][1]);
      if (k === 'PROJECT NUMBER') out.number = v;
      else if (k === 'PROJECT TITLE') out.title = v;
      else if (k === 'DATE LAST UPDATED') out.updated = (readDate(rows[i][1]) || {}).iso || v;
    }
    return out;
  }

  /* rows: grid rows (array of arrays). firstRow: sheet row number of rows[0]. */
  function parseTidp(rows, firstRow) {
    firstRow = firstRow || 1;
    const hdr = findHeader(rows);
    const cols = hdr >= 0 ? mapColumns(rows[hdr]) : { title: 1, status: -1, rev: -1, format: -1, parts: [] };
    const stages = hdr >= 0 ? findStages(rows, hdr) : [];
    const items = [], oddRows = [];
    let grp = '', cat = '', sub = '', prevCat = false, subMode = false;

    for (let i = hdr + 1; i < rows.length; i++) {
      const row = rows[i];
      const a = txt(row[0]), b = txt(row[cols.title]);
      if (!a && !b) continue;
      // End of the table
      if (a.indexOf('---') === 0 || /^(TASK|MASTER) INFORMATION DELIVERY PLAN/i.test(a)) { if (items.length) break; else continue; }

      if (!a || isDocNumber(a)) {
        if (hdr < 0 && !a) continue;
        const it = enrich({ grp: grp, cat: cat, sub: sub, num: a, title: b, row: firstRow + i });
        it.status = cols.status >= 0 ? txt(row[cols.status]) : '';
        it.revCol = cols.rev >= 0 ? norm(row[cols.rev]) : '';
        it.format = cols.format >= 0 ? txt(row[cols.format]) : '';
        it.meta = cols.parts.map(function (c) { return c === undefined ? null : norm(row[c]); });
        it.dates = stages.map(function (st) { return readDate(row[st.col]); });
        items.push(it);
        prevCat = false;
      } else if (/^\d+([.,]\d+)?$/.test(a)) {
        // Only a number in column A (like "23"): not a heading, keep the current category
        oddRows.push({ row: firstRow + i, text: a, title: b, grp: grp, cat: cat, sub: sub });
      } else {
        // A heading row: group, category or sub-category
        if (hdr < 0 && !items.length && GROUPS.indexOf(a.toUpperCase()) < 0 && b) continue;
        if (GROUPS.indexOf(a.toUpperCase()) >= 0) { grp = a; cat = ''; sub = ''; subMode = false; prevCat = false; }
        else if (prevCat && cat && a.indexOf(' - ') < 0) { sub = a; subMode = true; prevCat = true; }
        else if (subMode && a.indexOf(' - ') < 0) { sub = a; prevCat = true; }
        else { cat = a; sub = ''; subMode = false; prevCat = true; }
      }
    }
    return {
      items: items, stages: stages, oddRows: oddRows, headerFound: hdr >= 0,
      hasParts: cols.parts.some(function (c) { return c !== undefined; }),
      hasRevCol: cols.rev >= 0, project: readProject(rows)
    };
  }

  /* ---------- 7. Comparing two TIDPs ---------- */

  function stageDiffs(o, n, stagesOld, stagesNew) {
    const out = [];
    (stagesNew || []).forEach(function (st, k) {
      const j = (stagesOld || []).findIndex(function (s) { return norm(s.name) === norm(st.name); });
      if (j < 0) return;
      const a = o.dates && o.dates[j], b = n.dates && n.dates[k];
      const av = a ? (a.iso || a.raw) : '', bv = b ? (b.iso || b.raw) : '';
      if (av !== bv) out.push({ field: st.name + ' date', from: av, to: bv });
    });
    return out;
  }

  function diffMeta(o, n, stOld, stNew) {
    const ch = [];
    if (norm(o.title) !== norm(n.title)) ch.push({ field: 'Title', from: o.title, to: n.title });
    if (norm(pathOf(o)) !== norm(pathOf(n))) ch.push({ field: 'Category', from: pathOf(o), to: pathOf(n) });
    return ch.concat(stageDiffs(o, n, stOld, stNew));
  }

  /* Returns what was added, removed, revised (same drawing, new revision), edited and duplicated */
  function compare(oldItems, newItems, stOld, stNew) {
    const mapN = new Map(), mapO = new Map(), dupCount = new Map();
    newItems.forEach(function (it) {
      if (mapN.has(it.key)) dupCount.set(it.key, (dupCount.get(it.key) || 1) + 1);
      else mapN.set(it.key, it);
    });
    oldItems.forEach(function (it) { if (!mapO.has(it.key)) mapO.set(it.key, it); });

    const added = [], removed = [], edited = [];
    mapN.forEach(function (it, k) {
      if (!mapO.has(k)) { added.push(it); return; }
      const o = mapO.get(k), ch = diffMeta(o, it, stOld, stNew);
      if (ch.length) edited.push({ item: it, old: o, changes: ch });
    });
    mapO.forEach(function (o, k) { if (!mapN.has(k)) removed.push(o); });

    // An "added" number whose base matches a "removed" one is the same drawing with a new revision
    const removedByBase = new Map();
    removed.forEach(function (o) {
      if (!o.base) return;
      if (!removedByBase.has(o.base)) removedByBase.set(o.base, []);
      removedByBase.get(o.base).push(o);
    });
    const used = new Set(), revised = [], addedLeft = [];
    added.forEach(function (a) {
      const list = a.base ? removedByBase.get(a.base) : null;
      const o = list ? list.find(function (x) { return !used.has(x); }) : null;
      if (o) {
        used.add(o);
        revised.push({ item: a, old: o, changes: [{ field: 'Revision', from: o.rev || '(none)', to: a.rev || '(none)' }].concat(diffMeta(o, a, stOld, stNew)) });
      } else addedLeft.push(a);
    });

    const duplicates = [];
    dupCount.forEach(function (n, k) {
      duplicates.push({ key: k, count: n, items: newItems.filter(function (it) { return it.key === k; }) });
    });
    return {
      added: addedLeft, removed: removed.filter(function (o) { return !used.has(o); }),
      edited: edited, revised: revised, duplicates: duplicates
    };
  }

  /* Counts per group / category, latest vs previous */
  function counts(oldItems, newItems) {
    const map = new Map(), order = [];
    function add(it, field) {
      const k = norm(it.grp) + '|' + norm(it.cat) + '|' + norm(it.sub);
      if (!map.has(k)) { map.set(k, { grp: it.grp, cat: it.cat, sub: it.sub, old: 0, now: 0 }); order.push(k); }
      map.get(k)[field]++;
    }
    newItems.forEach(function (it) { add(it, 'now'); });
    oldItems.forEach(function (it) { add(it, 'old'); });
    const groups = [], gmap = new Map();
    order.forEach(function (k) {
      const r = map.get(k), gk = norm(r.grp);
      if (!gmap.has(gk)) { const g = { grp: r.grp || '(no group)', old: 0, now: 0, rows: [] }; gmap.set(gk, g); groups.push(g); }
      const g = gmap.get(gk);
      g.old += r.old; g.now += r.now; g.rows.push(r);
    });
    return groups;
  }

  /* ---------- 8. Checks ---------- */

  const CHECKS = {
    dup:     { label: 'Duplicate number',        help: 'The same document number is listed more than once.' },
    seq:     { label: 'Repeated sequence',       help: 'Two or more documents share the same sequence number.' },
    nonum:   { label: 'No document number',      help: 'A row has a title but no document number.' },
    parts:   { label: 'Wrong number of parts',   help: 'The number has more or fewer parts than the rest of the TIDP.' },
    norev:   { label: 'Missing revision',        help: 'The number does not end with a revision like T0 or T1.' },
    revfmt:  { label: 'Odd revision',            help: 'The revision does not look like T0, T1, P01…' },
    revcol:  { label: 'Revision column differs', help: 'The revision in the number is not the same as the Revision column.' },
    meta:    { label: 'Number vs columns',       help: 'A part of the number is different from its own column in the TIDP.' },
    odd:     { label: 'Unusual code',            help: 'A part that is the same for almost every drawing (like the project code) is different here.' },
    seqlen:  { label: 'Sequence length',         help: 'The sequence number has a different number of digits from the rest.' },
    date:    { label: 'Bad date',                help: 'A "date required" cell has a typo or is not a date.' },
    order:   { label: 'Dates out of order',      help: 'A later stage has an earlier date than the stage before it.' },
    gap:     { label: 'Gap in sequence',         help: 'A number is missing from a run of sequence numbers in the same category (e.g. 10101, 10111, —, 10131).' },
    title2:  { label: 'Same title twice',        help: 'Two drawings of the same type (e.g. two PLN) have exactly the same description, and their numbers are not one set of sheets.' },
    oddrow:  { label: 'Odd row in TIDP',         help: 'Column A has only a number (like "23"). It is not used as a heading — check this row in Excel.' }
  };

  function majorityOf(values) {
    const c = new Map();
    values.forEach(function (v) { if (v !== '' && v !== null && v !== undefined) c.set(v, (c.get(v) || 0) + 1); });
    let best = null, n = 0, total = 0;
    c.forEach(function (count, value) { total += count; if (count > n) { n = count; best = value; } });
    return { value: best, share: total ? n / total : 0 };
  }

  /* Repeated sequence numbers. sameType: only count repeats within the same document type. */
  function seqCheck(items, sameType) {
    const groups = new Map();
    items.forEach(function (it) {
      if (!it.seq || !it.num) return;
      const k = sameType ? it.seq + '|' + it.type : it.seq;
      if (!groups.has(k)) groups.set(k, { seq: it.seq, type: sameType ? it.type : '', nums: new Map() });
      const g = groups.get(k);
      if (!g.nums.has(it.key)) g.nums.set(it.key, it);
    });
    const out = [];
    groups.forEach(function (g) { if (g.nums.size > 1) out.push({ seq: g.seq, type: g.type, items: Array.from(g.nums.values()) }); });
    out.sort(function (a, b) { return a.seq < b.seq ? -1 : a.seq > b.seq ? 1 : 0; });
    return out;
  }

  /* Runs every check. Returns a flat list of { kind, item, detail }. */
  function runChecks(items, stages, opts) {
    opts = opts || {};
    const out = [];
    const push = function (kind, it, detail) { out.push({ kind: kind, item: it, detail: detail }); };
    const numbered = items.filter(function (it) { return it.num; });

    // How a "normal" number looks in this TIDP
    const partCount = majorityOf(numbered.map(function (it) { return it.parts.length; })).value;
    const seqLen = majorityOf(numbered.map(function (it) { return it.seq.length; })).value;
    const fixedParts = [];
    FIXED_PARTS.forEach(function (k) {
      if (k >= (partCount || 0) - 1) return;
      const m = majorityOf(numbered.filter(function (it) { return it.parts.length === partCount; }).map(function (it) { return it.parts[k]; }));
      if (m.share >= MAJORITY) fixedParts[k] = m.value;
    });

    // Duplicates
    const seen = new Map();
    numbered.forEach(function (it) { seen.set(it.key, (seen.get(it.key) || 0) + 1); });
    const dupDone = new Set();
    numbered.forEach(function (it) {
      if (seen.get(it.key) > 1 && !dupDone.has(it.key)) { dupDone.add(it.key); push('dup', it, 'Listed ' + seen.get(it.key) + ' times'); }
    });

    // Repeated sequences
    seqCheck(items, opts.sameType).forEach(function (g) {
      g.items.forEach(function (it) {
        push('seq', it, 'Sequence ' + g.seq + ' is also used by ' + g.items.filter(function (x) { return x !== it; }).map(function (x) { return x.num; }).join(', '));
      });
    });

    items.forEach(function (it) {
      if (!it.num) { push('nonum', it, 'Row ' + it.row); return; }
      const isModel = norm(it.grp) === 'MODELS' || it.trailingDash;
      // A number without a revision is one part short; that is reported as "Missing revision" instead
      const size = it.parts.length + (it.rev ? 0 : 1);

      if (partCount && size !== partCount) {
        push('parts', it, it.parts.length + ' parts, most numbers have ' + partCount);
      }
      if (!isModel && !it.rev) {
        const last = it.parts[it.parts.length - 1] || '';
        if (/^\d+$/.test(last)) push('norev', it, 'Ends with ' + last + (it.revCol ? ' — Revision column says ' + it.revCol : ''));
        else push('revfmt', it, 'Ends with "' + last + '"');
      }
      if (it.rev && it.revCol && it.revCol !== it.rev) {
        push('revcol', it, 'Number says ' + it.rev + ', Revision column says ' + it.revCol);
      }
      // Each part against its own column (project code, originator, …)
      (it.meta || []).forEach(function (val, k) {
        if (val === null || val === '' || size !== partCount) return;
        const part = it.parts[k];
        if (part !== undefined && val !== part && !(PART_COLUMNS[k].key === 'SEQUENCE NUMBER' && Number(val) === Number(part))) {
          push('meta', it, PART_COLUMNS[k].label + ': number has ' + part + ', column has ' + val);
        }
      });
      // Parts that are almost always the same
      fixedParts.forEach(function (val, k) {
        if (val !== undefined && size === partCount && it.parts[k] !== val) {
          push('odd', it, (PART_COLUMNS[k] ? PART_COLUMNS[k].label : 'Part ' + (k + 1)) + ' is ' + it.parts[k] + ', almost all others use ' + val);
        }
      });
      if (seqLen && it.seq && it.seq.length !== seqLen) push('seqlen', it, it.seq + ' has ' + it.seq.length + ' digits, most have ' + seqLen);

      // Dates
      let prev = null;
      (it.dates || []).forEach(function (d, k) {
        if (!d) return;
        const name = stages[k] ? stages[k].name : 'Stage ' + (k + 1);
        if (d.bad) { push('date', it, name + ': "' + d.raw + '" — ' + d.bad); return; }
        if (prev && d.iso < prev.iso) push('order', it, name + ' (' + d.iso + ') is before ' + prev.name + ' (' + prev.iso + ')');
        prev = { iso: d.iso, name: name };
      });
    });

    // Gaps in sequence runs
    seqGaps(items).forEach(function (g) { push('gap', g.item, 'Sequence ' + g.missing.join(', ') + ' missing between ' + g.from + ' and ' + g.to); });

    // Same title on different drawings
    const byTitle = new Map();
    numbered.forEach(function (it) {
      const t = norm(it.title) && norm(it.title) + '|' + it.type;   // same title AND same drawing type (PLN, SEC…)
      if (!t) return;
      if (!byTitle.has(t)) byTitle.set(t, []);
      if (!byTitle.get(t).some(function (x) { return x.base === it.base; })) byTitle.get(t).push(it);
    });
    byTitle.forEach(function (list) {
      if (list.length < 2) return;
      // sheets of one set (consecutive sequence numbers, e.g. 30180, 30181) are normal
      const seqs = list.map(function (x) { return Number(x.seq); }).sort(function (x, y) { return x - y; });
      if (seqs.every(function (n, i) { return i === 0 || n - seqs[i - 1] <= 1; })) return;
      list.forEach(function (it) { push('title2', it, 'Same title as ' + list.filter(function (x) { return x !== it; }).map(function (x) { return x.num; }).join(', ')); });
    });

    // Rows that only hold a number in column A
    (opts.oddRows || []).forEach(function (o) {
      push('oddrow', { num: '', title: o.title || ('Column A: "' + o.text + '"'), row: o.row, grp: o.grp, cat: o.cat, sub: o.sub, key: '#odd' + o.row }, 'Column A has only "' + o.text + '" — not used as a heading');
    });
    return out;
  }

  /* Step between sequence numbers in one category (e.g. 10): the most common difference */
  function seqStep(nums) {
    const diffs = [];
    for (let i = 1; i < nums.length; i++) diffs.push(nums[i] - nums[i - 1]);
    const m = majorityOf(diffs.filter(function (d) { return d > 0; }));
    return m.value && m.share >= 0.6 ? m.value : 0;
  }
  function seqGroups(items) {
    const groups = new Map();
    items.forEach(function (it) {
      if (!it.seq || !it.num) return;
      const k = norm(pathOf(it)) + '|' + it.type;
      if (!groups.has(k)) groups.set(k, { items: [], len: it.seq.length });
      groups.get(k).items.push(it);
    });
    return groups;
  }
  /* Missing numbers inside a regular run (only small gaps of 1–2 steps are reported) */
  function seqGaps(items) {
    const used = new Set(items.map(function (it) { return Number(it.seq); }));
    const out = [];
    seqGroups(items).forEach(function (g) {
      const byNum = new Map();
      g.items.forEach(function (it) { const n = Number(it.seq); if (!byNum.has(n)) byNum.set(n, it); });
      const nums = Array.from(byNum.keys()).sort(function (a, b) { return a - b; });
      if (nums.length < 3) return;
      const step = seqStep(nums);
      if (!step) return;
      for (let i = 1; i < nums.length; i++) {
        const d = nums[i] - nums[i - 1];
        if (d !== 2 * step && d !== 3 * step) continue;
        const missing = [];
        for (let n = nums[i - 1] + step; n < nums[i]; n += step) if (!used.has(n)) missing.push(String(n).padStart(g.len, '0'));
        if (missing.length) out.push({ item: byNum.get(nums[i]), missing: missing, from: String(nums[i - 1]).padStart(g.len, '0'), to: String(nums[i]).padStart(g.len, '0') });
      }
    });
    return out;
  }
  /* Next unused sequence number for a category (its items), checked against the whole TIDP */
  function nextFreeSeq(catItems, allItems) {
    const nums = uniqNums(catItems);
    if (!nums.length) return null;
    const step = seqStep(nums) || 1;
    const used = new Set(uniqNums(allItems));
    const len = (catItems.find(function (it) { return it.seq; }) || {}).seq.length;
    let n = nums[nums.length - 1] + step;
    while (used.has(n)) n += step;
    return { next: String(n).padStart(len, '0'), step: step, last: String(nums[nums.length - 1]).padStart(len, '0') };
  }
  function uniqNums(items) {
    return Array.from(new Set(items.filter(function (it) { return it.seq; }).map(function (it) { return Number(it.seq); }))).sort(function (a, b) { return a - b; });
  }

  /* ---------- 9. Due dates and the chase list ---------- */
  /* For one item:
       last = the latest stage date already passed
       next = the next stage date still to come
     A stage counts as done when the drawing was submitted after the stage before it.
     state: 'overdue' | 'soon' | 'ok' | 'none' */
  function dueInfo(it, stages, subDates, today, soonDays) {
    const ds = [];
    (it.dates || []).forEach(function (d, k) { if (d && d.iso && !d.bad) ds.push({ iso: d.iso, stage: stages[k] ? stages[k].name : 'Stage ' + (k + 1), k: k }); });
    ds.sort(function (a, b) { return a.iso < b.iso ? -1 : a.iso > b.iso ? 1 : a.k - b.k; });
    const past = ds.filter(function (d) { return d.iso < today; });
    const next = ds.find(function (d) { return d.iso >= today; }) || null;
    const last = past.length ? past[past.length - 1] : null;
    const before = past.length > 1 ? past[past.length - 2] : null;
    const sentAfter = function (iso) { return subDates.some(function (s) { return !iso || s > iso; }); };

    const out = { last: last, next: next, state: 'ok', lateDays: 0, daysTo: next ? daysBetween(today, next.iso) : null, nextSent: sentAfter(last && last.iso) };
    if (!ds.length) { out.state = 'none'; return out; }
    if (last && !sentAfter(before && before.iso)) { out.state = 'overdue'; out.lateDays = daysBetween(last.iso, today); return out; }
    if (next && out.daysTo <= soonDays && !sentAfter(last && last.iso)) out.state = 'soon';
    return out;
  }

  /* Progress per stage: how many drawings have a date, how many are due by today, and how many of those are done */
  function stageProgress(items, stages, subDatesOf, today) {
    return stages.map(function (st, k) {
      const r = { name: st.name, planned: 0, due: 0, done: 0, first: '', lastDate: '', dates: new Map() };
      items.forEach(function (it) {
        const d = it.dates && it.dates[k];
        if (!d || !d.iso || d.bad) return;
        r.planned++;
        r.dates.set(d.iso, (r.dates.get(d.iso) || 0) + 1);
        if (!r.first || d.iso < r.first) r.first = d.iso;
        if (!r.lastDate || d.iso > r.lastDate) r.lastDate = d.iso;
        // the stage before this one, for this drawing
        let prevIso = '';
        it.dates.forEach(function (x, j) { if (x && x.iso && !x.bad && x.iso < d.iso && j !== k && x.iso > prevIso) prevIso = x.iso; });
        const sent = subDatesOf(it).some(function (s) { return !prevIso || s > prevIso; });
        if (d.iso < today) { r.due++; if (sent) r.done++; }
      });
      let common = '', n = 0;
      r.dates.forEach(function (c, iso) { if (c > n) { n = c; common = iso; } });
      r.common = common;
      delete r.dates;
      return r;
    });
  }

  /* ---------- 10. Drawing tracker (your own entries) ---------- */
  /* store: { cols: [names], rows: { KEY: { num, title, grp, cat, sub, v: { column: value } } } } */

  function hasValues(v) {
    if (!v) return false;
    for (const k in v) if (txt(v[k]) !== '') return true;
    return false;
  }

  /* Joins the latest TIDP with your saved entries.
     When a drawing comes back with a new revision, your entries move to the new number. */
  function buildTracker(items, store, cmp) {
    const status = new Map();
    if (cmp) {
      cmp.added.forEach(function (it) { status.set(it.key, 'Added'); });
      cmp.revised.forEach(function (r) { status.set(r.item.key, 'Revised'); });
      cmp.edited.forEach(function (r) { status.set(r.item.key, 'Edited'); });
    }
    const latest = new Set(items.map(function (i) { return i.key; }));
    const orphanByBase = new Map();
    Object.keys(store.rows).forEach(function (k) {
      if (latest.has(k)) return;
      const b = baseOf(store.rows[k].num);
      if (b && !orphanByBase.has(b)) orphanByBase.set(b, k);
    });
    const used = new Set(), moves = [], seen = new Set();
    const rows = items.map(function (it) {
      let v = {}, st = status.get(it.key) || '', carried = '';
      if (seen.has(it.key)) st = 'Duplicate';
      seen.add(it.key);
      if (store.rows[it.key]) { v = store.rows[it.key].v || {}; used.add(it.key); }
      else if (it.base && orphanByBase.has(it.base)) {
        const k = orphanByBase.get(it.base);
        if (!used.has(k)) {
          v = store.rows[k].v || {}; used.add(k); carried = store.rows[k].num;
          st = 'Revised'; moves.push([k, it.key]);
        }
      }
      return Object.assign({}, it, { v: Object.assign({}, v), change: st, carried: carried });
    });
    const removed = [];
    Object.keys(store.rows).forEach(function (k) {
      const r = store.rows[k];
      if (latest.has(k) || used.has(k) || !hasValues(r.v)) return;
      const it = enrich({ grp: r.grp || '', cat: r.cat || '', sub: r.sub || '', num: r.num, title: r.title || '' });
      it.v = Object.assign({}, r.v); it.change = 'Removed from TIDP'; it.removed = true; it.key = k; it.dates = [];
      removed.push(it);
    });
    return { rows: rows, removed: removed, moves: moves };
  }

  /* ---------- 11. Model list and model suggestions ---------- */

  function modelKey(typ) { return compact(txt(typ).toUpperCase().replace(/^\*+/, '').replace(/\bTYPE\b/g, ' ')); }

  /* "UNIT TYPE 2 BR - Type A1 (Res.1) - DETAILED PLANS" -> "2BRA1" */
  function drawingUnitKey(title) {
    let s = txt(title).toUpperCase();
    s = s.split('(')[0];
    s = s.split(/\s-\s*(DETAILED|SECTIONAL|INTERNAL|ENLARGED|FLOOR|REFLECTED|SETTING)/)[0];
    s = s.replace(/^SV\s+/, '').replace(/UNIT\s+TYPE/, ' ').replace(/\bTYPE\b/g, ' ');
    return compact(s);
  }
  function towerFromTitle(title) {
    const t = txt(title);
    const m = /\(\s*Res\.?\s*(\d)/i.exec(t) || /\(\s*Akala\s*(\d)/i.exec(t);
    return m ? 'T' + m[1] : '';
  }
  function towerFromNumber(num) {
    const p = norm(num).split('-');
    return p.length > 2 && /^T\d$/.test(p[2]) ? p[2] : '';
  }
  function cleanTower(t) { t = norm(t); return (t === '-' || t === '–') ? '' : t; }

  function makeModel(o) {
    const typ = txt(o.typ), type = txt(o.type);
    const m = {
      num: txt(o.num), tower: cleanTower(o.tower), typ: typ.replace(/^\*+\s*/, ''), loc: txt(o.loc),
      type: type === '-' ? '' : type, url: txt(o.url)
    };
    m.variant = /^\*/.test(typ) || /variant/i.test(type);
    m.key = modelKey(typ);
    m.id = norm(m.num);
    m.name = m.tower ? (m.tower + ' - ' + m.typ + (m.variant ? ' (variant' + (m.loc ? ', L' + m.loc : '') + ')' : '')) : m.typ;
    return m;
  }

  /* rows: grid rows incl. header; links: row index -> hyperlink */
  function parseModelList(rows, links) {
    let h = -1;
    for (let i = 0; i < Math.min(rows.length, 40); i++) {
      if (rows[i].some(function (c) { return /MODEL\s*(NUMBER|NO)/.test(norm(c)); })) { h = i; break; }
    }
    if (h < 0) return { models: [], error: 'Could not find a "Model number" column.' };
    const idx = {};
    rows[h].forEach(function (c, k) {
      const u = norm(c);
      if (/MODEL\s*(NUMBER|NO)/.test(u)) idx.num = k;
      else if (u === 'TOWER' || u === 'BUILDING') idx.tower = k;
      else if (/TYPOLOGY/.test(u)) idx.typ = k;                                   // a real Typology column wins
      else if (/MODEL\s*NAME|DESCRIPTION/.test(u) && idx.typName === undefined) idx.typName = k;
      else if (/SHEET\s*LOC|LEVEL|LOCATION/.test(u)) idx.loc = k;
      else if (/MODEL\s*TYPE/.test(u)) idx.type = k;
      else if (/PATH|LINK|URL|ACC/.test(u)) idx.url = k;
    });
    if (idx.typ === undefined) idx.typ = idx.typName;
    const models = [], seen = {};
    for (let i = h + 1; i < rows.length; i++) {
      const r = rows[i], num = txt(r[idx.num]);
      if (!num || seen[norm(num)]) continue;
      let url = idx.url !== undefined ? txt(r[idx.url]) : '';
      if (!/^https?:\/\//i.test(url)) url = (links && links[i]) || '';
      seen[norm(num)] = 1;
      models.push(makeModel({ num: num, tower: r[idx.tower], typ: r[idx.typ], loc: r[idx.loc], type: r[idx.type], url: url }));
    }
    return { models: models };
  }

  function modelIndex(models) {
    const byKey = new Map(), byId = new Map(), byBase = new Map();
    models.forEach(function (m) {
      byId.set(m.id, m);
      const b = baseOf(m.num);
      if (!byBase.has(b)) byBase.set(b, m);
      if (!m.key) return;
      if (!byKey.has(m.key)) byKey.set(m.key, []);
      byKey.get(m.key).push(m);
    });
    return { byKey: byKey, byId: byId, byBase: byBase, list: models };
  }
  function findModel(ix, num) {
    if (!num || !ix) return null;
    const id = norm(num);
    return ix.byId.get(id) || ix.byId.get(id.replace(/-$/, '')) || ix.byBase.get(baseOf(id)) || null;
  }
  /* "Tower 1" / "1" / "T-1" → "T1" */
  function towerKey(t) { t = norm(t).replace(/^TOWER\s*/, 'T').replace(/^BUILDING\s*/, '').replace(/[\s-]/g, ''); if (/^\d+$/.test(t)) t = 'T' + t; return t === '–' ? '' : t; }
  /* Models whose typology matches what you typed ("1BR-A", "1BRA" or "UNIT TYPE 1 BR - TYPE A (RES.1)") — and the tower, if you gave one */
  function matchByTyp(ix, typ, tower) {
    if (!ix || !txt(typ)) return [];
    const k1 = drawingUnitKey(typ), k2 = modelKey(typ), tw = towerKey(tower);
    return ix.list.filter(function (m) {
      const a = drawingUnitKey(m.typ), b = m.key;
      const hit = (k1 && (a === k1 || b === k1)) || (k2 && (a === k2 || b === k2));
      return hit && (!tw || !m.tower || towerKey(m.tower) === tw);
    }).sort(function (a, b) { return (a.variant ? 1 : 0) - (b.variant ? 1 : 0); });
  }
  function suggestModel(it, ix) {
    const tt = towerFromTitle(it.title), tn = towerFromNumber(it.num), tower = tt || tn;
    const key = drawingUnitKey(it.title);
    const out = { tower: tower, titleTower: tt, numTower: tn, conflict: !!(tt && tn && tt !== tn), model: null, alts: [] };
    if (it.v && txt(it.v.Typology) && ix) {     // your own Tower + Typology come first
      const mine = matchByTyp(ix, it.v.Typology, it.v.Tower || tower);
      if (mine.length) { out.model = mine[0]; out.alts = mine; out.fromYours = true; return out; }
    }
    if (!key || !ix) return out;
    const c = (ix.byKey.get(key) || []).filter(function (m) { return !tower || m.tower === tower; });
    c.sort(function (a, b) { return (a.variant ? 1 : 0) - (b.variant ? 1 : 0); });
    out.alts = c;
    out.model = c[0] || null;
    return out;
  }

  /* ---------- 12. Submission lists ---------- */

  /* Finds the number (and description) columns in a list. Works with or without a header row. */
  function parseList(rows) {
    let h = -1, cn = -1, ct = -1;
    for (let i = 0; i < Math.min(rows.length, 30) && h < 0; i++) {
      for (let j = 0; j < rows[i].length; j++) {
        const u = norm(rows[i][j]);
        if (/(DRAWING|DOCUMENT|DWG|DOC|SHEET)\s*(NUMBER|NO\.?|#)|^NUMBER$|FILE\s*NAME/.test(u)) { h = i; cn = j; }
      }
    }
    if (h >= 0) rows[h].forEach(function (c, k) { const u = norm(c); if (ct < 0 && k !== cn && /DESCRIPTION|TITLE|SHEET\s*NAME|NAME/.test(u)) ct = k; });
    if (h < 0) { // no header: use the column with the most document numbers
      let best = -1, bc = 0;
      for (let j = 0; j < 10; j++) {
        let c = 0;
        rows.forEach(function (r) { if (isDocNumber(r[j])) c++; });
        if (c > bc) { bc = c; best = j; }
      }
      cn = best; ct = best + 1;
    }
    if (cn < 0) return [];
    const out = [], seen = {};
    for (let i = h + 1; i < rows.length; i++) {
      const num = cleanFileName(rows[i][cn]);
      if (!isDocNumber(num) || seen[norm(num)]) continue;
      seen[norm(num)] = 1;
      out.push({ num: num, title: ct >= 0 ? txt(rows[i][ct]) : '' });
    }
    return out;
  }

  /* "5013-KEO-T1-ZZ-PLN-INT-10101-T1.pdf" -> "5013-KEO-T1-ZZ-PLN-INT-10101-T1" */
  function cleanFileName(name) { return txt(name).replace(/\.(pdf|dwg|dwf|dwfx|rvt|ifc|nwc|nwd|xlsx?|docx?)$/i, ''); }

  /* How each submitted drawing lines up with the TIDP:
     exact = same number, rev = same drawing but another revision, title = only the title matches, none = not found */
  function matchList(entries, items) {
    const byKey = new Map(), byBase = new Map(), byTitle = new Map();
    items.forEach(function (it) {
      if (!it.num) return;
      if (!byKey.has(it.key)) byKey.set(it.key, it);
      if (it.base && !byBase.has(it.base)) byBase.set(it.base, it);
      const t = compact(it.title);
      if (t) { if (!byTitle.has(t)) byTitle.set(t, []); byTitle.get(t).push(it); }
    });
    return entries.map(function (e) {
      const p = splitNumber(e.num);
      const r = { num: txt(e.num), title: txt(e.title), rev: p.rev, match: 'none', item: null, titleDiff: false, revCmp: null };
      const k = keyOf(e.num, e.title);
      if (byKey.has(k)) { r.match = 'exact'; r.item = byKey.get(k); }
      else if (p.base && byBase.has(p.base)) { r.match = 'rev'; r.item = byBase.get(p.base); r.revCmp = compareRev(p.rev, r.item.rev); }
      else {
        const tl = byTitle.get(compact(e.title)) || [];
        if (tl.length === 1) { r.match = 'title'; r.item = tl[0]; }
      }
      if (r.item && r.title && compact(r.item.title) !== compact(r.title)) r.titleDiff = true;
      return r;
    });
  }

  /* Guesses a date from a file name: 20261022_..., 2026-10-22, 22-10-2026 */
  function dateFromName(n) {
    let m = /(20\d\d)[-_. ]?(\d\d)[-_. ]?(\d\d)/.exec(n || '');
    if (m && validYMD(+m[1], +m[2], +m[3])) return m[1] + '-' + m[2] + '-' + m[3];
    m = /(\d\d)[-_. ](\d\d)[-_. ](20\d\d)/.exec(n || '');
    if (m && validYMD(+m[3], +m[2], +m[1])) return m[3] + '-' + m[2] + '-' + m[1];
    return '';
  }
  /* Guesses a submission name from a file name: "PTA3_LOD.xlsx" -> "PTA #3" */
  function typeFromName(n) {
    const s = txt(n).replace(/\.[a-z0-9]+$/i, '');
    const m = /\b([A-Z]{2,5})\s*[#_-]?\s*(\d{1,3})(?!\d)/i.exec(s.replace(/_/g, ' '));
    return m ? m[1].toUpperCase() + ' #' + Number(m[2]) : s;
  }


  /* ---------- 13. Pre-check of file names (before you submit) ---------- */

  const NUM_TOKEN_RE = /[A-Z0-9]+(?:-[A-Z0-9]*){4,}/i;
  const PRE = {
    ok:       { label: 'Correct',              order: 6 },
    name:     { label: 'Name problem',         order: 4 },
    rev:      { label: 'Wrong revision',       order: 3 },
    dup:      { label: 'Duplicate',            order: 2 },
    notfound: { label: 'Not in TIDP',          order: 1 },
    notnum:   { label: 'Not a drawing number', order: 0 }
  };

  /* "C:\Sets\5013-KEO-...-T1 (1).pdf" -> { file, ext: 'PDF', num: '5013-KEO-...-T1', issues: [...] } */
  function readFileName(name) {
    const file = txt(name).replace(/^["']|["']$/g, '').split(/[\\/]/).pop();
    const m = /\.([A-Za-z0-9]{2,5})$/.exec(file);
    const ext = m && !/^\d+$/.test(m[1]) ? m[1].toUpperCase() : '';
    const stem = ext ? file.slice(0, -(ext.length + 1)) : file;
    const t = NUM_TOKEN_RE.exec(stem);
    const out = { file: file, ext: ext, num: t ? t[0].toUpperCase() : '', issues: [] };
    if (!t) return out;
    const extra = (stem.slice(0, t.index) + ' ' + stem.slice(t.index + t[0].length)).trim();
    if (extra) out.issues.push('Extra text in the name: "' + extra + '"');
    if (t[0] !== t[0].toUpperCase()) out.issues.push('Lower-case letters in the number');
    return out;
  }

  /* names: file names / paths. items: the TIDP tab. otherTabs: Map(number or base -> tab name) for the rest of the MIDP.
     Returns one row per drawing number (a PDF and a DWG of the same drawing are one row). */
  function precheck(names, items, otherTabs) {
    const groups = new Map(), bad = [];
    names.forEach(function (n) {
      const f = readFileName(n);
      if (!f.file) return;
      if (!f.num) { bad.push({ key: '#' + f.file, num: '', rev: '', files: [f.file], exts: [f.ext], kind: 'notnum', issues: [], item: null, advice: 'The name does not contain a document number.' }); return; }
      const k = norm(f.num);
      if (!groups.has(k)) groups.set(k, { key: k, num: f.num, files: [], exts: [], issues: [] });
      const g = groups.get(k);
      g.files.push(f.file); g.exts.push(f.ext);
      f.issues.forEach(function (x) { if (g.issues.indexOf(x) < 0) g.issues.push(x); });
    });

    const byKey = new Map(), byBase = new Map(), bySeq = new Map();
    items.forEach(function (it) {
      if (!it.num) return;
      if (!byKey.has(it.key)) byKey.set(it.key, it);
      if (it.base && !byBase.has(it.base)) byBase.set(it.base, it);
      if (it.seq) { if (!bySeq.has(it.seq)) bySeq.set(it.seq, []); bySeq.get(it.seq).push(it); }
    });
    // two revisions of the same drawing in one set
    const baseCount = new Map();
    groups.forEach(function (g) { const b = splitNumber(g.num).base; baseCount.set(b, (baseCount.get(b) || 0) + 1); });

    const rows = [];
    groups.forEach(function (g) {
      const p = splitNumber(g.num);
      const r = { key: g.key, num: g.num, rev: p.rev, files: g.files, exts: g.exts, issues: g.issues.slice(), item: null, kind: 'ok', advice: '', otherTab: '' };
      if (byKey.has(g.key)) r.item = byKey.get(g.key);
      else if (p.base && byBase.has(p.base)) {
        r.item = byBase.get(p.base);
        const c = compareRev(p.rev, r.item.rev);
        r.kind = 'rev';
        r.advice = 'TIDP shows ' + (r.item.rev || 'no revision') + ', file is ' + (p.rev || 'without revision') +
          (c > 0 ? ' — newer than the TIDP (update the TIDP?)' : c < 0 ? ' — older than the TIDP (send the latest?)' : '');
      } else {
        r.kind = 'notfound';
        r.otherTab = otherTabs ? (otherTabs.get(g.key) || otherTabs.get(p.base) || '') : '';
        const near = (bySeq.get(p.seq) || []).map(function (x) { return x.num; });
        r.advice = r.otherTab ? 'Found in the ' + r.otherTab + ' tab, not in this tab' :
          near.length ? 'Did you mean ' + near.slice(0, 3).join(' or ') + '?' : 'No drawing with this number or sequence in the TIDP';
      }
      // same file more than once (for example in two sub-folders)
      const seenExt = {};
      g.exts.forEach(function (e) { seenExt[e] = (seenExt[e] || 0) + 1; });
      const twice = Object.keys(seenExt).filter(function (e) { return seenExt[e] > 1; });
      if (twice.length) r.issues.push((twice[0] || 'File') + ' appears ' + seenExt[twice[0]] + ' times');
      if (p.base && baseCount.get(p.base) > 1) r.issues.push('Another revision of this drawing is in the same set');
      if (r.kind === 'ok' && (twice.length || baseCount.get(p.base) > 1)) r.kind = 'dup';
      else if (r.kind === 'ok' && r.issues.length) r.kind = 'name';
      if (r.kind === 'name') r.advice = 'Rename to ' + g.num + (g.exts[0] ? '.' + g.exts[0].toLowerCase() : '');
      if (r.kind === 'dup') r.advice = 'Keep one file per drawing and revision';
      rows.push(r);
    });
    return rows.concat(bad);
  }

  root.TIDP = {
    GROUPS: GROUPS, CHECKS: CHECKS, PART_COLUMNS: PART_COLUMNS,
    txt: txt, norm: norm, compact: compact,
    isDocNumber: isDocNumber, splitNumber: splitNumber, keyOf: keyOf, baseOf: baseOf, revOf: revOf, compareRev: compareRev,
    pathOf: pathOf, enrich: enrich,
    readDate: readDate, todayIso: todayIso, daysBetween: daysBetween, addDays: addDays, dayNum: dayNum,
    sheetToGrid: sheetToGrid, parseTidp: parseTidp,
    compare: compare, counts: counts, seqCheck: seqCheck, runChecks: runChecks,
    dueInfo: dueInfo, stageProgress: stageProgress,
    hasValues: hasValues, buildTracker: buildTracker,
    modelKey: modelKey, drawingUnitKey: drawingUnitKey, towerFromTitle: towerFromTitle, towerFromNumber: towerFromNumber,
    makeModel: makeModel, parseModelList: parseModelList, modelIndex: modelIndex, findModel: findModel, suggestModel: suggestModel, matchByTyp: matchByTyp,
    seqGaps: seqGaps, nextFreeSeq: nextFreeSeq, PRE: PRE, readFileName: readFileName, precheck: precheck,
    parseList: parseList, cleanFileName: cleanFileName, matchList: matchList, dateFromName: dateFromName, typeFromName: typeFromName
  };
})(typeof window !== 'undefined' ? window : globalThis);
