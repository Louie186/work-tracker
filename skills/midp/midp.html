      '<div class="chips">' + chip('models.filter', 'all', 'All', st.total, u.filter) + chip('models.filter', 'assigned', 'Assigned', st.assigned, u.filter, 'var(--ok)') +
      chip('models.filter', 'suggested', 'Suggested', st.suggested, u.filter, 'var(--info)') + chip('models.filter', 'open', 'Not assigned', st.open, u.filter, 'var(--warn)') +
      chip('models.filter', 'conflict', 'Tower mismatch', st.conflict, u.filter, 'var(--bad)') + '</div></div>' +
      '<div class="toolbar"><input type="search" id="mQ" data-input="models.q" placeholder="Search number, title, tower or model" value="' + esc(u.q) + '" aria-label="Search">' +
      '<select id="mT" data-change="models.tower" aria-label="Tower">' + options(towers, u.tower, 'All towers') + '</select>' +
      '<select id="mC" data-change="models.cat" aria-label="Category" style="max-width:240px">' + options(cats, u.cat, 'All categories') + '</select><span class="grow"></span>' +
      (sugVisible ? '<button class="btn small primary" type="button" data-act="acceptall">Accept ' + sugVisible + ' suggestions shown</button>' : '') +
      '<button class="btn small" type="button" data-act="autoassign" title="Assign a model wherever your Tower + Typology match exactly one model">Assign from Tower + Typology</button></div>';
    return h + grid('models', modelsList(), modelsCols(), { limit: u.limit, more: 'models', title: 'Models', empty: 'No drawings match these filters.' }).html;
  };
  /* Drop-down of models: same tower first */
  function modelSelect(r, i) {
    const tower = T.txt(r.v.Tower) || i.sugg.tower;
    const near = S.store.models.filter(function (m) { return !tower || m.tower === tower || !m.tower; });
    const rest = S.store.models.filter(function (m) { return near.indexOf(m) < 0; });
    const opt = function (m) { return '<option value="' + esc(m.id) + '"' + (i.model && i.model.id === m.id ? ' selected' : '') + '>' + esc(m.name + ' · ' + m.num) + '</option>'; };
    return '<select id="mSel" class="cellsel" data-change="massign" data-key="' + esc(r.key) + '" aria-label="Choose model"><option value="">Choose a model…</option>' +
      (tower ? '<optgroup label="Tower ' + esc(tower) + '">' : '') + near.map(opt).join('') + (tower ? '</optgroup>' : '') +
      (rest.length ? '<optgroup label="Other towers">' + rest.map(opt).join('') + '</optgroup>' : '') + '</select>';
  }
  /* How many drawings use each model */
  function modelUsageHtml() {
    const use = new Map();
    S.built.rows.forEach(function (r) { const m = T.findModel(S.mix, r.v['Model Number']); if (m) use.set(m.id, (use.get(m.id) || 0) + 1); });
    const unused = S.store.models.filter(function (m) { return !use.get(m.id); }).length;
    const list = S.store.models.filter(function (m) { return !S.ui.models.unused || !use.get(m.id); }).map(function (m) { return Object.assign({ n: use.get(m.id) || 0, key: m.id }, m); });
    const cols = [
      { k: 'tower', label: 'Tower', w: 92, text: function (m) { return m.tower; } },
      { k: 'typ', label: 'Typology', w: 220, text: function (m) { return m.typ; } },
      { k: 'type', label: 'Model type', w: 140, text: function (m) { return m.variant ? 'Variant' : (m.type || ''); } },
      { k: 'loc', label: 'Sheet location', w: 110, text: function (m) { return m.loc; } },
      { k: 'num', label: 'Model number', w: 250, cls: 'mono', text: function (m) { return m.num; } },
      { k: 'n', label: 'Drawings', w: 90, cls: 'num', text: function (m) { return String(m.n); }, sortKey: function (m) { return m.n; }, html: function (m) { return m.n ? String(m.n) : tag('none', 'c-warn'); } },
      { k: 'acc', label: 'ACC', w: 110, nofilter: true, nosort: true, text: function (m) { return m.url ? 'link' : ''; }, html: function (m) { return m.url ? '<a href="' + esc(m.url) + '" target="_blank" rel="noopener">Open in ACC ↗</a>' : ''; } }
    ];
    return '<div class="toolbar"><span class="hint">' + plural(S.store.models.length, 'model') + ' · ' + unused + ' with no drawings</span>' +
      '<label class="hint"><input type="checkbox" data-change="models.unused"' + (S.ui.models.unused ? ' checked' : '') + '> Only models with no drawings</label></div>' +
      grid('musage', list, cols, { title: 'Model usage', empty: 'No models.' }).html;
  }

  /* ---------- 8i. Checks ---------- */

  VIEWS.checks = function () {
    const u = S.ui.checks, q = T.norm(u.q), counts = {};
    S.checks.forEach(function (c) { counts[c.kind] = (counts[c.kind] || 0) + 1; });

      { k: 'num', label: 'Document number', w: 250, stick: true, cls: 'mono', text: function (c) { return c.item.num || '(no number)'; }, html: function (c) { return numLink(c.item.num, c.item.key); } },

  };

  /* ---------- 8j. Files ---------- */

  const DROPS = [

    { kind: 'models', title: 'Model list', accept: '.xlsx,.xlsm,.xls', desc: 'Tower, Typology, Model number and ACC path.', icon: '<path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/>' },

  function dropState(kind) {

  VIEWS.files = function () {
    let h = '<div class="drops">' + DROPS.map(function (d) {
      const st = dropState(d.kind);

  /* ---------- 8k. Drawing detail panel ---------- */

  function preFromFiles(files) {

          runPre(uniq(names), excel[0].name);

    const names = files.map(function (f) { return f.webkitRelativePath || f.name; });

    runPre(names, folder ? 'Folder ' + folder : plural(files.length, 'file'));

  /* ---------- 11. Export to Excel ---------- */

  const XL = {
    head: 'FF1E2A1A', headInk: 'FFF3F6E6', edit: 'FFFFF8E5', group: 'FFE4EAD2',
    ok: 'FFC6EFCE', bad: 'FFFFC7CE', warn: 'FFFFEB9C', info: 'FFBDD7EE', odd: 'FFE4DFEC', mute: 'FFEDEDED'
  };
  const XL_CHANGE = { 'Added': XL.ok, 'Revised': XL.info, 'Edited': XL.warn, 'Duplicate': XL.odd, 'Removed from TIDP': XL.bad, 'Removed': XL.bad };
  const XL_DUE = { overdue: XL.bad, soon: XL.warn, ok: XL.ok, none: XL.mute };
  const XL_PRE = { ok: XL.ok, rev: XL.info, name: XL.warn, dup: XL.odd, notfound: XL.bad, notnum: XL.bad };

  function fillOf(argb) { return { type: 'pattern', pattern: 'solid', fgColor: { argb: argb } }; }
  function xlDate(iso) { const n = T.dayNum(iso); return isNaN(n) ? '' : new Date(n * 86400000); }
  /* New sheet with a styled, frozen header row */
  function addSheet(wb, name, headers, widths, color) {
    const ws = wb.addWorksheet(name, { properties: { tabColor: { argb: color || XL.head } }, views: [{ state: 'frozen', ySplit: 1 }] });
    ws.columns = headers.map(function (h, i) { return { header: h, width: widths[i] || 14 }; });
    const r = ws.getRow(1);
    r.height = 20;
    r.eachCell(function (c) {
      c.font = { name: 'Arial', bold: true, size: 10, color: { argb: XL.headInk } };
      c.fill = fillOf(XL.head);
      c.alignment = { vertical: 'middle' };
    });
    return ws;
  }
  function finishSheet(ws, n) {
    if (ws.rowCount > 1) ws.autoFilter = { from: { row: 1, column: 1 }, to: { row: 1, column: n } };
    ws.eachRow(function (row, i) {
      if (i === 1) return;
      row.eachCell(function (c) { if (!c.font || !c.font.name) c.font = { name: 'Arial', size: 10 }; });
    });
  }
  function linkCell(cell, text, url) {
    if (!text) return;
    if (url) { cell.value = { text: text, hyperlink: url }; cell.font = { name: 'Arial', size: 10, color: { argb: 'FF2F6FA8' }, underline: true }; }
    else cell.value = text;
  }
  function dateCell(cell, iso) { if (iso) { cell.value = xlDate(iso); cell.numFmt = 'dd-mmm-yyyy'; } }
  function fileStamp() { return S.today.replace(/-/g, ''); }

  /* Saves a workbook as a download */
  function download(wb, name, after) {
    if (typeof ExcelJS === 'undefined') { toast('The Excel writer did not load. Check your internet connection and reload.'); return; }
    busy('Building Excel');
    setTimeout(function () {
      let book;
      try { book = wb(); } catch (e) { busy(''); S.errors = ['Export failed: ' + (e.message || e)]; render(); return; }
      book.xlsx.writeBuffer().then(function (buf) {
        const blob = new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob); a.download = name.replace(/[^\w.#-]+/g, '_');
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
        busy('');
        if (after) after();
        toast('Exported ' + a.download);
      }).catch(function (e) { busy(''); S.errors = ['Export failed: ' + (e.message || e)]; render(); });
    }, 30);
  }

  function trackerSheet(wb, list) {

    const own = ['Tower', 'Typology', 'Model Number', 'Work Status', 'Assigned To', 'Notes'];
    const head = ['Drawing Number', 'Drawing Description', 'Category'].concat(own)
      .concat(subs.map(subHead)).concat(cols)
      .concat(['Group', 'Sub-category', 'Sequence', 'Revision', 'TIDP Status', 'Change', 'Due State', 'Last Stage Due', 'Last Due Date', 'Next Stage', 'Next Due Date', 'Days Late', 'Times Submitted', 'Last Submitted', 'Model Name']);
    const ws = addSheet(wb, 'Drawing_Tracker', head, [36, 60, 40, 9, 16, 34, 14, 16, 40].concat(subs.map(function () { return 16; })).concat(cols.map(function () { return 18; })).concat([12, 22, 11, 10, 12, 14, 12, 24, 14, 24, 14, 10, 10, 14, 30]));
    const o = 9 + subs.length + cols.length;
    list.forEach(function (r) {
      const d = S.due.get(r.key) || { state: r.removed ? '' : 'none' }, sl = S.subByKey.get(r.key) || [], m = T.findModel(S.mix, r.v['Model Number']);
      const row = ws.addRow([r.num, r.title, catText(r)].concat(own.map(function (f) { return f === 'Model Number' ? '' : r.v[f] || ''; }))
        .concat(subs.map(function (sb) { return subMark(r, sb.id); }))
        .concat(cols.map(function (c) { return r.v[c] || ''; }))
        .concat([r.grp, r.sub, r.seq, r.rev, r.status || '', r.change || '', d.state ? DUE[d.state].label : '', d.last ? d.last.stage : '', '', d.next ? d.next.stage : '', '', d.state === 'overdue' ? d.lateDays : '', sl.length || '', '', m ? m.typ : '']));
      linkCell(row.getCell(6), r.v['Model Number'], m && m.url);
      if (d.last) dateCell(row.getCell(o + 9), d.last.iso);
      if (d.next) dateCell(row.getCell(o + 11), d.next.iso);
      if (sl.length) dateCell(row.getCell(o + 14), sl[0].sub.date);
      [4, 5, 7, 8, 9].concat(cols.map(function (c, i) { return 10 + subs.length + i; })).forEach(function (k) { row.getCell(k).fill = fillOf(XL.edit); });
      if (XL_CHANGE[r.change]) row.getCell(o + 6).fill = fillOf(XL_CHANGE[r.change]);
      if (d.state && XL_DUE[d.state]) row.getCell(o + 7).fill = fillOf(XL_DUE[d.state]);
    });
    finishSheet(ws, head.length);

    // Work status: the same choices as on the page
    try { const wsCol = String.fromCharCode(65 + 6); if (list.length) ws.dataValidations.add(wsCol + '2:' + wsCol + (list.length + 1), { type: 'list', allowBlank: true, formulae: ['"' + WORK_STATUS.join(',') + '"'] }); } catch (e) { /* older ExcelJS: no drop-down */ }
    return ws;
  }

  /* The full workbook */
  function buildWorkbook() {
    const wb = new ExcelJS.Workbook();
    wb.creator = 'MIDP Checker'; wb.created = new Date();
    const b = S.built, subs = subsByDate(), cols = S.store.cols;

    // 1. Drawing tracker (can be loaded back)
    trackerSheet(wb, b.rows.concat(b.removed));

    // 2. Chase list
    const wc = addSheet(wb, 'Chase_List', ['State', 'Days', 'Stage', 'Date Due', 'Drawing Number', 'Revision', 'Description', 'Last Sent', 'Last Submission', 'Assigned To', 'Category', 'Model Number'], [12, 8, 26, 14, 36, 9, 60, 14, 22, 16, 40, 34], 'FFC2452F');
    const chase = chaseList('both', '', '', 'late');
    if (!chase.length) wc.addRow(['All clear', '', 'Nothing late or due soon.']);
    chase.forEach(function (r) {
      const d = S.due.get(r.key), sl = S.subByKey.get(r.key) || [];
      const row = wc.addRow([DUE[d.state].label, d.state === 'overdue' ? d.lateDays : d.daysTo, dueStage(d), '', r.num, r.rev, r.title, '', sl.length ? subTypeOf(sl[0].sub) : 'Never', r.v['Assigned To'] || '', catText(r), r.v['Model Number'] || '']);
      dateCell(row.getCell(4), dueDate(d));
      if (sl.length) dateCell(row.getCell(8), sl[0].sub.date);
      row.getCell(1).fill = fillOf(XL_DUE[d.state]);
    });
    finishSheet(wc, 12);

    // 3. Stage progress
    const wp = addSheet(wb, 'Stage_Progress', ['Stage', 'Items With Date', 'First Date', 'Most Common Date', 'Last Date', 'Due By Today', 'Done', 'Done %', 'Still To Come'], [30, 14, 14, 18, 14, 14, 10, 10, 14], 'FF2F8A4A');
    S.progress.forEach(function (p) {
      const row = wp.addRow([p.name, p.planned, '', '', '', p.due, p.done, p.due ? p.done / p.due : '', p.planned - p.due]);
      dateCell(row.getCell(3), p.first); dateCell(row.getCell(4), p.common); dateCell(row.getCell(5), p.lastDate);
      row.getCell(8).numFmt = '0%';
    });
    finishSheet(wp, 9);

    // 4. Checks
    const wk = addSheet(wb, 'Checks', ['Check', 'Document Number', 'Title', 'What Is Wrong', 'Category', 'Excel Row'], [24, 36, 50, 60, 40, 10], 'FF7B4FA8');
    if (!S.checks.length) wk.addRow(['All good', '', 'No naming, revision or date problems found.']);
    S.checks.forEach(function (c) { const row = wk.addRow([T.CHECKS[c.kind].label, c.item.num, c.item.title, c.detail, T.pathOf(c.item), c.item.row || '']); row.getCell(1).fill = fillOf(XL.odd); });
    finishSheet(wk, 6);

    // 5. Changes
    const wg = addSheet(wb, 'Change_Report', ['Change', 'Document Number', 'Title', 'Group', 'Category', 'Sub-category', 'What Changed', 'Note'], [13, 36, 48, 12, 38, 22, 60, 40], 'FF2F6FA8');
    const cr = changeRows();
    if (!S.cmp) wg.addRow(['—', '', 'No previous TIDP was loaded, so there is nothing to compare.']);
    else if (!cr.length) wg.addRow(['No changes', '', 'The latest TIDP matches the previous one.']);
    cr.forEach(function (r) {
      const row = wg.addRow([r.type, r.item.num, r.item.title, r.item.grp, r.item.cat, r.item.sub, changeDetailText(r), r.note || '']);
      row.getCell(1).fill = fillOf(XL_CHANGE[r.type]);
    });
    finishSheet(wg, 8);

    // 6. Model assignment
    const wa = addSheet(wb, 'Model_Assignment', ['Group', 'Category', 'Sub-category', 'Document Number', 'Title', 'Tower', 'Typology', 'Model Name', 'Model Number', 'Assignment', 'Suggested Model', 'Note'], [12, 40, 22, 36, 52, 9, 16, 30, 34, 13, 40, 30], 'FF3F7A3A');
    b.rows.filter(isAssignable).forEach(function (r) {
      const i = mInfo(r), m = i.model;
      const row = wa.addRow([r.grp, r.cat, r.sub, r.num, r.title, r.v.Tower || '', r.v.Typology || '', m ? m.typ : '', '', { assigned: 'Assigned', suggested: 'Suggested', open: 'Not assigned' }[i.state],
        i.state === 'suggested' ? i.sugg.model.name + ' · ' + i.sugg.model.num : '', i.conflict ? 'Title says ' + i.sugg.titleTower + ', number says ' + i.sugg.numTower : '']);
      linkCell(row.getCell(9), i.num, m && m.url);
      row.getCell(10).fill = fillOf({ assigned: XL.ok, suggested: XL.info, open: XL.warn }[i.state]);
      if (i.conflict) row.getCell(12).fill = fillOf(XL.bad);
    });
    finishSheet(wa, 12);

    // 7. Model library (can be loaded back)
    if (S.store.models.length) {
      const wl = addSheet(wb, 'Model_Library', ['Tower', 'Typology', 'Sheet location', 'Model number', 'Model type', 'path', 'Drawings assigned'], [9, 40, 14, 34, 16, 60, 16], 'FF3F7A3A');
      const used = {};
      b.rows.forEach(function (r) { const m = T.findModel(S.mix, r.v['Model Number']); if (m) used[m.id] = (used[m.id] || 0) + 1; });
      S.store.models.forEach(function (m) {
        const row = wl.addRow([m.tower || '-', (m.variant ? '*' : '') + m.typ, m.loc, '', m.type || '', m.url, used[m.id] || 0]);
        linkCell(row.getCell(4), m.num, m.url);
      });
      finishSheet(wl, 7);
    }

    // 8. Submissions (can be loaded back)
    if (subs.length) {
      const wsb = addSheet(wb, 'Submissions', ['Submission ID', 'Date', 'Description', 'Type', 'Note', 'File', 'Drawing Number (as submitted)', 'Rev', 'Description (as submitted)', 'Check', 'Title Differs', 'TIDP Number', 'TIDP Rev'], [14, 12, 16, 16, 24, 26, 36, 7, 60, 16, 12, 36, 9], 'FF2F8A4A');
      subs.forEach(function (sb) {
        const ms = sb._m || T.matchList(sb.items, itemsNow());
        ms.forEach(function (r) {
          const row = wsb.addRow([sb.id, sb.date, sb.ref || subTypeOf(sb), subTypeOf(sb), sb.note || '', sb.file || '', r.num, r.rev, r.title, MATCH[r.match].label, r.titleDiff ? 'Yes' : '', r.item ? r.item.num : '', r.item ? r.item.rev : '']);
          row.getCell(10).fill = fillOf({ exact: XL.ok, rev: XL.info, title: XL.odd, none: XL.bad }[r.match]);
        });
      });
      finishSheet(wsb, 13);
    }

    // 9. Counts
    const wn = addSheet(wb, 'Counts', ['Group', 'Category', 'Sub-category', 'Previous', 'Latest', 'Change'], [14, 46, 24, 11, 11, 10]);
    T.counts(S.prev ? S.prev.items : [], itemsNow()).forEach(function (g) {
      const gr = wn.addRow([g.grp, 'Group total', '', S.cmp ? g.old : '', g.now, S.cmp ? g.now - g.old : '']);
      gr.eachCell(function (c) { c.font = { name: 'Arial', bold: true, size: 10 }; c.fill = fillOf(XL.group); });
      g.rows.forEach(function (r) { wn.addRow([r.grp, catLabel(r), r.sub, S.cmp ? r.old : '', r.now, S.cmp ? r.now - r.old : '']); });
    });
    wn.addRow(['TOTAL', '', '', S.cmp ? S.prev.items.length : '', itemsNow().length, S.cmp ? itemsNow().length - S.prev.items.length : '']).font = { name: 'Arial', bold: true, size: 10 };
    wn.getColumn(6).numFmt = '+0;-0;0';
    finishSheet(wn, 6);

    // 10. Your edits
    const wlg = addSheet(wb, 'Change_Log', ['When', 'Drawing Number', 'Field', 'From', 'To'], [20, 36, 20, 30, 30]);
    if (!LOG.length) wlg.addRow(['', '', 'No edits yet.']);
    LOG.forEach(function (e) { wlg.addRow([fmtWhen(e.t), e.num, e.field, e.from, e.to]); });
    finishSheet(wlg, 5);
    return wb;
  }

  function exportExcel() {
    if (!S.latest) { toast('Load the latest TIDP first'); return; }
    const p = S.latest.project || {};
    download(buildWorkbook, ['MIDP_Checker', p.number, S.latest.tab, fileStamp()].filter(Boolean).join('_') + '.xlsx', function () {
      META.exportedAt = Date.now(); META.dirty = false; saveMeta(); render();
    });
  }

  /* "Export this view": exactly the rows and columns of one table as you see it */
  function exportView(name) {
    const g = GRIDS[name];
    if (!g) return;
    if (g.list.length && g.list.every(function (r) { return r && r.key && r.v && 'num' in r; })) {   // drawing rows: exactly your columns, and it loads back
      const ticked = g.list.filter(function (r) { return S.picked && S.picked.has(r.key); });   // ticked rows win over the whole view
      const rows = ticked.length ? ticked : g.list;
      const vc = g.cols.filter(function (c) { return c.k !== 'pick' && c.k !== 'acts'; });
      if (!vc.some(function (c) { return c.k === 'num'; })) vc.unshift({ k: 'num', label: 'Drawing number', w: 250, text: function (r) { return r.num; } });   // needed to match rows back
      const yours = function (c) { return !!(EDIT_COLS[c.k] || c.user); };
      download(function () {
        const wb = new ExcelJS.Workbook(); wb.creator = 'MIDP Checker';
        const ws = addSheet(wb, g.title.slice(0, 31).replace(/[\\/?*[\]:]/g, ' '), vc.map(function (c) { return c.label; }), vc.map(function (c) { return Math.max(8, Math.round(widthOf(name, c) / 7)); }));
        rows.forEach(function (r) {
          const row = ws.addRow(vc.map(function (c) { return cellText(c, r); }));
          vc.forEach(function (c, i) { if (yours(c)) row.getCell(i + 1).fill = fillOf(XL.edit); });
        });
        const wi = vc.findIndex(function (c) { return c.k === 'wstat'; });
        if (wi >= 0 && rows.length) { const L = String.fromCharCode(65 + wi); try { ws.dataValidations.add(L + '2:' + L + (rows.length + 1), { type: 'list', allowBlank: true, formulae: ['"' + WORK_STATUS.join(',') + '"'] }); } catch (e) { /* no drop-down */ } }
        finishSheet(ws, vc.length);
        return wb;
      }, 'MIDP_Checker_' + g.title.replace(/\s+/g, '_') + (ticked.length ? '_' + ticked.length + '_selected_' : '_view_') + fileStamp() + '.xlsx');
      return;
    }
    const cols = g.cols.filter(function (c) { return c.k !== 'pick' && c.k !== 'acts'; });
    download(function () {
      const wb = new ExcelJS.Workbook();
      const ws = addSheet(wb, g.title.slice(0, 31).replace(/[\\/?*[\]:]/g, ' '), cols.map(function (c) { return c.label; }), cols.map(function (c) { return Math.max(8, Math.round(widthOf(name, c) / 7)); }));
      g.list.forEach(function (r) { ws.addRow(cols.map(function (c) { return cellText(c, r); })); });
      finishSheet(ws, cols.length);
      return wb;
    }, g.title.replace(/\s+/g, '_') + '_view_' + fileStamp() + '.xlsx');
  }

  /* Drawing list of the ticked tracker rows — ready to attach to a submission */
  function exportDrawingList() {
    const rows = S.built.rows.filter(function (r) { return S.picked.has(r.key); });
    if (!rows.length) { toast('Tick some drawings first'); return; }
    rows.sort(function (a, b) { return sortText(a.num, b.num); });
    download(function () {
      const wb = new ExcelJS.Workbook();
      const ws = addSheet(wb, 'Drawing_List', ['No.', 'Drawing Number', 'Description', 'Revision', 'Category'], [6, 38, 70, 10, 50]);
      rows.forEach(function (r, i) { ws.addRow([i + 1, r.num, r.title, r.rev, [r.grp, catText(r)].filter(Boolean).join(' › ')]); });
      finishSheet(ws, 5);
      return wb;
    }, 'Drawing_List_' + fileStamp() + '.xlsx');
  }

  /* Pre-check results with a summary per category and revision */
  function exportPre() {
    if (!S.pre) return;
    download(function () {
      const wb = new ExcelJS.Workbook(), rows = S.pre.rows, cols = preCols();
      const ws = addSheet(wb, 'Pre_Check', cols.map(function (c) { return c.label; }), [16, 38, 8, 9, 10, 60, 44, 70, 60]);
      rows.forEach(function (r) { const row = ws.addRow(cols.map(function (c) { return cellText(c, r); })); row.getCell(1).fill = fillOf(XL_PRE[r.kind]); });
      finishSheet(ws, cols.length);
      const revs = uniq(rows.map(function (r) { return r.rev || '(none)'; })).sort(sortText);
      const wsum = addSheet(wb, 'Summary', ['Category'].concat(revs).concat(['Total', 'Problems']), [50].concat(revs.map(function () { return 9; })).concat([9, 10]));
      const byCat = new Map();
      rows.forEach(function (r) { const k = r.item ? [r.item.grp, catText(r.item)].filter(Boolean).join(' › ') : 'Not in TIDP'; if (!byCat.has(k)) byCat.set(k, []); byCat.get(k).push(r); });
      byCat.forEach(function (list, k) {
        wsum.addRow([k].concat(revs.map(function (rv) { return list.filter(function (r) { return (r.rev || '(none)') === rv; }).length || ''; })).concat([list.length, list.filter(function (r) { return r.kind !== 'ok'; }).length || '']));
      });
      finishSheet(wsum, revs.length + 3);
      return wb;
    }, 'Pre_Check_' + fileStamp() + '.xlsx');
  }

  /* ---------- 12. Events ---------- */

  /* "tracker.due=overdue" -> S.ui.tracker.due = 'overdue' */
  function applySet(expr) {
    const m = /^(\w+)\.(\w+)=(.*)$/.exec(expr || '');
    if (!m) return;
    const cur = S.ui[m[1]][m[2]];
    S.ui[m[1]][m[2]] = typeof cur === 'boolean' ? m[3] === 'true' : m[3];
    resetLimit(m[1]);
  }
  function go(view) {
    S.view = view; S.ui.files.reset = false; closePop(); if (CF) closeCF();
    render(); window.scrollTo(0, 0);
  }
  // Lew's Tracker: skin + light/dark follow the shared theme (core/theme.js) when it is there
  function applyTheme() {
    if (window.LTTheme) {
      const e = LTTheme.get();
      SET.skin = e.skin === 'gb' || e.skin === 'arc' ? e.skin : (e.skin === 'pastel' || e.skin === 'rose' ? e.skin : 'gold');
      SET.mode = e.mode;
    }
    document.body.setAttribute('data-skin', SET.skin); document.body.setAttribute('data-mode', SET.mode);
    document.body.classList.toggle('soft', SET.skin !== 'gb' && SET.skin !== 'arc');
  }
  function openDetail(key) { S.detail = key; renderDetail(); const b = $('#detail'); if (b) b.scrollTop = 0; }

  /* "Find drawing" box in the header */
  function findDrawing(text) {
    const q = T.norm(text);
    if (!q || !S.latest) return;
    const rows = S.built.rows;
    const hit = rows.find(function (r) { return T.norm(r.num) === q; }) ||
      rows.find(function (r) { return T.norm(r.num).indexOf(q) >= 0; }) ||
      rows.find(function (r) { return T.norm(r.title).indexOf(q) >= 0; });
    if (!hit) { toast('No drawing matches "' + text + '"'); return; }
    openDetail(hit.key);
    $('#find').value = '';
  }

  const ACTIONS = {
    skin: function (el) { SET.skin = el.getAttribute('data-v'); if (window.LTTheme) LTTheme.set({ skin: SET.skin }); saveSettings(); applyTheme(); updateHeader(); },
    mode: function (el) { SET.mode = el.getAttribute('data-v'); if (window.LTTheme) LTTheme.set({ mode: SET.mode, auto: false }); saveSettings(); applyTheme(); updateHeader(); },
    export: exportExcel,
    exportview: function (el) { exportView(el.getAttribute('data-grid')); },
    resetview: function () { resetView(); closePop(); if (CF) closeCF(); render(); toast('View reset: filters, sorting and searches cleared'); },
    set: function (el) { applySet(el.getAttribute('data-set')); render(); },
    more: function (el) { S.ui[el.getAttribute('data-v')].limit = Infinity; render(); },
    sort: function (el) {
      const g = el.getAttribute('data-grid'), k = el.getAttribute('data-k'), s = S.sort[g];
      S.sort[g] = !s || s.k !== k ? { k: k, dir: 1 } : s.dir > 0 ? { k: k, dir: -1 } : null;
      render();
    },
    cf: function (el) {
      const g = el.getAttribute('data-grid'), k = el.getAttribute('data-k');
      if (CF && CF.name === g && CF.k === k) closeCF(); else openCF(g, k, el);
    },
    cfclose: closeCF,
    cfok: applyCF,
    cfsort: function (el) { S.sort[CF.name] = { k: CF.k, dir: +el.getAttribute('data-v') }; closeCF(); render(); },
    cfclear: function () {
      clearColFilter(CF.name, CF.k);
      if (S.sort[CF.name] && S.sort[CF.name].k === CF.k) S.sort[CF.name] = null;
      resetLimit(CF.name); closeCF(); render();
    },
    cfclearall: function (el) { S.cf[el.getAttribute('data-grid')] = {}; resetLimit(el.getAttribute('data-grid')); closeCF(); render(); },
    detail: function (el, e) { e.preventDefault(); openDetail(el.getAttribute('data-key')); },
    detailclose: function () { S.detail = ''; renderDetail(); },
    clear: function (el) { clearFile(el.getAttribute('data-v')); },
    reset: function () {
      if (!S.ui.files.reset) { S.ui.files.reset = true; render(); setTimeout(function () { if (S.ui.files.reset) { S.ui.files.reset = false; if (S.view === 'files') render(); } }, 4000); return; }
      S.ui.files.reset = false; startOver();
    },
    // tracker ticks
    pickall: function (el) {
      const shown = (GRIDS.tracker ? GRIDS.tracker.list : []).filter(function (r) { return !r.removed; });
      if (el.checked) shown.forEach(function (r) { S.picked.add(r.key); }); else S.picked.clear();
      render();
    },
    unpick: function () { S.picked.clear(); render(); },
    drawinglist: exportDrawingList,
    prepicked: function () { runPre(S.built.rows.filter(function (r) { return S.picked.has(r.key); }).map(function (r) { return r.num; }), 'Ticked in tracker'); },
    // pre-check
    prepaste: function () { preFromPaste($('#prePaste').value); },
    preclear: function () { S.pre = null; S.cf.pre = {}; render(); },
    preexport: exportPre,
    presave: function () {
      const entries = S.pre.rows.filter(function (r) { return r.num; }).map(function (r) { return { num: r.num, title: r.item ? r.item.title : '' }; });
      openSubDialog({ file: S.pre.source, sheets: [{ name: 'Pre-check', entries: entries }] });
    },
    prerev: function (el) {
      const v = el.getAttribute('data-v') === '(none)' ? '' : el.getAttribute('data-v'), f = S.cf.pre = S.cf.pre || {};
      if (f.rev && f.rev.length === 1 && f.rev[0] === v) delete f.rev; else f.rev = [v];
      render();
    },
    precat: function (el) { S.cf.pre = S.cf.pre || {}; S.cf.pre.cat = [el.getAttribute('data-v')]; S.ui.pre.filter = 'all'; render(); const t = $('.tw[data-grid="pre"]'); if (t) t.scrollIntoView({ block: 'start', behavior: 'smooth' }); },
    // categories
    heatcell: function (el) { S.ui.cats.mode = 'list'; S.ui.cats.sel = el.getAttribute('data-v'); S.cf.cats = { tower: [el.getAttribute('data-t')] }; render(); },
    // submissions
    subsel: function (el) { S.ui.subs.sel = el.getAttribute('data-v'); S.ui.subs.filter = 'all'; S.ui.subs.arm = ''; render(); },
    submove: function (el) { moveSub(S.ui.subs.sel, +el.getAttribute('data-v')); },
    subdel: function () {
      const u = S.ui.subs;
      if (u.arm !== u.sel) { u.arm = u.sel; render(); return; }
      S.store.subs = S.store.subs.filter(function (x) { return x.id !== u.sel; });
      u.arm = ''; u.sel = ''; saveStore(); compute(); render(); toast('Submission deleted');
    },
    subsave: saveSubmission,
    trackapply: trackApply,
    dlgclose: closeDialog,
    // models
    maccept: function (el) { const k = el.getAttribute('data-key'); applyModel(k, (S.sugg.get(k) || {}).model); render(); },
    mclear: function (el) { applyModel(el.getAttribute('data-key'), null); render(); },
    mpick: function (el) { S.ui.models.editing = el.getAttribute('data-key'); render(); const s = $('#mSel'); if (s) s.focus(); },
    mcancel: function () { S.ui.models.editing = ''; render(); },
    autoassign: function () { const n = S.built ? autoAssign(S.built.rows.map(function (r) { return r.key; })) : 0; compute(); render(); toast(n ? plural(n, 'model') + ' assigned from Tower + Typology' : 'Nothing new to assign — fill Tower + Typology, or check they match the model list'); },
    acceptall: function () {
      let n = 0;
      modelsShown().forEach(function (r) { const i = mInfo(r); if (i.state === 'suggested') { applyModel(r.key, i.sugg.model, true); n++; } });
      saveStore(); render(); toast(plural(n, 'suggestion') + ' accepted');
    },
    // tracker columns
    addcol: openAddColumn,
    colsave: function () {
      const err = addColumn($('#colName').value);
      if (err) { $('#colErr').textContent = err; return; }
      closeDialog(); render(); toast('Column added — type in the yellow cells');
    },
    colpick: function (el) { if (!$('#pop').hidden) closePop(); else openColumnPicker(el); },
    colall: function () { SET.hidden.tracker = []; saveSettings(); render(); openColumnPicker($('[data-act="colpick"]')); },
    colwidths: function () { SET.widths = {}; saveSettings(); closePop(); render(); toast('Column widths reset'); },
    coldel: function (el, e) {
      e.preventDefault();
      const name = el.getAttribute('data-v');
      if (S.ui.tracker.armCol !== name) { S.ui.tracker.armCol = name; openColumnPicker($('[data-act="colpick"]')); return; }
      removeColumn(name); clearColFilter('tracker', 'u:' + name); closePop(); render(); toast('Column "' + name + '" deleted');
    }
  };

  const CHANGES = {
    tab: function (el) { SET.tab = el.value; saveSettings(); run(); render(); },
    soon: function (el) { SET.soonDays = Number(el.value) || 14; saveSettings(); compute(); render(); },
    subdate: function (el) { const sb = subById(S.ui.subs.sel); if (sb && el.value) { sb.date = el.value; saveStore(); compute(); render(); } },
    subtype: function (el) { const sb = subById(S.ui.subs.sel); if (sb) { sb.type = T.txt(el.value); sb.ref = sb.type; saveStore(); render(); } },
    subnote: function (el) { const sb = subById(S.ui.subs.sel); if (sb) { sb.note = T.txt(el.value); saveStore(); } },
    massign: function (el) {
      const m = S.store.models.find(function (x) { return x.id === el.value; });
      if (!m) return;
      applyModel(el.getAttribute('data-key'), m); S.ui.models.editing = ''; render();
    },
    wstatus: function (el) { setVal(el.getAttribute('data-key'), 'Work Status', el.value); render(); },
    dfield: function (el) { setVal(S.detail, el.getAttribute('data-field'), el.value); render(); },
    find: function (el) { findDrawing(el.value); }
  };

  document.addEventListener('click', function (e) {
    if (S.justResized) { S.justResized = false; return; }
    // highlight the row you clicked, so it is easy to find again after sorting
    const tr = e.target.closest('.tw tr[data-key]');
    if (tr) {
      const g = tr.closest('.tw').getAttribute('data-grid'), k = tr.getAttribute('data-key');
      S.hl[g] = k;
      $$('.tw[data-grid="' + g + '"] tr.hl').forEach(function (x) { x.classList.remove('hl'); });
      tr.classList.add('hl');
    }
    const goEl = e.target.closest('[data-go]');
    if (goEl) {
      e.preventDefault();
      if (goEl.getAttribute('data-set')) applySet(goEl.getAttribute('data-set'));
      go(goEl.getAttribute('data-go'));
      return;
    }
    const act = e.target.closest('[data-act]');
    if (act && ACTIONS[act.getAttribute('data-act')]) {
      if (act.closest('.drop') && act.tagName === 'BUTTON') e.preventDefault();   // do not open the file picker
      if (act.tagName === 'INPUT' && act.type === 'checkbox') e.stopPropagation();
      ACTIONS[act.getAttribute('data-act')](act, e);
      return;
    }
    const pop = $('#pop');
    if (!pop.hidden && !pop.contains(e.target)) closePop();
    if (CF && !$('#cfPop').contains(e.target)) closeCF();
  });

  document.addEventListener('change', function (e) {
    const el = e.target;
    if (el.matches('input[type=file][data-kind]')) { onFiles(el.getAttribute('data-kind'), el.files); el.value = ''; return; }
    if (el.matches('[data-pick]')) {
      const k = el.getAttribute('data-pick');
      if (el.checked) S.picked.add(k); else S.picked.delete(k);
      render(); return;
    }
    if (el.matches('[data-sheet]') && dlgState) {
      const s = dlgState.sheets[+el.getAttribute('data-sheet')];
      dlgState.use = el.checked ? uniq(dlgState.use.concat([s.name])) : dlgState.use.filter(function (n) { return n !== s.name; });
      subPreview(); return;
    }
    if (el.id === 'cfAll' && CF) {
      cfShown().forEach(function (v) { if (el.checked) CF.sel.add(v); else CF.sel.delete(v); });
      cfDraw(); return;
    }
    if (el.matches('[data-cfv]') && CF) {
      const v = el.getAttribute('data-cfv');
      if (el.checked) CF.sel.add(v); else CF.sel.delete(v);
      cfDraw(); return;
    }
    if (el.matches('[data-col]')) {
      const k = el.getAttribute('data-col'), hid = hiddenCols().filter(function (x) { return x !== k; });
      if (!el.checked) { hid.push(k); clearColFilter('tracker', k); }
      SET.hidden.tracker = hid; saveSettings(); render(); return;
    }
    const ch = el.getAttribute('data-change');
    if (!ch) return;
    if (CHANGES[ch]) { CHANGES[ch](el); return; }
    // generic filters: "tracker.cat"
    const p = ch.split('.');
    if (p.length === 2 && S.ui[p[0]]) {
      S.ui[p[0]][p[1]] = el.type === 'checkbox' ? el.checked : el.value;
      resetLimit(p[0]);
      if (ch === 'checks.sameType') compute();
      render();
    }
  });

  let inputTimer = null;
  document.addEventListener('input', function (e) {
    const el = e.target, k = el.getAttribute('data-input');
    if (el.id === 'cfQ' && CF) { CF.q = el.value; cfDraw(); return; }
    if (el.id === 'prePaste') { S.ui.pre.paste = el.value; return; }
    if (!k) return;
    clearTimeout(inputTimer);
    inputTimer = setTimeout(function () {
      const p = k.split('.');
      S.ui[p[0]][p[1]] = el.value;
      resetLimit(p[0]);
      render();
    }, 180);
  });

  // Typing in yellow tracker cells
  document.addEventListener('focusin', function (e) { if (e.target.matches && e.target.matches('td.edit')) e.target._was = e.target.textContent; });
  document.addEventListener('focusout', function (e) {
    const td = e.target;
    if (!td.matches || !td.matches('td.edit')) return;
    if (td.textContent !== td._was) { setVal(td.getAttribute('data-key'), td.getAttribute('data-field'), td.textContent); td.title = td.textContent; }
  });
  document.addEventListener('keydown', function (e) {
    const el = e.target;
    if (el.matches && el.matches('td.edit')) {
      if (e.key === 'Enter') { e.preventDefault(); el.blur(); }
      else if (e.key === 'Escape') { el.textContent = el._was || ''; el.blur(); }
      return;
    }
    if (e.key === 'Enter' && !$('#dlg').hidden && el.id === 'colName') { ACTIONS.colsave(); return; }
    if (e.key === 'Enter' && el.id === 'cfQ' && CF) { e.preventDefault(); applyCF(); return; }
    if (e.key === 'Enter' && el.id === 'find') { e.preventDefault(); findDrawing(el.value); return; }
    if (e.key === 'Escape') { if (!$('#dlg').hidden) closeDialog(); closePop(); if (CF) closeCF(); if (S.detail) ACTIONS.detailclose(); }
  });

  // Drag a heading edge to resize a column (the width is remembered)
  let drag = null;
  document.addEventListener('mousedown', function (e) {
    const h = e.target.closest && e.target.closest('.rz');
    if (!h) return;
    e.preventDefault(); e.stopPropagation();
    const p = h.getAttribute('data-rz').split('|'), table = h.closest('table');
    const col = table.querySelector('col[data-k="' + CSS.escape(p[1]) + '"]');
    drag = { grid: p[0], k: p[1], x: e.clientX, w: col.getBoundingClientRect().width || parseInt(col.style.width, 10), tw: table.getBoundingClientRect().width, col: col, table: table };
    document.body.classList.add('resizing');
  });
  document.addEventListener('mousemove', function (e) {
    if (!drag) return;
    const w = Math.max(40, Math.round(drag.w + e.clientX - drag.x));
    drag.col.style.width = w + 'px';
    drag.table.style.width = (drag.tw + w - drag.w) + 'px';
    drag.now = w;
  });
  document.addEventListener('mouseup', function () {
    if (!drag) return;
    if (drag.now) {
      SET.widths[drag.grid] = SET.widths[drag.grid] || {};
      SET.widths[drag.grid][drag.k] = drag.now; saveSettings();
      S.justResized = true;
      setTimeout(function () { S.justResized = false; }, 0);
      render();   // sticky columns move with the new width
    }
    drag = null; document.body.classList.remove('resizing');
  });

  // Drag and drop onto the file boxes
  ['dragover', 'dragenter'].forEach(function (t) {
    document.addEventListener(t, function (e) { const d = e.target.closest && e.target.closest('[data-drop]'); if (d) { e.preventDefault(); d.classList.add('over'); } });
  });
  document.addEventListener('dragleave', function (e) { const d = e.target.closest && e.target.closest('[data-drop]'); if (d) d.classList.remove('over'); });
  document.addEventListener('drop', function (e) {
    const d = e.target.closest && e.target.closest('[data-drop]');
    if (!d) return;
    e.preventDefault(); d.classList.remove('over');
    onFiles(d.getAttribute('data-drop'), e.dataTransfer.files);
  });
  $('#dlg').addEventListener('click', function (e) { if (e.target.id === 'dlg') closeDialog(); });

  /* ---------- 13. Start-up ---------- */

  function restore() {
    if (typeof XLSX === 'undefined') {
      S.errors = ['The Excel reader did not load. Check your internet connection and reload the page.'];
      render(); return;
    }
    Promise.all([idbGet('latest'), idbGet('prev')]).then(function (res) {
      if (res[0] && res[0].buf) S.files.latest = { name: res[0].info.name, buf: res[0].buf, info: res[0].info };
      if (res[1] && res[1].buf) S.files.prev = { name: res[1].info.name, buf: res[1].buf, info: res[1].info };
      if (S.files.latest || S.files.prev) {
        try { S.sheetNames = S.files.latest ? sheetNamesOf(S.files.latest.buf) : []; } catch (e) { S.sheetNames = []; }
        run();
        if (S.latest) toast('Reloaded ' + S.latest.file + ' from last time');
      } else compute();
      render();
    });
  }

  // MIDP Checker: give midp-plus.js what it needs (Lookup, Lists, grouped tabs)
  window.MIDP = { S: S, VIEWS: VIEWS, ACTIONS: ACTIONS, CHANGES: CHANGES, T: T, SET: SET, render: render, go: go, openDetail: openDetail, rowByKey: rowByKey,
    mInfo: mInfo, isAssignable: isAssignable, itemsNow: itemsNow, stagesNow: stagesNow, subHead: subHead, fmtDay: fmtDay, esc: esc, tag: tag, toast: toast,
    revHtml: revHtml, dueCell: dueCell, dueStage: dueStage, readJSON: readJSON, writeJSON: writeJSON,
    grid: grid, chip: chip, numLink: numLink, catText: catText, plural: plural, openDialog: openDialog, closeDialog: closeDialog, saveStore: saveStore, compute: compute,
    setVal: setVal, applyModel: applyModel, subsByDate: subsByDate };
  if (typeof window.MIDP_PLUS === 'function') window.MIDP_PLUS(window.MIDP);
  if (typeof window.MIDP_ISSUES === 'function') window.MIDP_ISSUES(window.MIDP);
  if (typeof window.MIDP_FOLDER === 'function') window.MIDP_FOLDER(window.MIDP);
  if (typeof window.MIDP_ASSIGN === 'function') window.MIDP_ASSIGN(window.MIDP);

  // inside Lew's Tracker the look is set in Settings only
  try { if (window.parent !== window) $$('.theme-seg').forEach(function (el) { el.style.display = 'none'; }); } catch (e) {}
  applyTheme();
  if (window.LTTheme) LTTheme.onChange(function () { applyTheme(); try { updateHeader(); } catch (e) {} });
  restoreView();
  if (!META.cur.latest) S.view = 'files';
  compute();
  render();
  restore();
})();
</script>
<script>/* ⬇ Offline copy button — only inside Lew's Tracker (it makes the file: core/offline.js) */
(function () { var P; try { P = window.parent; if (P === window || !P.LTOffline) return; } catch (e) { return; }
  document.querySelectorAll('[data-offline]').forEach(function (b) { b.style.display = ''; b.addEventListener('click', function (e) { e.preventDefault(); P.LTOffline.make(b.getAttribute('data-offline')); }); }); })();
</script>
</body>
