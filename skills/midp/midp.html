<script>
/* =====================================================================
   TIDP APP — the page itself
   Sections:
     1. Settings and saved data      2. State             3. Small helpers
     4. Reading files                5. Working out results
     6. Loading files                7. Editing values
     8. Views: 8a Overview  8b Tables (compact, ▾ filters, sorting, widths)
        8c Tracker  8d Chase list  8e Categories  8f Changes  8g Submissions
        8h Models  8i Checks  8j Files  8k Drawing detail panel
     9. Pre-check (before you submit)
    10. Dialogs and pop-ups
    11. Export to Excel
    12. Events
    13. Start-up
   ===================================================================== */
(function () {
  'use strict';
  const T = window.TIDP;

  /* ---------- 1. Settings and saved data ---------- */

  const KEYS = {
    store: 'tidp-checker:tracker:v1',   // your entries, model list, submissions
    meta: 'tidp-checker:meta',          // saved / exported times, files loaded
    hist: 'tidp-checker:history',       // upload history
    log: 'tidp-checker:log',            // change log of your edits
    settings: 'tidp-checker:settings',  // look, tab, "due soon" days, hidden columns, column widths
    view: 'tidp-checker:view'           // filters, sorting and the tab you were on
  };
  // Tracker fields you fill in yourself (always there, not free columns)
  const FIXED_FIELDS = ['Tower', 'Typology', 'Model Number', 'Work Status', 'Assigned To', 'Notes', 'Submission Type', 'Submission Date'];
  const WORK_STATUS = ['WIP', 'For checking', 'Checked', 'Issued'];
  const DEFAULT_HIDDEN = ['status', 'stage'];
  const ROW_LIMIT = 300;                 // rows shown before "Show all"
  const SOON_OPTIONS = [7, 14, 30, 60];
  const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

  // Columns this page writes to the tracker export. They are not read back as your own columns.
  const SYSTEM_HEADERS = ['GROUP', 'CATEGORY', 'SUB-CATEGORY', 'DOCUMENT NUMBER', 'DRAWING NUMBER', 'DRAWING DESCRIPTION', 'TITLE',
    'SEQUENCE', 'REVISION', 'TIDP STATUS', 'STATUS', 'CHANGE', 'SOURCE ROW', 'TYPE', 'DOC TYPE', 'MODEL NAME', 'MODEL LINK', 'ACC LINK',
    'ASSIGNMENT', 'SUGGESTED MODEL', 'TIMES SUBMITTED', 'LAST SUBMITTED', 'LAST SUBMISSION REF', 'LAST SUBMISSION', 'REV SENT',
    'DUE STATE', 'LAST STAGE DUE', 'LAST DUE DATE', 'NEXT STAGE', 'NEXT DUE DATE', 'DAYS LATE'];
  const SUBHEAD_RE = / · \d{2}-[A-Za-z]{3}-\d{4}$/;   // submission columns in the tracker export
  // your own columns on screen → the field they save to (these are read back from Excel; the rest is info only)
  const EDIT_COLS = { wstat: 'Work Status', who: 'Assigned To', notes: 'Notes', Tower: 'Tower', Typology: 'Typology', model: 'Model Number' };

  function readJSON(k, d) { try { const v = JSON.parse(localStorage.getItem(k) || 'null'); return v == null ? d : v; } catch (e) { return d; } }
  function writeJSON(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }

  const prefersDark = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
  const SET = Object.assign({ skin: 'gb', mode: prefersDark ? 'dark' : 'light', soonDays: 14, tab: 'INT', hidden: {}, widths: {} }, readJSON(KEYS.settings, {}));
  SET.widths = SET.widths || {};
  const META = readJSON(KEYS.meta, {}); META.cur = META.cur || {};
  let HIST = readJSON(KEYS.hist, []), LOG = readJSON(KEYS.log, []);

  function saveSettings() { writeJSON(KEYS.settings, SET); }
  function saveMeta() { writeJSON(KEYS.meta, META); }

  function emptyStore() { return { cols: [], rows: {}, models: [], modelsFile: '', subs: [] }; }
  function loadStore() {
    const s = readJSON(KEYS.store, null);
    if (s && s.rows && s.cols) { s.models = s.models || []; s.modelsFile = s.modelsFile || ''; s.subs = s.subs || []; return normStore(s); }
    return emptyStore();
  }
  /* Fixed fields (Tower, Work Status, Notes…) are never free columns */
  function normStore(st) {
    const fixU = FIXED_FIELDS.map(function (f) { return f.toUpperCase(); }), moved = {};
    st.cols = st.cols.filter(function (c) {
      const i = fixU.indexOf(T.norm(c));
      if (i >= 0) { moved[c] = FIXED_FIELDS[i]; return false; }
      return true;
    });
    Object.keys(st.rows).forEach(function (k) {
      const v = st.rows[k].v || {};
      Object.keys(moved).forEach(function (c) {
        if (c !== moved[c] && v[c] != null) { if (!T.txt(v[moved[c]])) v[moved[c]] = v[c]; delete v[c]; }
      });
    });
    return st;
  }
  /* quiet = an automatic change (not yours), so it does not ask for a backup */
  function saveStore(quiet) {
    if (!writeJSON(KEYS.store, S.store)) toast('Could not save in this browser (storage full?). Export to Excel to keep your work.');
    if (!quiet) { META.savedAt = Date.now(); META.dirty = true; saveMeta(); }
    updateHeader();
  }
  function addHistory(kind, info, count) {
    const e = { kind: kind, name: info.name, size: info.size, modified: info.modified, loadedAt: Date.now(), items: count, tab: (kind === 'latest' || kind === 'prev') ? SET.tab : '' };
    HIST.unshift(e); if (HIST.length > 200) HIST.length = 200; writeJSON(KEYS.hist, HIST);
    META.cur[kind] = e; saveMeta();
  }
  let logTimer = null;
  function addLog(num, field, from, to) {
    from = T.txt(from); to = T.txt(to);
    if (from === to) return;
    LOG.unshift({ t: Date.now(), num: num, field: field, from: from, to: to });
    if (LOG.length > 5000) LOG.length = 5000;
    clearTimeout(logTimer); logTimer = setTimeout(function () { writeJSON(KEYS.log, LOG); }, 300);
  }

  /* The TIDP files themselves are kept in the browser (IndexedDB) so they reload next time.
     Lew's Tracker: one store per project, so switching project switches the files too. */
  function idbName() {
    try {
      const pj = JSON.parse(localStorage.getItem('lt_projects_v1') || 'null');
      if (pj && pj.list && pj.list.length && pj.list[0].id !== pj.active) return 'tidp-checker:' + pj.active;
    } catch (e) { /* no project list: single store */ }
    return 'tidp-checker';
  }
  function idb() {
    return new Promise(function (res) {
      try {
        const r = indexedDB.open(idbName(), 1);
        r.onupgradeneeded = function () { r.result.createObjectStore('files'); };
        r.onsuccess = function () { res(r.result); };
        r.onerror = function () { res(null); };
      } catch (e) { res(null); }
    });
  }
  function idbOp(mode, fn) {
    return idb().then(function (db) {
      if (!db) return null;
      return new Promise(function (res) {
        try {
          const tx = db.transaction('files', mode), q = fn(tx.objectStore('files'));
          tx.oncomplete = function () { res(q ? q.result : null); };
          tx.onerror = tx.onabort = function () { res(null); };
        } catch (e) { res(null); }
      });
    });
  }
  const idbPut = function (k, rec) { return idbOp('readwrite', function (st) { return st.put(rec, k); }); };
  const idbGet = function (k) { return idbOp('readonly', function (st) { return st.get(k); }); };
  const idbDel = function (k) { return idbOp('readwrite', function (st) { return st.delete(k); }); };

  /* ---------- 2. State ---------- */

  /* What each tab is showing (filters, search). Saved, so it is still there next time. */
  function defaultUi() {
    return {
      tracker: { q: '', cat: '', due: '', change: '', sent: '', who: '', removed: true, limit: ROW_LIMIT },
      chase: { filter: 'overdue', q: '', stage: '', sort: 'recent', limit: ROW_LIMIT },
      changes: { filter: 'all', q: '' },
      subs: { sel: '', filter: 'all' },
      models: { mode: 'drawings', filter: 'all', q: '', tower: '', cat: '', unused: false, editing: '', limit: ROW_LIMIT },
      checks: { kind: '', q: '', sameType: false },
      cats: { mode: 'list', sel: '', q: '' },
      pre: { filter: 'all', paste: '' },
      files: { reset: false }
    };
  }

  const S = {
    store: loadStore(),
    files: { latest: null, prev: null },     // { name, buf, info }
    sheetNames: [],
    latest: null, prev: null,                // parsed TIDPs
    otherTabs: null,                         // number -> tab name, for the rest of the MIDP (read when needed)
    cmp: null, built: null, checks: [], progress: [],
    due: new Map(), subByKey: new Map(), sugg: new Map(), mix: null,
    today: T.todayIso(),
    errors: [], warns: [],
    view: 'lookup',
    ui: defaultUi(),
    cf: {},              // ▾ column filters: { table: { column: [values kept] } }
    sort: {},            // sorting: { table: { k, dir } }
    picked: new Set(),   // ticked tracker rows
    hl: {},              // highlighted row per table
    detail: '',          // drawing shown in the side panel
    pre: null            // pre-check: { source, names, rows }
  };

  /* Brings back the filters, sorting and tab from last time */
  function restoreView() {
    const v = readJSON(KEYS.view, null);
    if (!v) return;
    const d = defaultUi();
    Object.keys(d).forEach(function (k) { S.ui[k] = Object.assign(d[k], (v.ui || {})[k] || {}); });
    Object.keys(S.ui).forEach(function (k) { if ('limit' in S.ui[k]) S.ui[k].limit = ROW_LIMIT; });
    S.ui.models.editing = ''; S.ui.files.reset = false;
    S.cf = v.cf || {}; S.sort = v.sort || {};
    if (v.view) S.view = v.view;
  }
  let viewTimer = null;
  function saveView() {
    clearTimeout(viewTimer);
    viewTimer = setTimeout(function () { writeJSON(KEYS.view, { view: S.view, ui: S.ui, cf: S.cf, sort: S.sort }); }, 250);
  }
  function resetView() {
    S.ui = defaultUi(); S.cf = {}; S.sort = {}; S.hl = {}; S.picked = new Set();
    SET.hidden.tracker = DEFAULT_HIDDEN.slice(); saveSettings();
  }

  /* ---------- 3. Small helpers ---------- */

  const $ = function (s, r) { return (r || document).querySelector(s); };
  const $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; });
  }
  let toastTimer = null;
  function toast(m) {
    const t = $('#toast'); t.textContent = m; t.classList.add('on');
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove('on'); }, 3000);
  }
  function busy(msg) { $('#busy').hidden = !msg; if (msg) $('#busyTxt').textContent = msg; }
  function fmtDay(iso, long) {
    const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || '');
    return m ? m[3] + '-' + MON[+m[2] - 1] + '-' + (long ? m[1] : m[1].slice(2)) : (iso || '');
  }
  function fmtWhen(t) {
    if (!t) return '—';
    const d = new Date(t);
    return fmtDay(T.todayIso(d), true) + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }
  function fmtSize(b) { return b == null ? '—' : b > 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB'; }
  function plural(n, w) { return n + ' ' + w + (n === 1 ? '' : 's'); }
  function tag(label, cls, fill, title) {
    return '<span class="tag ' + cls + (fill ? ' fill' : '') + '"' + (title ? ' title="' + esc(title) + '"' : '') + '>' + esc(label) + '</span>';
  }
  function blocks(p, cls) {
    let on = Math.round(p / 10);
    if (p > 0 && on === 0) on = 1;
    let h = '<div class="blocks ' + (cls || '') + '" role="img" aria-label="' + Math.round(p) + '%">';
    for (let i = 0; i < 10; i++) h += '<i' + (i < on ? ' class="on"' : '') + '></i>';
    return h + '</div>';
  }
  function pct(a, b) { return b ? Math.round(a / b * 100) : 0; }
  /* Category as one line: "DRAWINGS › Hotel FOH › Guestrooms" */
  function catText(r) { return [r.cat, r.sub].filter(Boolean).join(' › '); }
  function catCell(r) { return (r.grp ? '<b>' + esc(r.grp) + '</b> ' : '') + esc(catText(r) || (r.grp ? '(no heading)' : '')); }
  function options(list, sel, blank) {
    return (blank != null ? '<option value="">' + esc(blank) + '</option>' : '') +
      list.map(function (o) {
        const v = Array.isArray(o) ? o[0] : o, l = Array.isArray(o) ? o[1] : o;
        return '<option value="' + esc(v) + '"' + (String(v) === String(sel) ? ' selected' : '') + '>' + esc(l) + '</option>';
      }).join('');
  }
  function sortText(a, b) { return String(a).localeCompare(String(b), undefined, { numeric: true, sensitivity: 'base' }); }
  function uniq(list) { return list.filter(function (x, i) { return x && list.indexOf(x) === i; }); }

  /* Labels and colours used in several places */
  const CHANGE_CLS = { 'Added': 'c-ok', 'Revised': 'c-info', 'Edited': 'c-warn', 'Duplicate': 'c-odd', 'Removed from TIDP': 'c-bad', 'Removed': 'c-bad' };
  const DUE = {
    overdue: { label: 'Late', cls: 'c-bad' },
    soon: { label: 'Due soon', cls: 'c-warn' },
    ok: { label: 'On track', cls: 'c-ok' },
    none: { label: 'No date', cls: 'c-mute' }
  };
  const MATCH = {
    exact: { label: 'Matches TIDP', cls: 'c-ok' },
    rev: { label: 'Match · other rev', cls: 'c-info' },
    title: { label: 'Title only', cls: 'c-odd' },
    none: { label: 'Not in TIDP', cls: 'c-bad' }
  };
  const PRE_CLS = { ok: 'c-ok', name: 'c-warn', rev: 'c-info', dup: 'c-odd', notfound: 'c-bad', notnum: 'c-bad' };
  function changeTag(s) { return s ? tag(s === 'Removed from TIDP' ? 'Removed' : s, CHANGE_CLS[s] || 'c-mute') : '<span class="muted">—</span>'; }
  function dueCell(d) {
    if (!d || d.state === 'none') return '<span class="muted">—</span>';
    if (d.state === 'overdue') return tag('Late ' + d.lateDays + 'd', 'c-bad', true, d.last.stage + ' was due ' + fmtDay(d.last.iso, true)) + ' <span class="mono">' + fmtDay(d.last.iso) + '</span>';
    if (d.state === 'soon') return tag(d.daysTo === 0 ? 'Today' : 'In ' + d.daysTo + 'd', 'c-warn', true, d.next.stage) + ' <span class="mono">' + fmtDay(d.next.iso) + '</span>';
    return d.next ? '<span class="mono">' + fmtDay(d.next.iso) + '</span>' : tag('Done', 'c-ok');
  }
  function dueStage(d) { return !d ? '' : d.state === 'overdue' ? d.last.stage : d.next ? d.next.stage : d.last ? d.last.stage : ''; }
  function dueDate(d) { return !d ? '' : d.state === 'overdue' ? d.last.iso : d.next ? d.next.iso : d.last ? d.last.iso : ''; }
  function revHtml(r) { return r.rev ? '<span class="rev">' + esc(r.rev) + '</span>' : ''; }
  /* Drawing number that opens the side panel */
  function numLink(num, key) {
    return key && S.built && rowByKey(key) ? '<a href="#" class="num-link" data-act="detail" data-key="' + esc(key) + '">' + esc(num || '(no number)') + '</a>' : esc(num || '(no number)');
  }

  /* ---------- 4. Reading files ---------- */

  function readBuf(f) {
    return new Promise(function (res, rej) {
      const r = new FileReader();
      r.onload = function () { res(new Uint8Array(r.result)); };
      r.onerror = function () { rej(new Error('Could not read ' + f.name)); };
      r.readAsArrayBuffer(f);
    });
  }
  function sheetNamesOf(buf) { return XLSX.read(buf, { type: 'array', bookSheets: true }).SheetNames; }
  function pickTab(names, want) {
    const w = T.norm(want || 'INT');
    return names.find(function (n) { return T.norm(n) === w; }) || names[0];
  }

  /* Reads the chosen tab of a TIDP / MIDP workbook */
  function readTidpFile(file, wantTab, strict) {
    const names = sheetNamesOf(file.buf), tab = pickTab(names, wantTab);
    if (strict && T.norm(tab) !== T.norm(wantTab)) throw new Error('The previous TIDP has no "' + wantTab + '" tab. Its tabs are: ' + names.join(', ') + '.');
    const wb = XLSX.read(file.buf, { type: 'array', sheets: [tab], cellFormula: true });
    const g = T.sheetToGrid(XLSX, wb.Sheets[tab], 60);
    const p = T.parseTidp(g.rows, g.firstRow);
    if (!p.items.length) throw new Error('No document numbers found on tab "' + tab + '" of ' + file.name + '. Check that column A holds the document numbers.');
    if (g.rebuilt > 20) S.warns.push(file.name + ' was not last saved in Excel, so some document numbers were rebuilt from formulas. Open it in Excel, save, and load it again to be sure.');
    p.tab = tab; p.names = names; p.file = file.name;
    return p;
  }

  /* Every document number in the other tabs of the latest MIDP (for the pre-check) */
  function readOtherTabs() {
    if (S.otherTabs || !S.files.latest) return S.otherTabs;
    const map = new Map();
    const wb = XLSX.read(S.files.latest.buf, { type: 'array', cellFormula: true });
    wb.SheetNames.forEach(function (n) {
      if (S.latest && n === S.latest.tab) return;
      try {
        T.parseTidp(T.sheetToGrid(XLSX, wb.Sheets[n], 40).rows).items.forEach(function (it) {
          if (!it.num) return;
          if (!map.has(it.key)) map.set(it.key, n);
          if (it.base && !map.has(it.base)) map.set(it.base, n);
        });
      } catch (e) { /* a tab that is not a TIDP */ }
    });
    S.otherTabs = map;
    return map;
  }

  /* Rows as shown in Excel (formatted text) + hyperlinks per row */
  function readRowsText(ws) {
    const rows = [], links = {};
    if (!ws || !ws['!ref']) return { rows: rows, links: links };
    const R = XLSX.utils.decode_range(ws['!ref']), lastCol = Math.min(R.e.c, R.s.c + 80);
    for (let r = R.s.r; r <= R.e.r; r++) {
      const row = [];
      for (let c = R.s.c; c <= lastCol; c++) {
        const cell = ws[XLSX.utils.encode_cell({ r: r, c: c })];
        let v = '';
        if (cell) {
          v = (cell.w != null && cell.w !== '') ? cell.w : (cell.v != null ? cell.v : '');
          if (cell.l && cell.l.Target && /^https?:/i.test(cell.l.Target) && links[r - R.s.r] == null) links[r - R.s.r] = cell.l.Target;
        }
        row.push(v);
      }
      rows.push(row);
    }
    return { rows: rows, links: links };
  }

  function readModelsFile(buf) {
    const wb = XLSX.read(buf, { type: 'array' });
    const pref = wb.SheetNames.filter(function (n) { return /MODEL/i.test(n); });
    const names = pref.concat(wb.SheetNames.filter(function (n) { return pref.indexOf(n) < 0; }));
    for (const n of names) {
      const d = readRowsText(wb.Sheets[n]), p = T.parseModelList(d.rows, d.links);
      if (p.models.length) return { models: p.models, sheet: n };
    }
    throw new Error('No models found. The model list needs a "Model number" column (plus Tower, Typology and path if you have them).');
  }

  /* Every sheet that holds drawing numbers, for the submission dialog */
  function readListFile(buf, name) {
    const wb = XLSX.read(buf, { type: 'array' });
    const sheets = wb.SheetNames.map(function (n) { return { name: n, entries: T.parseList(readRowsText(wb.Sheets[n]).rows) }; })
      .filter(function (s) { return s.entries.length; });
    if (!sheets.length) throw new Error('No drawing numbers found in ' + name + '.');
    return sheets;
  }

  /* A tracker you exported from this page before: brings back your own columns, models and submissions */
  function readTrackerFile(buf) {
    const wb = XLSX.read(buf, { type: 'array' });
    const findSheet = function (want) { return wb.SheetNames.find(function (n) { return n.replace(/[\s_]/g, '').toUpperCase() === want; }); };
    const name = findSheet('DRAWINGTRACKER') || wb.SheetNames[0];
    const rows = readRowsText(wb.Sheets[name]).rows;
    const h = rows.slice(0, 30).findIndex(function (r) { return r.some(function (c) { const u = T.norm(c); return u === 'DOCUMENT NUMBER' || u === 'DRAWING NUMBER'; }); });
    if (h < 0) throw new Error('Could not find a "Drawing Number" column in ' + name + '. Use a tracker exported from this page.');
    const head = rows[h].map(T.txt), idx = {}, cols = [];
    head.forEach(function (c, k) {
      const u = c.toUpperCase();
      if (!c || SUBHEAD_RE.test(c)) return;
      if (SYSTEM_HEADERS.indexOf(u) >= 0) { if (idx[u] == null) idx[u] = k; }
      else cols.push({ name: c, k: k });
    });
    const col = function (a, b) { return idx[a] != null ? idx[a] : idx[b]; };
    const store = emptyStore(), every = [];
    store.cols = cols.map(function (c) { return c.name; });
    let n = 0;
    for (let i = h + 1; i < rows.length; i++) {
      const r = rows[i], num = T.txt(r[col('DRAWING NUMBER', 'DOCUMENT NUMBER')]), title = T.txt(r[col('DRAWING DESCRIPTION', 'TITLE')]);
      if (!num && !title) continue;
      const v = {}, all = {};
      cols.forEach(function (c) { const val = T.txt(r[c.k]); all[c.name] = val; if (val) v[c.name] = val; });
      every.push({ key: T.keyOf(num, title), num: num, title: title, all: all });
      if (!T.hasValues(v)) continue;
      store.rows[T.keyOf(num, title)] = { num: num, title: title, grp: T.txt(r[idx.GROUP]), cat: T.txt(r[idx.CATEGORY]), sub: T.txt(r[idx['SUB-CATEGORY']]), v: v };
      n++;
    }
    const lib = findSheet('MODELLIBRARY');
    if (lib) { const d = readRowsText(wb.Sheets[lib]); store.models = T.parseModelList(d.rows, d.links).models; store.modelsFile = 'from tracker file'; }
    const sb = findSheet('SUBMISSIONS');
    if (sb) {
      const sr = readRowsText(wb.Sheets[sb]).rows;
      const hi = sr.findIndex(function (r) { return r.some(function (c) { return T.norm(c) === 'SUBMISSION ID'; }); });
      if (hi >= 0) {
        const H = sr[hi].map(T.norm), ix = function (x) { return H.indexOf(x); }, map = {};
        for (let q = hi + 1; q < sr.length; q++) {
          const rr = sr[q], id = T.txt(rr[ix('SUBMISSION ID')]);
          if (!id) continue;
          if (!map[id]) {
            const d = T.readDate(rr[ix('DATE')]);
            const type = ix('TYPE') >= 0 ? T.txt(rr[ix('TYPE')]) : '';
            const ref = T.txt(rr[ix(ix('DESCRIPTION') >= 0 ? 'DESCRIPTION' : 'REFERENCE')]);
            map[id] = { id: id, date: d && d.iso ? d.iso : T.txt(rr[ix('DATE')]), type: type || ref, ref: ref, note: ix('NOTE') >= 0 ? T.txt(rr[ix('NOTE')]) : '', file: T.txt(rr[ix('FILE')]), added: store.subs.length + 1, seq: store.subs.length + 1, items: [] };   // the sheet lists them in your order
            store.subs.push(map[id]);
          }
          map[id].items.push({ num: T.txt(rr[ix('DRAWING NUMBER (AS SUBMITTED)')]), title: T.txt(rr[ix('DESCRIPTION (AS SUBMITTED)')]) });
        }
      }
    }
    return { store: normStore(store), n: n, sheet: name, every: every, heads: cols.map(function (c) { return c.name; }) };
  }

  /* Loading an exported tracker back: only the drawings and columns in the file change. You see every change first. */
  function trackPreview(t, info, fileName) {
    const FIELD = {}, infoCols = new Set(SYSTEM_HEADERS);
    ['Tower', 'Typology', 'Model Number', 'Work Status', 'Assigned To', 'Notes'].forEach(function (f) { FIELD[f.toUpperCase()] = f; });
    S.store.cols.forEach(function (c) { FIELD[c.toUpperCase()] = c; });
    trCols().forEach(function (c) { if (c.k === 'pick') return; const U = T.txt(c.label).toUpperCase(); if (EDIT_COLS[c.k]) FIELD[U] = EDIT_COLS[c.k]; else if (!c.user) infoCols.add(U); });
    const fieldOf = {}, skipped = [], newCols = [];
    t.heads.filter(function (h) { return h; }).forEach(function (h) {
      const U = h.toUpperCase();
      if (FIELD[U]) fieldOf[h] = FIELD[U];
      else if (infoCols.has(U) || SUBHEAD_RE.test(h)) skipped.push(h);
      else { fieldOf[h] = h; newCols.push(h); }          // a column you added in Excel
    });
    const heads = Object.keys(fieldOf);
    const changes = [], notHere = [];
    t.every.forEach(function (fr) {
      const row = rowByKey(fr.key);
      if (!row) { if (Object.keys(fr.all).some(function (k) { return fr.all[k]; })) notHere.push(fr); return; }
      heads.forEach(function (h) {
        const f = fieldOf[h], now = T.txt(row.v[f]), next = T.txt(fr.all[h]);
        if (now !== next) changes.push({ key: fr.key, num: row.num, field: f, from: now, to: next });
      });
    });
    const cleared = changes.filter(function (c) { return !c.to; }).length;
    dlgState = { kind: 'track', t: t, info: info, changes: changes, notHere: notHere, newCols: newCols, fieldOf: fieldOf };
    const shown = changes.slice(0, 60);
    openDialog('<h2 id="dlgH">Load your edits from Excel</h2>' +
      '<p class="hint" style="margin-top:0"><b>' + esc(fileName) + '</b> — ' + plural(t.every.length, 'drawing') + ' in the file. Only these drawings and your columns change: <b>' + esc(heads.map(function (h) { return fieldOf[h]; }).join(', ') || '—') + '</b>.' +
        (skipped.length ? ' <span class="hint">Info columns are not read back: ' + esc(skipped.join(', ')) + '.</span>' : '') + '</p>' +
      (changes.length ? '<p><b>' + plural(changes.length, 'change') + '</b> on ' + plural(new Set(changes.map(function (c) { return c.key; })).size, 'drawing') + (cleared ? ' · ' + cleared + ' emptied' : '') + '</p>' +
        '<div class="tw" style="max-height:300px;overflow:auto"><table class="t"><tr><th>Drawing</th><th>Column</th><th>Now</th><th>From the file</th></tr>' +
        shown.map(function (c) { return '<tr><td class="mono">' + esc(c.num) + '</td><td>' + esc(c.field) + '</td><td>' + esc(c.from || '—') + '</td><td><b>' + esc(c.to || '(empty)') + '</b></td></tr>'; }).join('') + '</table></div>' +
        (changes.length > shown.length ? '<p class="hint">…and ' + (changes.length - shown.length) + ' more.</p>' : '') +
        (cleared ? '<label class="chk" style="display:flex;gap:6px;align-items:center;margin-top:8px"><input type="checkbox" id="trKeepEmpty"> Keep my values where the file cell is empty (don\'t empty them)</label>' : '')
        : '<p><b>No changes</b> — the file matches what you have.</p>') +
      (newCols.length ? '<p class="hint">New columns from the file: <b>' + esc(newCols.join(', ')) + '</b> — they will be added.</p>' : '') +
      (notHere.length ? '<p class="hint">' + plural(notHere.length, 'drawing') + ' in the file are not in the loaded MIDP — their entries are kept for when they come back.</p>' : '') +
      '<div class="acts"><button class="btn" type="button" data-act="dlgclose">Cancel</button>' + (changes.length || newCols.length || notHere.length ? '<button class="btn primary" type="button" data-act="trackapply">Apply</button>' : '') + '</div>');
  }
  function trackApply() {
    const d = dlgState; if (!d || d.kind !== 'track') return;
    const keepEmpty = !!($('#trKeepEmpty') && $('#trKeepEmpty').checked);
    d.newCols.forEach(function (c) { S.store.cols.push(c); });
    let n = 0;
    d.changes.forEach(function (c) { if (keepEmpty && !c.to) return; setVal(c.key, c.field, c.to, true); n++; });
    d.notHere.forEach(function (fr) {      // drawings not in this MIDP: keep their entries
      const v = {}; Object.keys(fr.all).forEach(function (k) { if (fr.all[k] && d.fieldOf[k]) v[d.fieldOf[k]] = fr.all[k]; });
      const cur = S.store.rows[fr.key];
      S.store.rows[fr.key] = cur ? Object.assign(cur, { v: Object.assign(cur.v || {}, v) }) : { num: fr.num, title: fr.title, grp: '', cat: '', sub: '', v: v };
    });
    if (!S.store.models.length && d.t.store.models.length) { S.store.models = d.t.store.models; S.store.modelsFile = d.t.store.modelsFile; }
    if (!(S.store.subs || []).length && d.t.store.subs.length) S.store.subs = d.t.store.subs;
    saveStore(true); addHistory('track', d.info, n);
    const auto = autoAssign(d.t.every.map(function (fr) { return fr.key; }));
    closeDialog(); compute(); render();
    toast(plural(n, 'change') + ' loaded from Excel' + (auto ? ' · ' + plural(auto, 'model') + ' assigned from Tower + Typology' : ''));
  }

  /* ---------- 5. Working out results ---------- */

  /* Submissions in YOUR order (first → last). Until you move one, that is simply by date.
     Every tab, the tracker columns, "last submitted" and the Excel export use this order. */
  function subsByDate() {
    const byDate = function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : (a.added || 0) - (b.added || 0); };
    return (S.store.subs || []).slice().sort(function (a, b) {
      if (a.seq != null && b.seq != null) return a.seq - b.seq;
      if (a.seq != null || b.seq != null) return a.seq != null ? -1 : 1;
      return byDate(a, b);
    });
  }
  function renumberSubs(list) { list.forEach(function (sb, i) { sb.seq = i + 1; }); }
  function moveSub(id, dir) {
    const list = subsByDate(), i = list.findIndex(function (x) { return x.id === id; }), j = i + dir;
    if (i < 0 || j < 0 || j >= list.length) return;
    const t = list[i]; list[i] = list[j]; list[j] = t;
    renumberSubs(list); saveStore(); compute(); render();
  }
  function subById(id) { return (S.store.subs || []).find(function (x) { return x.id === id; }); }
  function subTypeOf(sb) { return T.txt(sb.type) || T.txt(sb.ref) || 'Submission'; }
  function subHead(sb) { return subTypeOf(sb) + ' · ' + fmtDay(sb.date, true); }
  function subDatesOf(it) { return (S.subByKey.get(it.key) || []).map(function (x) { return x.sub.date; }).filter(Boolean); }
  function stagesNow() { return S.latest ? S.latest.stages : []; }
  function itemsNow() { return S.latest ? S.latest.items : []; }

  /* Reads the TIDP files again (after a new file or a new tab) */
  function run() {
    S.errors = []; S.warns = [];
    S.latest = null; S.prev = null; S.otherTabs = null;
    if (S.files.latest) {
      try { S.latest = readTidpFile(S.files.latest, SET.tab, false); S.sheetNames = S.latest.names; SET.tab = S.latest.tab; saveSettings(); }
      catch (e) { S.errors.push(e.message || String(e)); }
    }
    if (S.files.prev) {
      try { S.prev = readTidpFile(S.files.prev, SET.tab, true); }
      catch (e) { S.errors.push(e.message || String(e)); }
    }
    compute();
  }

  /* Works out everything shown on screen from the loaded files and your saved entries */
  function compute() {
    const items = itemsNow(), stages = stagesNow();
    if (window.MIDP_FIX) window.MIDP_FIX(items);          // your typo corrections (midp-issues.js)
    S.today = T.todayIso();
    S.cmp = S.latest && S.prev ? T.compare(S.prev.items, items, S.prev.stages, stages) : null;

    // Tracker rows: the TIDP joined with your entries
    const b = T.buildTracker(items, S.store, S.cmp);
    b.moves.forEach(function (m) { const r = S.store.rows[m[0]]; delete S.store.rows[m[0]]; S.store.rows[m[1]] = r; });
    const byKey = {};
    items.forEach(function (it) { byKey[it.key] = it; });
    Object.keys(S.store.rows).forEach(function (k) {
      const it = byKey[k], r = S.store.rows[k];
      if (it) { r.num = it.num; r.title = it.title; r.grp = it.grp; r.cat = it.cat; r.sub = it.sub; }
    });
    if (b.moves.length) saveStore(true);
    S.built = b;
    S.rowIndex = new Map();
    b.rows.concat(b.removed).forEach(function (r) { if (!S.rowIndex.has(r.key)) S.rowIndex.set(r.key, r); });

    // Submissions matched to the TIDP (newest first)
    S.subByKey = new Map();
    subsByDate().reverse().forEach(function (sb) {
      sb._m = T.matchList(sb.items, items);
      sb._m.forEach(function (r) {
        if (!r.item) return;
        if (!S.subByKey.has(r.item.key)) S.subByKey.set(r.item.key, []);
        S.subByKey.get(r.item.key).push({ sub: sb, r: r });
      });
    });

    // Models, due dates, checks, stage progress
    S.mix = S.store.models.length ? T.modelIndex(S.store.models) : null;
    S.sugg = new Map(); S.due = new Map();
    b.rows.forEach(function (r) {
      S.sugg.set(r.key, T.suggestModel(r, S.mix));
      S.due.set(r.key, T.dueInfo(r, stages, subDatesOf(r), S.today, SET.soonDays));
    });
    S.checks = S.latest ? T.runChecks(items, stages, { sameType: S.ui.checks.sameType, oddRows: S.latest.oddRows }) : [];
    S.progress = S.latest ? T.stageProgress(items, stages, subDatesOf, S.today) : [];
    if (S.pre) S.pre.rows = T.precheck(S.pre.names, items, S.otherTabs);
    if (window.MIDP_EXT && MIDP_EXT.afterCompute) MIDP_EXT.afterCompute();
  }

  function changeRows() {
    const c = S.cmp;
    if (!c) return [];
    const out = [];
    c.added.forEach(function (it) { out.push({ type: 'Added', item: it, changes: [], note: 'New in the latest TIDP' }); });
    c.removed.forEach(function (it) { out.push({ type: 'Removed', item: it, changes: [], note: 'No longer in the TIDP' }); });
    c.revised.forEach(function (r) { out.push({ type: 'Revised', item: r.item, old: r.old, changes: r.changes, note: 'Was ' + r.old.num }); });
    c.edited.forEach(function (r) { out.push({ type: 'Edited', item: r.item, old: r.old, changes: r.changes }); });
    c.duplicates.forEach(function (d) { out.push({ type: 'Duplicate', item: d.items[0], changes: [], note: 'Listed ' + d.count + ' times in the latest TIDP' }); });
    return out;
  }

  /* Re-issue: the newest submission of a drawing was an older revision than the TIDP now shows */
  function needsReissue(r) {
    const sl = S.subByKey.get(r.key) || [];
    return !!(sl.length && sl[0].r.match === 'rev' && sl[0].r.revCmp < 0);
  }

  /* Model state of one tracker row */
  function isAssignable(r) { return T.norm(r.grp) !== 'MODELS' && !r.removed; }
  /* Your Tower + Typology point to exactly one model in the model list → assign it (never overwrites a model you set) */
  function autoAssign(keys) {
    if (!S.mix) return 0;
    let n = 0;
    keys.forEach(function (k) {
      const r = rowByKey(k);
      if (!r || !isAssignable(r) || T.txt(r.v['Model Number']) || !T.txt(r.v.Typology)) return;
      const all = T.matchByTyp(S.mix, r.v.Typology, r.v.Tower), main = all.filter(function (m) { return !m.variant; });
      const pick = main.length === 1 ? main[0] : all.length === 1 ? all[0] : null;
      if (pick) { setVal(k, 'Model Number', pick.num, true); n++; }
    });
    if (n) saveStore();
    return n;
  }
  function mInfo(r) {
    const num = T.txt(r.v['Model Number']), sg = S.sugg.get(r.key) || {};
    return { num: num, model: num ? T.findModel(S.mix, num) : null, sugg: sg, state: num ? 'assigned' : sg.model ? 'suggested' : 'open', conflict: !!sg.conflict };
  }
  function modelStats() {
    const st = { total: 0, assigned: 0, suggested: 0, open: 0, conflict: 0 };
    if (!S.built) return st;
    S.built.rows.forEach(function (r) {
      if (!isAssignable(r)) return;
      const i = mInfo(r);
      st.total++; st[i.state]++;
      if (i.conflict) st.conflict++;
    });
    return st;
  }

  /* ---------- 6. Loading files ---------- */

  function isExcel(f) { return /\.(xlsx|xlsm|xls|xlsb|csv)$/i.test(f.name); }

  function onFiles(kind, list) {
    const files = Array.prototype.slice.call(list || []);
    if (!files.length) return;
    if (kind === 'pre') { preFromFiles(files); return; }
    if (typeof XLSX === 'undefined') { S.errors = ['The Excel reader did not load. Check your internet connection and reload the page.']; render(); return; }
    const f = files[0];

    // A submission can also be the drawing files themselves (PDFs): their names are the list
    if (kind === 'lod' && !files.some(isExcel)) {
      const entries = uniq(files.map(function (x) { return T.cleanFileName(x.name); })).filter(T.isDocNumber).map(function (n) { return { num: n, title: '' }; });
      if (!entries.length) { toast('No drawing numbers found in those file names'); return; }
      openSubDialog({ file: files.length === 1 ? f.name : files.length + ' files', sheets: [{ name: 'File names', entries: entries }] });
      return;
    }
    if (!isExcel(f)) { toast(f.name + ' is not an Excel file'); return; }

    const info = { name: f.name, size: f.size, modified: f.lastModified };
    busy('Reading ' + f.name);
    readBuf(f).then(function (buf) {
      setTimeout(function () {
        try { loadKind(kind, f, buf, info); }
        catch (e) { S.errors = [e.message || String(e)]; render(); }
        busy('');
      }, 30);
    }).catch(function (e) { busy(''); S.errors = [e.message]; render(); });
  }

  function loadKind(kind, f, buf, info) {
    if (kind === 'latest' || kind === 'prev') {
      S.files[kind] = { name: f.name, buf: buf, info: info };
      if (kind === 'latest') { S.sheetNames = sheetNamesOf(buf); SET.tab = pickTab(S.sheetNames, SET.tab); }
      run();
      const p = kind === 'latest' ? S.latest : S.prev;
      if (p) {
        addHistory(kind, info, p.items.length);
        idbPut(kind, { info: info, buf: buf });
        toast((kind === 'latest' ? 'Latest' : 'Previous') + ' TIDP loaded: ' + p.items.length + ' items on tab ' + p.tab);
      }
    } else if (kind === 'track') {
      trackPreview(readTrackerFile(buf), info, f.name);
      return;
    } else if (kind === 'models') {
      const ml = readModelsFile(buf);
      S.store.models = ml.models; S.store.modelsFile = f.name; saveStore(true);
      addHistory('models', info, ml.models.length);
      compute();
      const auto = S.built ? autoAssign(S.built.rows.map(function (r) { return r.key; })) : 0;
      if (auto) compute();
      toast('Model list loaded: ' + ml.models.length + ' models' + (auto ? ' · ' + plural(auto, 'drawing') + ' assigned from your Tower + Typology' : ''));
    } else if (kind === 'lod') {
      openSubDialog({ file: f.name, sheets: readListFile(buf, f.name), info: info });
      return;
    }
    render();
  }

  function clearFile(kind) {
    if (kind === 'models') { S.store.models = []; S.store.modelsFile = ''; saveStore(true); toast('Model list removed. Models you assigned are kept.'); }
    else { S.files[kind] = null; idbDel(kind); }
    delete META.cur[kind]; saveMeta();
    if (kind === 'latest' || kind === 'prev') run(); else compute();
    render();
  }

  function startOver() {
    S.files = { latest: null, prev: null }; S.store = emptyStore(); S.pre = null;
    try { localStorage.removeItem(KEYS.store); } catch (e) { /* ignore */ }
    idbDel('latest'); idbDel('prev');
    META.cur = {}; META.dirty = false; META.savedAt = null; META.exportedAt = null; saveMeta();
    LOG = []; HIST = []; writeJSON(KEYS.log, LOG); writeJSON(KEYS.hist, HIST);
    S.sheetNames = []; resetView();
    run(); render(); toast('Cleared. Start again by loading the latest TIDP.');
  }

  /* ---------- 7. Editing values ---------- */

  function rowByKey(key) { return S.rowIndex ? S.rowIndex.get(key) : null; }
  /* Saves one value you typed. batch = do not save yet (several changes in a row). */
  function setVal(key, field, val, batch) {
    const row = rowByKey(key);
    if (!row) return;
    val = T.txt(val);
    if (T.txt(row.v[field]) === val) return;
    addLog(row.num, field, row.v[field], val);
    if (!S.store.rows[key]) S.store.rows[key] = { num: row.num, title: row.title, grp: row.grp, cat: row.cat, sub: row.sub, v: {} };
    const st = S.store.rows[key];
    if (val) st.v[field] = val; else delete st.v[field];
    if (!T.hasValues(st.v)) delete S.store.rows[key];
    if (val) row.v[field] = val; else delete row.v[field];
    if (!batch) saveStore();
    if (!batch && (field === 'Tower' || field === 'Typology') && autoAssign([key])) { compute(); toast('Model assigned from Tower + Typology'); }
  }
  function applyModel(key, m, batch) {
    setVal(key, 'Model Number', m ? m.num : '', true);
    if (m) { setVal(key, 'Tower', m.tower, true); setVal(key, 'Typology', m.typ, true); }
    if (!batch) saveStore();
  }
  function addColumn(name) {
    name = T.txt(name);
    if (!name) return 'Type a column name.';
    const u = name.toUpperCase();
    if (S.store.cols.some(function (c) { return c.toUpperCase() === u; }) || FIXED_FIELDS.some(function (c) { return c.toUpperCase() === u; }) || SYSTEM_HEADERS.indexOf(u) >= 0) return 'That name is already used.';
    S.store.cols.push(name); saveStore();
    return '';
  }
  function removeColumn(name) {
    S.store.cols = S.store.cols.filter(function (c) { return c !== name; });
    Object.keys(S.store.rows).forEach(function (k) {
      delete S.store.rows[k].v[name];
      if (!T.hasValues(S.store.rows[k].v)) delete S.store.rows[k];
    });
    saveStore(); compute();
  }

  /* ---------- 8. Views ---------- */

  const VIEWS = {};   // filled below: tab name -> function that returns the page HTML

  function render() {
    // keep the cursor in a search box, and the scroll position, while the page redraws
    const a = document.activeElement, keepId = a && a.id && /INPUT|SELECT|TEXTAREA/.test(a.tagName) ? a.id : '';
    const caret = keepId && a.selectionStart != null ? a.selectionStart : null;
    const same = S._lastView === S.view;
    const scroll = { win: window.scrollY, grids: {} };
    $$('.tw[data-grid]').forEach(function (el) { scroll.grids[el.getAttribute('data-grid')] = [el.scrollTop, el.scrollLeft]; });

    updateHeader();
    $$('.tab').forEach(function (t) { t.setAttribute('aria-selected', String(t.getAttribute('data-go') === S.view)); });
    $('#notice').innerHTML = noticeHtml();
    const needsTidp = ['files', 'subs'].indexOf(S.view) < 0 && !S.latest;
    $('#main').innerHTML = needsTidp ? welcomeHtml() : (VIEWS[S.view] || VIEWS.overview)();
    renderDetail();

    if (same) {
      $$('.tw[data-grid]').forEach(function (el) { const s = scroll.grids[el.getAttribute('data-grid')]; if (s) { el.scrollTop = s[0]; el.scrollLeft = s[1]; } });
      window.scrollTo(window.scrollX, scroll.win);
    }
    if (keepId) {
      const el = document.getElementById(keepId);
      if (el) { el.focus({ preventScroll: true }); if (caret != null && el.setSelectionRange) try { el.setSelectionRange(caret, caret); } catch (e) { /* not a text box */ } }
    }
    S._lastView = S.view;
    saveView();
    if (window.MIDP_EXT && MIDP_EXT.afterRender) MIDP_EXT.afterRender();
  }

  function updateHeader() {
    const p = S.latest && S.latest.project;
    $('#proj').innerHTML = S.latest
      ? esc([p.number, p.title].filter(Boolean).join(' · ') || S.latest.file) + ' · <span class="tag c-ink">' + esc(S.latest.tab) + '</span>' + (p.updated ? ' · TIDP updated ' + esc(fmtDay(p.updated, true)) : '')
      : 'No TIDP loaded';
    const due = exportDue();
    $('#saveInfo').className = 'save' + (due ? ' due' : '');
    $('#saveInfo').innerHTML = META.savedAt
      ? 'Saved ' + esc(fmtWhen(META.savedAt)) + '<br><b>' + (META.exportedAt ? (META.dirty ? 'Not exported since ' : 'Exported ') + esc(fmtWhen(META.exportedAt)) : (META.dirty ? 'Not exported yet' : '')) + '</b>'
      : '';
    $('#dirtyDot').hidden = !META.dirty;
    $('#exportBtn').disabled = !S.latest;
    $('#find').disabled = !S.latest;
    $$('[data-act="skin"]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-v') === SET.skin)); });
    $$('[data-act="mode"]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-v') === SET.mode)); });
    // list for the "Find drawing" box
    const fl = $('#findList');
    if (fl._for !== S.latest) {
      fl._for = S.latest;
      fl.innerHTML = itemsNow().filter(function (it) { return it.num; }).map(function (it) { return '<option value="' + esc(it.num) + '">' + esc(it.title) + '</option>'; }).join('');
    }
    // counts on the tabs
    const ms = modelStats();
    const counts = {
      tracker: itemsNow().length,
      chase: S.latest ? countDue('overdue') + countDue('soon') : 0,
      changes: changeRows().length,
      subs: (S.store.subs || []).length,
      pre: S.pre ? S.pre.rows.filter(function (r) { return r.kind !== 'ok'; }).length : '–',
      models: S.latest ? pct(ms.assigned, ms.total) + '%' : '0%',
      checks: window.MIDP_ISSUES_COUNT ? MIDP_ISSUES_COUNT() : S.checks.length,
      lists: window.MIDP_EXT && MIDP_EXT.listCount ? MIDP_EXT.listCount() : 0,
      folder: window.MIDP_FOLDER_COUNT ? MIDP_FOLDER_COUNT() : '–'
    };
    $$('[data-count]').forEach(function (el) { el.textContent = counts[el.getAttribute('data-count')]; });
  }
  function exportDue() { return META.dirty && (!META.exportedAt || Date.now() - META.exportedAt > 24 * 3600 * 1000); }
  function countDue(state) { let n = 0; S.due.forEach(function (d) { if (d.state === state) n++; }); return n; }

  function noticeHtml() {
    let h = '';
    S.errors.forEach(function (e) { h += '<div class="banner err" role="alert"><span><b>Problem.</b> ' + esc(e) + '</span></div>'; });
    S.warns.forEach(function (e) { h += '<div class="banner"><span><b>Check.</b> ' + esc(e) + '</span></div>'; });
    if (exportDue()) {
      h += '<div class="banner"><span><b>Back up your work.</b> You have changes that ' +
        (META.exportedAt ? 'have not been exported since ' + esc(fmtWhen(META.exportedAt)) : 'have never been exported') +
        '. They live only in this browser until you export them.</span><button class="btn small primary" type="button" data-act="export">Export now</button></div>';
    }
    return h;
  }

  function welcomeHtml() {
    return '<div class="box empty"><b>Load your TIDP to start</b>' +
      '<ol class="steps">' +
      '<li><span>Go to <b>Files</b> and drop in the <b>latest TIDP / MIDP</b> Excel from ACC. The <b>INT</b> tab is read by default.</span></li>' +
      '<li><span>Add the <b>previous TIDP</b> to see what was added, removed or revised.</span></li>' +
      '<li><span>Add your <b>model list</b> and each <b>submission list</b> (like PTA #3) to track models, submissions and due dates.</span></li>' +
      '</ol><div style="margin-top:16px"><button class="btn primary" type="button" data-go="files">Open Files</button></div></div>';
  }
  function chip(set, v, label, n, cur, color) {
    return '<button class="chip" type="button" data-act="set" data-set="' + set + '=' + esc(v) + '" aria-pressed="' + (String(cur) === String(v)) + '"' + (color ? ' style="--c:' + color + '"' : '') + '>' + esc(label) + (n != null ? '<span class="c">' + n + '</span>' : '') + '</button>';
  }

  /* ---------- 8a. Overview ---------- */

  VIEWS.overview = function () {
    const items = itemsNow(), rows = S.built.rows;
    const sentKeys = rows.filter(function (r) { return S.subByKey.has(r.key); }).length;
    const overdue = countDue('overdue'), soon = countDue('soon'), changes = changeRows();
    const kpi = function (o) {
      return '<button class="box kpi" type="button" data-go="' + o.go + '"' + (o.set ? ' data-set="' + o.set + '"' : '') + ' style="--c:' + o.c + '">' +
        '<span class="l">' + esc(o.l) + '</span><span class="v">' + esc(o.v) + '</span><span class="s">' + esc(o.s) + '</span>' + (o.extra || '') + '</button>';
    };
    let h = '<section class="kpis">' +
      kpi({ go: 'tracker', c: 'var(--ink)', l: 'In TIDP', v: items.length, s: S.cmp ? signed(items.length - S.prev.items.length) + ' since previous' : 'drawings, models & reports' }) +
      kpi({ go: 'subs', c: 'var(--ok)', l: 'Submitted', v: sentKeys, s: pct(sentKeys, items.length) + '% sent at least once', extra: blocks(pct(sentKeys, items.length), 'c-ok') }) +
      kpi({ go: 'chase', set: 'chase.filter=soon', c: 'var(--warn)', l: 'Due in ' + SET.soonDays + ' days', v: soon, s: 'not sent yet' }) +
      kpi({ go: 'chase', set: 'chase.filter=overdue', c: 'var(--bad)', l: 'Late', v: overdue, s: 'see chase list' }) +
      kpi({ go: 'changes', set: 'changes.filter=all', c: 'var(--info)', l: 'Changes', v: S.cmp ? changes.length : '—', s: S.cmp ? 'since previous TIDP' : 'add a previous TIDP' }) +
      kpi({ go: 'checks', set: 'checks.kind=', c: 'var(--odd)', l: 'Issues', v: window.MIDP_ISSUES_COUNT ? MIDP_ISSUES_COUNT() : S.checks.length, s: 'typos, naming, dates' }) +
      '</section>';

    // Stage progress + chase preview
    h += '<section class="cols"><div class="box"><div class="sec-h"><h2>Stage progress</h2><span class="hint">Done = submitted since the stage before</span></div>';
    if (!S.progress.length) h += '<div class="empty">No "date required" columns found in this TIDP tab.</div>';
    S.progress.forEach(function (p) {
      const future = p.planned - p.due;
      const when = p.planned ? (p.first === p.lastDate ? fmtDay(p.first, true) : fmtDay(p.first) + ' → ' + fmtDay(p.lastDate)) : 'no dates';

        blocks(pc, cls) + '<div class="pct">' + (p.due ? pc + '%' : '—') + '</div></div>';

        (d.state === 'overdue' ? d.lateDays + 'd late' : d.daysTo === 0 ? 'today' : 'in ' + d.daysTo + 'd') + '</span></li>';

    // Counts per category (click a row to open it) + latest changes
    const groups = T.counts(S.prev ? S.prev.items : [], items);

    let t = '<div class="tw free"><table class="plain"><thead><tr><th>Category</th><th class="num">Previous</th><th class="num">Latest</th><th class="num">Change</th><th style="width:24%">Share</th></tr></thead><tbody>';

          '</td><td class="num">' + delta(r.now - r.old) + '</td><td><div class="bar"><i style="width:' + (r.now / max * 100).toFixed(1) + '%"></i></div></td></tr>';

    let side = '<div class="box"><div class="sec-h"><h2>Latest changes</h2>' + (changes.length ? '<button class="btn small" type="button" data-go="changes">See all ' + changes.length + '</button>' : '') + '</div>';

  };
  function signed(n) { return (n > 0 ? '+' : '') + n; }
  function delta(d) { return S.cmp ? '<span class="' + (d > 0 ? 'd-up' : d < 0 ? 'd-dn' : '') + '">' + signed(d) + '</span>' : '<span class="muted">—</span>'; }
  /* Category keys and names, used by the overview and the Categories tab */
  function catKey(r) { return 'c:' + [r.grp, r.cat, r.sub].join('|'); }
  function catLabel(r) {

  function inCat(sel, it) {

  /* ---------- 8b. Tables: compact, filters, sorting, widths ---------- */
  /* Every data table is drawn by grid(). A column is:
       { k, label, text(row), html(row)?, sortKey(row)?, cls?, w (width px), stick?, edit?: field, nofilter?, nosort?, head? }
     text()    plain value used by the ▾ filter, sorting, search and "Export this view"
     html()    what the cell shows (defaults to text) */

  const GRIDS = {};   // last rows/columns drawn per table

  function colOf(cols, k) { return cols.find(function (c) { return c.k === k; }); }
  function cellText(c, r) { const v = c.text(r); return v == null ? '' : String(v); }
  function widthOf(name, c) { return ((SET.widths[name] || {})[c.k]) || c.w || 140; }

  /* Rows that pass the ▾ filters of a table (skip = leave one column out, for its own pop-up) */
  function gridFiltered(name, rows, cols, skip) {
    const cf = S.cf[name] || {};
    const keys = Object.keys(cf).filter(function (k) { return k !== skip && colOf(cols, k); });
    if (!keys.length) return rows;
    return rows.filter(function (r) {
      return keys.every(function (k) { return cf[k].indexOf(cellText(colOf(cols, k), r)) >= 0; });
    });
  }
  function gridSorted(name, rows, cols) {
    const s = S.sort[name], c = s && colOf(cols, s.k);
    if (!c) return rows;
    const key = c.sortKey || function (r) { return cellText(c, r); };
    return rows.slice().sort(function (a, b) {
      const x = key(a), y = key(b);
      const ex = x === '' || x == null, ey = y === '' || y == null;
      if (ex || ey) return ex === ey ? 0 : ex ? 1 : -1;     // blanks always last
      return s.dir * (typeof x === 'number' && typeof y === 'number' ? x - y : sortText(x, y));
    });
  }
  function activeFilters(name, cols) { return Object.keys(S.cf[name] || {}).filter(function (k) { return colOf(cols, k); }); }

  /* Draws a table. opts: { limit, more (S.ui key for "Show all"), key(r), rowClass(r), empty, title (for export) } */
  function grid(name, base, cols, opts) {
    opts = opts || {};
    const keyOf = opts.key || function (r) { return r.key; };
    const list = gridSorted(name, gridFiltered(name, base, cols), cols);
    GRIDS[name] = { base: base, cols: cols, list: list, title: opts.title || name };
    const cf = S.cf[name] || {}, s = S.sort[name], limit = opts.limit || Infinity, act = activeFilters(name, cols);
    const nTicked = S.picked ? list.filter(function (r) { return r && r.key && S.picked.has(r.key); }).length : 0;

    // line above the table: count, filters, export
    let h = '<div class="gridbar"><span class="hint">' + (list.length === base.length ? plural(base.length, 'row') : list.length + ' of ' + base.length + ' rows') +
      (act.length ? ' · filtered by ' + act.map(function (k) { return '<b>' + esc(colOf(cols, k).label) + '</b>'; }).join(', ') : '') + '</span>' +
      (act.length ? '<button class="btn small" type="button" data-act="cfclearall" data-grid="' + name + '">Clear column filters</button>' : '') +
      '<span class="grow"></span><button class="btn small" type="button" data-act="exportview" data-grid="' + name + '" title="' + (nTicked ? 'Export only the ticked rows' : 'Export the rows you see now (after filters)') + '">⤓ ' + (nTicked ? 'Export ' + nTicked + ' selected' : 'Export this view') + '</button>' +
      (base.length && base[0] && base[0].v && 'num' in base[0] ? '<label class="btn small" title="Load this view back after editing it in Excel — you see the changes first">⤒ Import edits<input type="file" data-kind="track" accept=".xlsx,.xlsm,.xls" hidden></label>' : '') + '</div>';

    // fixed widths (resizable) and sticky first columns
    let left = 0, total = 0;
    const meta = cols.map(function (c) {
      const w = widthOf(name, c), m = { w: w, left: c.stick ? left : null };
      if (c.stick) left += w;
      total += w;
      return m;
    });
    const stk = function (i) { return meta[i].left != null ? ' stk" style="left:' + meta[i].left + 'px' : ''; };
    h += '<div class="tw" data-grid="' + name + '"><table class="grid" style="width:' + total + 'px"><colgroup>' +
      meta.map(function (m, i) { return '<col data-k="' + esc(cols[i].k) + '" style="width:' + m.w + 'px">'; }).join('') + '</colgroup><thead><tr>' +
      cols.map(function (c, i) {
        const arrow = s && s.k === c.k ? '<span class="arr">' + (s.dir > 0 ? '▲' : '▼') + '</span>' : '';
        const on = !!cf[c.k];
        return '<th class="' + (c.nosort ? '' : 'sort') + stk(i) + '"' + (c.nosort ? '' : ' data-act="sort" data-grid="' + name + '" data-k="' + esc(c.k) + '" title="Click to sort"') + '>' +
          '<span class="th"><span class="tl">' + (c.head || esc(c.label)) + arrow + '</span>' +
          (c.nofilter ? '' : '<button class="fbtn' + (on ? ' on' : '') + '" type="button" data-act="cf" data-grid="' + name + '" data-k="' + esc(c.k) + '" aria-label="Filter ' + esc(c.label) + '" title="Filter and sort">' + (on ? '◆' : '▾') + '</button>') +
          '</span><span class="rz" data-rz="' + name + '|' + esc(c.k) + '" title="Drag to resize"></span></th>';
      }).join('') + '</tr></thead><tbody>';
    if (!list.length) {
      h += '<tr><td colspan="' + cols.length + '" class="empty">' + (opts.empty || 'No rows match.') + '</td></tr>';
    }
    list.slice(0, limit).forEach(function (r) {
      const key = keyOf(r), cls = [opts.rowClass ? opts.rowClass(r) : '', key && S.hl[name] === key ? 'hl' : ''].filter(Boolean).join(' ');
      h += '<tr' + (key ? ' data-key="' + esc(key) + '"' : '') + (cls ? ' class="' + cls + '"' : '') + '>' + cols.map(function (c, i) {
        if (c.edit) {
          return '<td class="edit' + stk(i) + '" contenteditable="true" spellcheck="false" data-key="' + esc(r.key) + '" data-field="' + esc(c.edit) + '" title="' + esc(r.v[c.edit] || '') + '">' + esc(r.v[c.edit] || '') + '</td>';
        }
        const text = cellText(c, r);
        return '<td class="' + (c.cls || '') + stk(i) + '"' + (text ? ' title="' + esc(text) + '"' : '') + '>' + (c.html ? c.html(r) : esc(text)) + '</td>';
      }).join('') + '</tr>';
    });
    h += '</tbody></table>';
    if (list.length > limit) h += '<div class="more"><button class="btn small" type="button" data-act="more" data-v="' + opts.more + '">Show all ' + list.length + ' rows</button></div>';
    return { html: h + '</div>', list: list };
  }

  /* The ▾ pop-up: sort, search values, tick values (like Excel) */
  let CF = null;
  function openCF(name, k, btn) {

    const vals = Array.from(cnt.keys()).sort(function (a, b) { return !a ? 1 : !b ? -1 : sortText(a, b); });
    const cur = (S.cf[name] || {})[k];
    CF = { name: name, k: k, vals: vals, cnt: cnt, sel: new Set(cur ? cur.filter(function (v) { return cnt.has(v); }) : vals), q: '' };
    const pop = $('#cfPop');
    pop.innerHTML = '<div class="sec-h" style="margin:0"><h2 style="margin:0">' + esc(col.label) + '</h2><button class="btn small" type="button" data-act="cfclose" aria-label="Close">✕</button></div>' +
      '<div class="toolbar" style="margin:0"><button class="btn small" type="button" data-act="cfsort" data-v="1">Sort A → Z</button><button class="btn small" type="button" data-act="cfsort" data-v="-1">Sort Z → A</button></div>' +

      '<div class="toolbar" style="margin:0"><button class="btn small" type="button" data-act="cfclear">Clear filter</button><span class="grow"></span><button class="btn small primary" type="button" data-act="cfok">Apply</button></div>';

    pop.style.top = Math.max(12, Math.min(r.bottom + 6, window.innerHeight - Math.min(pop.offsetHeight, window.innerHeight * 0.7) - 12)) + 'px';

  function cfShown() { const q = T.norm(CF.q); return CF.vals.filter(function (v) { return !q || T.norm(v || '(Blanks)').indexOf(q) >= 0; }); }

    }).join('') || '<div class="hint">No values</div>';

  }

  function resetLimit(name) { const u = S.ui[name]; if (u && 'limit' in u) u.limit = ROW_LIMIT; }
  function applyCF() {
    // with a search typed, keep only the ticked values that are shown (like Excel)
    const pick = (CF.q ? cfShown() : CF.vals).filter(function (v) { return CF.sel.has(v); });
    const f = S.cf[CF.name] = S.cf[CF.name] || {};

        text: function () { return ''; }, html: function (r) { return '<input type="checkbox" data-pick="' + esc(r.key) + '" aria-label="Tick"' + (S.picked.has(r.key) ? ' checked' : '') + '>'; } },

  }

  function modelCell(r) {

        ? '<a href="' + esc(i.model.url) + '" target="_blank" rel="noopener" title="' + esc((name ? name + ' · ' : '') + 'Open in ACC') + '">' + esc(i.num) + ' ↗</a>'

  }

  /* Rows after the toolbar filters (the ▾ column filters come on top) */
  function trackerBase() {
    const u = S.ui.tracker, q = T.norm(u.q), cols = trCols();
    return S.built.rows.concat(u.removed ? S.built.removed : []).filter(function (r) {

      }
      if (q && T.norm(cols.map(function (c) { return cellText(c, r); }).join(' ') + ' ' + r.grp).indexOf(q) < 0) return false;

  VIEWS.tracker = function () {

      '<label class="hint"><input type="checkbox" data-change="tracker.removed"' + (u.removed ? ' checked' : '') + '> Show removed</label>' +
      '<span class="grow"></span>' +
      '<button class="btn small" type="button" data-act="colpick">Columns</button>' +
      '<button class="btn small" type="button" data-act="addcol">+ Column</button>' +
      '</div>';
    if (S.picked.size) {
      h += '<div class="banner info picked"><span><b>' + plural(S.picked.size, 'drawing') + ' ticked.</b></span><span class="toolbar" style="margin:0">' +
        '<button class="btn small primary" type="button" data-act="drawinglist">⤓ Export drawing list</button>' +
        '<button class="btn small" type="button" data-act="prepicked">Pre-check these</button>' +
        '<button class="btn small" type="button" data-act="unpick">Untick all</button></span></div>';
    }
    return h + grid('tracker', trackerBase(), cols, { limit: u.limit, more: 'tracker', title: 'Tracker', rowClass: function (r) { return r.removed ? 'removed' : ''; } }).html +
      '<p class="hint">▾ on a heading to filter · click a heading to sort · drag a heading edge to resize · click a yellow cell to type · click a drawing number for details</p>';
  };

  /* ---------- 8d. Chase list ---------- */

  /* Which week the next stage date falls in: w0 = this week … later */
  function weekOf(d) {
    if (!d || d.state === 'overdue' || !d.next || d.nextSent) return '';
    const today = T.dayNum(S.today), monday = today - ((new Date(S.today + 'T00:00:00').getDay() + 6) % 7);
    const w = Math.floor((T.dayNum(d.next.iso) - monday) / 7);
    return w >= 4 ? 'later' : 'w' + Math.max(0, w);
  }
  const WEEKS = [['w0', 'This week'], ['w1', 'Next week'], ['w2', 'In 2 weeks'], ['w3', 'In 3 weeks'], ['later', 'Later']];

  function chaseList(filter, stage, q, sort) {
    q = T.norm(q);
    const out = S.built.rows.filter(function (r) {
      const d = S.due.get(r.key);
      if (!d) return false;
      if (filter === 'reissue') { if (!needsReissue(r)) return false; }
      else if (filter === 'both') { if (d.state !== 'overdue' && d.state !== 'soon') return false; }
      else if (filter === 'overdue' || filter === 'soon') { if (d.state !== filter) return false; }
      else if (weekOf(d) !== filter) return false;
      if (stage && dueStage(d) !== stage) return false;
      if (q && T.norm(r.num + ' ' + r.title + ' ' + catText(r)).indexOf(q) < 0) return false;
      return true;
    });
    const score = function (r) { const d = S.due.get(r.key); return d.state === 'overdue' ? d.lateDays : -1000 - (d.daysTo || 0); };
    out.sort(function (a, b) {
      if (sort === 'num') return sortText(a.num, b.num);
      const x = score(a), y = score(b);
      // "recent": the most recently missed first, then what is due next
      if (sort === 'recent') return (x >= 0 && y >= 0) ? x - y || sortText(a.num, b.num) : y - x;
      return y - x || sortText(a.num, b.num);
    });
    return out;
  }

  function chaseState(r) {
    const d = S.due.get(r.key);
    if (S.ui.chase.filter === 'reissue') return { text: 'Re-issue', html: tag('Re-issue', 'c-info', true) };
    if (d.state === 'overdue') return { text: 'Late', html: tag(d.lateDays + ' days late', 'c-bad', true) };
    const lbl = d.daysTo === 0 ? 'Due today' : 'Due in ' + d.daysTo + ' days';
    return { text: d.state === 'soon' ? 'Due soon' : 'Upcoming', html: tag(lbl, d.state === 'soon' ? 'c-warn' : 'c-info', true) };
  }
  function chaseCols() {
    const d = function (r) { return S.due.get(r.key); };
    const last = function (r) { return (S.subByKey.get(r.key) || [])[0]; };
    return [
      { k: 'state', label: 'State', w: 130, text: function (r) { return chaseState(r).text; }, html: function (r) { return chaseState(r).html; } },
      { k: 'days', label: 'Days', w: 76, cls: 'num', text: function (r) { const x = d(r); return x.state === 'overdue' ? String(x.lateDays) : x.daysTo != null ? String(x.daysTo) : ''; },
        sortKey: function (r) { const x = d(r); return x.state === 'overdue' ? x.lateDays : x.daysTo != null ? -x.daysTo : ''; } },
      { k: 'stage', label: 'Stage', w: 170, text: function (r) { return dueStage(d(r)); } },
      { k: 'date', label: 'Date due', w: 100, cls: 'mono', text: function (r) { return fmtDay(dueDate(d(r)), true); }, sortKey: function (r) { return dueDate(d(r)); } },
      { k: 'num', label: 'Drawing number', w: 250, stick: true, cls: 'mono', text: function (r) { return r.num; }, html: function (r) { return numLink(r.num, r.key); } },
      { k: 'rev', label: 'Rev', w: 76, text: function (r) { return r.rev; }, html: revHtml },
      { k: 'title', label: 'Description', w: 320, text: function (r) { return r.title; } },
      { k: 'sent', label: 'Last sent', w: 150, text: function (r) { const s = last(r); return s ? subTypeOf(s.sub) + (s.r.rev ? ' (' + s.r.rev + ')' : '') : 'Never'; },
        html: function (r) { const s = last(r); return s ? esc(subTypeOf(s.sub)) + ' · <span class="mono">' + fmtDay(s.sub.date) + (s.r.rev ? ' ' + esc(s.r.rev) : '') + '</span>' : '<span class="muted">Never</span>'; },
        sortKey: function (r) { const s = last(r); return s ? s.sub.date : ''; } },
      { k: 'who', label: 'Assigned to', w: 150, text: function (r) { return T.txt(r.v['Assigned To']); } },
      { k: 'cat', label: 'Category', w: 240, text: function (r) { return [r.grp, catText(r)].filter(Boolean).join(' › '); }, html: catCell },
      { k: 'model', label: 'Model number', w: 250, cls: 'mono', text: modelText, html: modelCell }
    ];
  }

  VIEWS.chase = function () {
    const u = S.ui.chase;
    const late = countDue('overdue'), soon = countDue('soon');
    const reissue = S.built.rows.filter(needsReissue).length;
    const weeks = {};
    S.built.rows.forEach(function (r) { const w = weekOf(S.due.get(r.key)); if (w) weeks[w] = (weeks[w] || 0) + 1; });
    const stages = uniq(chaseList(u.filter, '', '', 'num').map(function (r) { return dueStage(S.due.get(r.key)); }));
    let h = '<div class="toolbar"><div class="chips">' +
      chip('chase.filter', 'overdue', 'Late', late, u.filter, 'var(--bad)') +
      chip('chase.filter', 'soon', 'Due in ' + SET.soonDays + ' days', soon, u.filter, 'var(--warn)') +
      chip('chase.filter', 'both', 'Both', late + soon, u.filter) +
      chip('chase.filter', 'reissue', 'Re-issue', reissue, u.filter, 'var(--info)') + '</div>' +
      '<span class="hint">Coming up:</span><div class="chips">' + WEEKS.map(function (w) { return chip('chase.filter', w[0], w[1], weeks[w[0]] || 0, u.filter, 'var(--info)'); }).join('') + '</div></div>' +
      '<div class="toolbar"><select id="chStage" data-change="chase.stage" aria-label="Stage">' + options(stages, u.stage, 'All stages') + '</select>' +
      '<select id="chSort" data-change="chase.sort" aria-label="Sort">' + options([['recent', 'Most recently due first'], ['late', 'Longest late first'], ['num', 'By number']], u.sort) + '</select>' +
      '<input type="search" id="chQ" data-input="chase.q" placeholder="Search number or title" value="' + esc(u.q) + '" aria-label="Search the chase list"></div>';
    const help = {
      reissue: 'Drawings whose last submission was an <b>older revision</b> than the TIDP now shows — send the latest revision.',
      def: 'A drawing is <b>late</b> when a stage date has passed and it has not been submitted since the stage before. <b>Due soon</b> = next stage date within ' + SET.soonDays + ' days and not sent yet. "Coming up" groups the next dates by week.'
    };
    h += '<div class="banner info"><span><b>How this works.</b> ' + (u.filter === 'reissue' ? help.reissue : help.def) + ' Load every submission list so this stays accurate.</span></div>';
    return h + grid('chase', chaseList(u.filter, u.stage, u.q, u.sort), chaseCols(), { limit: u.limit, more: 'chase', title: 'Chase list', empty: 'All clear — nothing here.' }).html;
  };

  /* ---------- 8e. Categories ---------- */

  VIEWS.cats = function () {
    const u = S.ui.cats, items = itemsNow();

    let h = '<div class="toolbar"><div class="chips">' + chip('cats.mode', 'list', 'Categories', null, u.mode) + chip('cats.mode', 'grid', 'Tower × category', null, u.mode) + '</div>' +

    // left: the category tree
    const q = T.norm(u.q);
    let tree = '<input type="search" id="catQ" data-input="cats.q" placeholder="Find a category" value="' + esc(u.q) + '" aria-label="Find a category" style="width:100%;margin-bottom:8px">' +
      '<div class="tree">';
    groups.forEach(function (g) {
      const gItems = items.filter(function (it) { return T.norm(it.grp) === T.norm(g.grp); });
      const leaves = g.rows.filter(function (r) { return !q || T.norm(catLabel(r)).indexOf(q) >= 0; });
      if (q && !leaves.length) return;
      tree += treeRow('g:' + g.grp, g.grp, g.old, g.now, sent(gItems), true);
      leaves.forEach(function (r) {

      });
    });
    tree += '</div>';

    // right: the drawings in the chosen category
    let right;
    if (!u.sel) right = '<div class="empty"><b>Pick a category</b>Its drawings, what changed and the next free number show here.</div>';
    else {
      const name = u.sel.indexOf('g:') === 0 ? u.sel.slice(2) : (function () { const p = u.sel.slice(2).split('|'); return p[0] + ' › ' + catLabel({ grp: p[0], cat: p[1], sub: p[2] }); })();
      const list = S.built.rows.filter(function (r) { return inCat(u.sel, r); });
      const removed = S.cmp ? S.cmp.removed.filter(function (it) { return inCat(u.sel, it); }).map(function (it) { return Object.assign({}, it, { v: {}, change: 'Removed from TIDP', removed: true }); }) : [];
      const late = list.filter(function (r) { return (S.due.get(r.key) || {}).state === 'overdue'; }).length;

      right = '<div class="sec-h"><h2>' + esc(name) + '</h2><button class="btn small" type="button" data-go="tracker" data-set="tracker.cat=' + esc(u.sel.indexOf('c:') === 0 ? u.sel.slice(2).split('|')[1] : '') + '">Open in tracker</button></div>' +
        '<div class="toolbar">' + tag(plural(list.length, 'drawing'), 'c-ink') + tag(sent(list) + ' sent', 'c-ok') + (late ? tag(late + ' late', 'c-bad') : '') + (removed.length ? tag(removed.length + ' removed', 'c-bad') : '') + '</div>' +
        (free.length ? '<div class="banner info"><span><b>Next free number:</b> ' + free.join(' · ') + '</span></div>' : '') +
        grid('cats', list.concat(removed), catsCols(), { title: 'Category', rowClass: function (r) { return r.removed ? 'removed' : ''; } }).html;
    }
    return h + '<div class="cats"><div class="box">' + tree + '</div><div class="box">' + right + '</div></div>';
  };
  function treeRow(key, label, old, now, sent, group) {
    const d = now - old;
    return '<button type="button" class="tree-row' + (group ? ' grp' : '') + (S.ui.cats.sel === key ? ' on' : '') + '" data-act="set" data-set="cats.sel=' + esc(key) + '">' +
      '<span class="tn">' + esc(label) + '</span><span class="tc">' + (S.cmp && d ? '<span class="' + (d > 0 ? 'd-up' : 'd-dn') + '">' + signed(d) + '</span> ' : '') + now +
      ' <span class="muted">· ' + pct(sent, now) + '% sent</span></span></button>';
  }
  function catsCols() {
    const d = function (r) { return S.due.get(r.key); };
    return [
      { k: 'num', label: 'Drawing number', w: 250, stick: true, cls: 'mono', text: function (r) { return r.num; }, html: function (r) { return numLink(r.num, r.key); } },
      { k: 'rev', label: 'Rev', w: 76, text: function (r) { return r.rev; }, html: revHtml },
      { k: 'title', label: 'Description', w: 320, text: function (r) { return r.title; } },
      { k: 'tower', label: 'Tower', w: 92, text: function (r) { return r.parts ? r.parts[2] || '' : ''; } },
      { k: 'change', label: 'Change', w: 112, text: function (r) { return r.change || ''; }, html: function (r) { return changeTag(r.change); } },
      { k: 'due', label: 'Due', w: 140, text: function (r) { return r.removed ? '' : DUE[d(r).state].label; }, html: function (r) { return r.removed ? '' : dueCell(d(r)); }, sortKey: function (r) { return r.removed ? '' : dueDate(d(r)); } },
      { k: 'sent', label: 'Sent', w: 90, text: function (r) { const s = S.subByKey.get(r.key) || []; return s.length ? s.length + '×' : 'Never'; } },
      { k: 'wstat', label: 'Work status', w: 150, text: function (r) { return T.txt(r.v['Work Status']); } },
      { k: 'model', label: 'Model number', w: 250, cls: 'mono', text: function (r) { return r.removed ? '' : modelText(r); }, html: function (r) { return r.removed ? '' : modelCell(r); } }
    ];
  }
  /* Tower × category: sent / total per cell, coloured by how much is sent */
  function towerGridHtml(groups) {
    const items = itemsNow().filter(function (it) { return it.num; });
    const towers = uniq(items.map(function (it) { return it.parts[2] || ''; })).sort(sortText);
    let h = '<div class="tw free" data-grid="heat"><table class="plain heat"><thead><tr><th>Category</th>' + towers.map(function (t) { return '<th class="num">' + esc(t) + '</th>'; }).join('') + '<th class="num">Total</th></tr></thead><tbody>';
    groups.forEach(function (g) {
      h += '<tr class="g"><td colspan="' + (towers.length + 2) + '">' + esc(g.grp) + '</td></tr>';
      g.rows.forEach(function (r) {
        const key = catKey(r), list = items.filter(function (it) { return inCat(key, it); });
        if (!list.length) return;
        h += '<tr><td>' + esc(catLabel(r)) + '</td>' + towers.map(function (t) {
          const cell = list.filter(function (it) { return (it.parts[2] || '') === t; });
          if (!cell.length) return '<td></td>';
          const s = cell.filter(function (it) { return S.subByKey.has(it.key); }).length, p = s / cell.length;
          return '<td class="num hc ' + (p >= 1 ? 'h-ok' : p > 0 ? 'h-part' : 'h-none') + '" data-act="heatcell" data-v="' + esc(key) + '" data-t="' + esc(t) + '" title="' + esc(t + ': ' + s + ' of ' + cell.length + ' sent') + '">' + s + '/' + cell.length + '</td>';
        }).join('') + '<td class="num"><b>' + list.length + '</b></td></tr>';
      });
    });
    return h + '</tbody></table></div><p class="hint"><span class="tag fill c-ok">all sent</span> <span class="tag fill c-warn">some sent</span> <span class="tag fill c-bad">none sent</span></p>';
  }

  /* ---------- 8f. Changes ---------- */

  function changeDetailText(r) {
    return r.changes.length ? r.changes.map(function (c) { return c.field + ': ' + (c.from || '(blank)') + ' → ' + (c.to || '(blank)'); }).join(' | ') : (r.note || '');
  }
  VIEWS.changes = function () {

  };

  /* ---------- 8g. Submissions ---------- */

  }
  VIEWS.subs = function () {

        '<span class="l">' + esc(fmtDay(sb.date, true)) + '</span><span class="v" style="font-size:28px">' + esc(subTypeOf(sb)) + '</span>' +

        '</button>';
    }).join('') + '</div>';

    const sb = subById(u.sel), c = subCounts(sb);
    h += '<div class="box"><div class="sec-h"><h2>' + esc(subTypeOf(sb)) + '</h2><div class="toolbar" style="margin:0">' +
      '<label class="field"><span>Date</span><input type="date" id="sbDate" data-change="subdate" value="' + esc(sb.date) + '"></label>' +
      '<label class="field"><span>Name</span><input type="text" id="sbType" data-change="subtype" value="' + esc(subTypeOf(sb)) + '"></label>' +
      '<label class="field"><span>Note</span><input type="text" id="sbNote" data-change="subnote" value="' + esc(sb.note || '') + '"></label>' +
      (subs.length > 1 ? '<span class="seg" style="align-self:flex-end" title="The order used in every tab and in Excel"><button type="button" data-act="submove" data-v="-1"' + (subs[0].id === sb.id ? ' disabled' : '') + '>◀ Earlier</button><button type="button" data-act="submove" data-v="1"' + (subs[subs.length - 1].id === sb.id ? ' disabled' : '') + '>Later ▶</button></span>' : '') +
      '<button class="btn small ' + (u.arm === sb.id ? 'danger' : '') + '" type="button" data-act="subdel" style="align-self:flex-end">' + (u.arm === sb.id ? 'Click again to delete' : 'Delete') + '</button>' +
      '</div></div>';

  /* ---------- 8h. Models ---------- */

  function modelsList() {
    const u = S.ui.models, q = T.norm(u.q);

      if (!isAssignable(r)) return false;
      const i = mInfo(r);
      if (u.filter === 'conflict' ? !i.conflict : u.filter !== 'all' && i.state !== u.filter) return false;
      if (u.cat && r.cat !== u.cat) return false;
      if (u.tower && (T.txt(r.v.Tower) || i.sugg.tower || '') !== u.tower) return false;
      if (q) {
        const m = i.model || i.sugg.model;
        if (T.norm([r.num, r.title, r.cat, r.sub, r.v.Tower, r.v.Typology, r.v['Model Number'], m ? m.name : ''].join(' ')).indexOf(q) < 0) return false;
      }
      return true;
    });
  }
  const M_STATE = { assigned: ['Assigned', 'c-ok'], suggested: ['Suggested', 'c-info'], open: ['Not assigned', 'c-warn'] };
  function modelsCols() {
    const u = S.ui.models;

      } },
      { k: 'num', label: 'Drawing number', w: 250, stick: true, cls: 'mono', text: function (r) { return r.num; }, html: function (r) { return numLink(r.num, r.key); } },
      { k: 'title', label: 'Description', w: 300, text: function (r) { return r.title; } },
      { k: 'cat', label: 'Category', w: 220, text: function (r) { return [r.grp, catText(r)].filter(Boolean).join(' › '); }, html: catCell },

      { k: 'typ', label: 'Typology', w: 120, text: function (r) { return T.txt(r.v.Typology); } },
      { k: 'model', label: 'Model number', w: 300, cls: 'mono', text: function (r) { const i = mInfo(r); return i.state === 'assigned' ? i.num : i.state === 'suggested' ? i.sugg.model.num + ' (suggested)' : ''; }, html: function (r) {

        if (u.editing === r.key) return modelSelect(r, i);

        if (i.state === 'suggested') return '<span class="muted">' + esc(i.sugg.model.num) + ' · ' + esc(i.sugg.model.name) + '</span>';
        return '<span class="muted">—</span>';
      } },
      { k: 'acts', label: 'Actions', w: 170, nofilter: true, nosort: true, text: function () { return ''; }, html: function (r) {
        const i = mInfo(r);

        return (i.state === 'suggested' ? '<button class="btn small primary" type="button" data-act="maccept" data-key="' + esc(r.key) + '">Accept</button> ' : '') +
          (S.store.models.length ? '<button class="btn small" type="button" data-act="mpick" data-key="' + esc(r.key) + '">' + (i.state === 'open' ? 'Choose' : 'Change') + '</button> ' : '') +
          (i.state === 'assigned' ? '<button class="btn small" type="button" data-act="mclear" data-key="' + esc(r.key) + '">Clear</button>' : '');
      } }
    ];
  }
  /* What is on screen in the Models tab, after every filter (used by "Accept all") */
  function modelsShown() { return gridFiltered('models', modelsList(), modelsCols()); }

  VIEWS.models = function () {
    const u = S.ui.models;
    let h = '<div class="toolbar"><div class="chips">' + chip('models.mode', 'drawings', 'Drawings → model', null, u.mode) + chip('models.mode', 'usage', 'Model usage', null, u.mode) + '</div></div>';
    if (!S.store.models.length) h += '<div class="banner info"><span><b>No model list loaded.</b> Add it in Files to get model suggestions and ACC links.</span><button class="btn small" type="button" data-go="files">Open Files</button></div>';
    if (u.mode === 'usage') return h + modelUsageHtml();
    const st = modelStats();
    const cats = [], towers = [];
    S.built.rows.forEach(function (r) {
      if (!isAssignable(r)) return;
      if (r.cat && cats.indexOf(r.cat) < 0) cats.push(r.cat);
      const t = T.txt(r.v.Tower) || (S.sugg.get(r.key) || {}).tower || '';
      if (t && towers.indexOf(t) < 0) towers.push(t);
    });
